microtask:
  id: "mt-001-001"
  title: "Implement Order.cancel() guarding against shipped status"
  traceability:
    feature_id: "feat-001"
    feature_name: "Order cancellation"
    strategic_context: >-
      Delivers func-001/func-002 of feat-001: an operator needs to stop an
      order that must not proceed. The domain model already exposes
      OrderStatus.CREATED/SHIPPED/CANCELLED; only the transition method is
      missing.
    architectural_components:
      - "src/orders/order.py :: Order.cancel"
    origin_decisions: ["ad-001"]
  category: "backend"
  type: "implementation"
  architectural_layer: "domain"
  description: >-
    Add a cancel() method to the Order dataclass in src/orders/order.py. If
    status is OrderStatus.SHIPPED, raise ValueError("cannot cancel a shipped
    order") and leave status unchanged. Otherwise set status to
    OrderStatus.CANCELLED. Follows the guard-clause invariant pattern
    ratified in ad-001 (same shape as the existing ship() method).
  input:
