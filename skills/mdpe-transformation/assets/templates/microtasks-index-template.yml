# ====================================================================
# MDPE Framework - Micro-Task Index
# ====================================================================
# Version: 2.0.0
# Purpose: Template for the consolidated micro-task index of a feature
# Phase: Transformation Layer (Organization)
# ====================================================================
#
# This file contains the template for the general micro-task index.
# The index consolidates all micro-tasks of a feature, providing:
#   - Executive summary with statistics
#   - List of all micro-tasks
#   - Execution order in waves
#   - Dependency graph
#   - Aggregated risks
#   - Decomposition validation
#
# Location of the generated file:
#   docs/transformation/{feature-id}/microtasks-index.yml
# ====================================================================

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# TEMPLATE: MICRO-TASK INDEX
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# File: microtasks-index.yml
# Description: Consolidated index of all micro-tasks for the feature
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

microtasks_index_template:
  # ──────────────────────────────────────────────────────────────────
  # FILE HEADER
  # ──────────────────────────────────────────────────────────────────
  # # ====================================================================
  # # MDPE Framework - Micro-Task Index
  # # ====================================================================
  # # Feature: {feature-name}
  # # Feature ID: {feature-id}
  # # Version: 1.0.0
  # # Date: {YYYY-MM-DD}
  # # ====================================================================
  # ──────────────────────────────────────────────────────────────────

  microtasks_index:
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # METADATA
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  metadata:
    version: "1.0.0"
    created_at: "YYYY-MM-DD"
    updated_at: "YYYY-MM-DD"
    feature_id: "feat-XXX"
    feature_name: "Feature Name"
    created_by: "Name of the Architect/Tech Lead"
  
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # EXECUTIVE SUMMARY
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  summary:
    total_microtasks: 20
    total_estimated_time: 80  # hours
    
    category_distribution:
      backend: 10
      frontend: 5
      database: 3
      infra: 1
      docs: 1
      tests: 0  # Tests embedded in each microtask
    
    layer_distribution:
      domain: 6
      application: 8
      infrastructure: 4
      presentation: 1
      docs: 1
    
    complexity_distribution:
      low: 8
      medium: 10
      high: 2
    
    overall_status:
      pending: 20
      in_progress: 0
      completed: 0
      blocked: 0
      cancelled: 0
  
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # LIST OF MICRO-TASKS
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  microtasks:
    - id: "mt-XXX-001"
      title: "Micro-task title"
      category: "backend"
      layer: "domain"
      estimated_hours: 4
      complexity: "medium"
      technical_priority: "high"
      status: "pending"
      file: "microtasks/mt-XXX-001.yml"
      
      dependencies_upstream: []
      dependencies_downstream:
        - "mt-XXX-002"
        - "mt-XXX-003"
    
    - id: "mt-XXX-002"
      title: "Micro-task title"
      category: "backend"
      layer: "application"
      estimated_hours: 3
      complexity: "medium"
      technical_priority: "high"
      status: "pending"
      file: "microtasks/mt-XXX-002.yml"
      
      dependencies_upstream:
        - "mt-XXX-001"
      dependencies_downstream:
        - "mt-XXX-005"
  
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # SUGGESTED EXECUTION ORDER
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  execution_order:
    wave_1:
      description: "Foundation - Domain Layer and Database"
      microtasks:
        - "mt-XXX-001"
        - "mt-XXX-002"
        - "mt-XXX-003"
      estimated_time: 12  # hours
    
    wave_2:
      description: "Application Layer - Commands and Queries"
      microtasks:
        - "mt-XXX-004"
        - "mt-XXX-005"
      estimated_time: 8  # hours
    
    wave_3:
      description: "Infrastructure - Repositories and Integrations"
      microtasks:
        - "mt-XXX-006"
        - "mt-XXX-007"
      estimated_time: 10  # hours
  
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # DEPENDENCY GRAPH
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  dependency_graph:
    # Textual representation of the graph
    # mt-XXX-001 → mt-XXX-002 → mt-XXX-005
    #           ↘ mt-XXX-003 → mt-XXX-006
    description: |
      Dependency structure between micro-tasks.
      The full graph lives in dependencies/full-graph.yml; the rendered
      view (Mermaid, waves and critical path) is generated by the
      mdpe-graph skill into docs/graph/. No external tool required.
    
    critical_path:
      - "mt-XXX-001"
      - "mt-XXX-002"
      - "mt-XXX-005"
      - "mt-XXX-008"
      - "mt-XXX-010"
    
    critical_path_time: 25  # hours
  
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # AGGREGATED RISKS
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  feature_risks:
    - id: "risk-feat-XXX-001"
      type: "technical"
      description: "Identified risk affecting multiple microtasks"
      affected_microtasks:
        - "mt-XXX-005"
        - "mt-XXX-006"
      probability: "medium"
      impact: "high"
      mitigation: "Mitigation strategy"
  
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # VALIDATION
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  validation:
    total_microtasks_validated: true
    estimate_range_validated: true  # 15-25 microtasks
    aert_validated: true
    dependencies_validated: true
    no_cycles: true
    schema_validated: true
    
    observations: |
      - All microtasks have well-defined input/output
      - Estimates are within the 8-hour limit
      - Dependency graph has no cycles
      - Valid YAML against the schema

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# USAGE INSTRUCTIONS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

usage_instructions:
  description: |
    This template is used to create the consolidated index of all
    micro-tasks for a feature after decomposition.
  
  when_to_use: |
    - After decomposing features into micro-tasks (TL-01)
    - After dependency analysis (TL-02)
    - After atomicity validation (TL-03)
    - After technical prioritization (TL-04)
  
  generation_flow:
    step_1:
      description: "Gather all micro-tasks"
      input: "microtasks/*.yml"
      action: "Collect information from each individual micro-task"
    
    step_2:
      description: "Calculate statistics"
      action: |
        - Count totals by category
        - Count totals by layer
        - Count totals by complexity
        - Sum the total estimated time
    
    step_3:
      description: "Organize into waves"
      action: |
        - Analyze dependencies
        - Group by levels in the graph
        - Identify parallelization
    
    step_4:
      description: "Identify the critical path"
      action: |
        - Calculate the longest sequence
        - Document the critical path duration
    
    step_5:
      description: "Validate the decomposition"
      action: |
        - Verify the 15-25 microtasks range
        - Validate AERT for each task
        - Confirm the graph is acyclic
        - Validate the YAML against the schema
  
  quality_criteria:
    - "Total of 15-25 micro-tasks per feature"
    - "Each micro-task estimated at up to 8 hours"
    - "Balanced distribution by category"
    - "Dependency graph with no cycles (DAG)"
    - "Critical path identified"
    - "Execution order defined in waves"
    - "Full AERT validation for each task"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# DIRECTORY STRUCTURE
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

directory_structure:
  description: |
    docs/transformation/{feature-id}/
    ├── microtasks/
    │   ├── mt-XXX-001.yml             # Individual micro-task
    │   ├── mt-XXX-002.yml
    │   └── ...
    ├── categories/
    │   ├── backend.yml
    │   ├── frontend.yml
    │   └── ...
    ├── dependencies/
    │   ├── full-graph.yml
    │   ├── hard-dependencies.yml
    │   └── ...
    ├── execution/
    │   ├── mt-XXX-001-context.yml
    │   └── ...
    └── microtasks-index.yml           # ← This file
