# ====================================================================
# MDPE Framework - Atomic Micro-Task - Template
# ====================================================================
# Version: 1.0.0
# Purpose: Template for decomposing features into micro-tasks
# ====================================================================

microtask:
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # IDENTIFICATION
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  id: "mt-XXX-YYY"  # Format: mt-{feature-number}-{sequence}. E.g.: mt-001-001
  title: "Clear and descriptive title of the micro-task"
  
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # TRACEABILITY
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  traceability:
    feature_id: "feat-XXX"
    feature_name: "Origin Feature Name"
    strategic_context: |
      Why does this micro-task exist?
      Which business value does it contribute?
      How does it connect to strategic objectives?
    
    architectural_components:
      - "Domain/Aggregates/AggregateName"
      - "Application/Commands/CommandName"
      - "Infrastructure/Persistence/Repositories/RepositoryName"
  
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # CATEGORY AND TYPE
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  category: "backend"  # backend | frontend | database | infra | docs | tests
  type: "implementation"  # implementation | refactoring | bugfix | documentation | testing
  
  architectural_layer: "domain"  # domain | application | infrastructure | presentation | tests | docs
  
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # DESCRIPTION
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  description: |
    Detailed description of the micro-task.
    - What exactly must be done?
    - Which architectural patterns must be followed?
    - Which project conventions must be respected?
  
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # FORMAL CONTRACT (IOQD)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  
  # ──────────────────────────────────────────────────────────────────
  # INPUT - What must exist BEFORE
  # ──────────────────────────────────────────────────────────────────
  input:
    required_artifacts:
      - type: "code"
        description: "Existing file or component required"
        location: "path/to/file.cs"
        status: "exists"  # exists | must_be_created_first
      
      - type: "documentation"
        description: "Specification or architectural decision"
        location: "docs/architecture/decision.md"
        status: "exists"
    
    technical_knowledge:
      - "Domain-Driven Design (Aggregates, Value Objects)"
      - "CQRS Pattern"
      - "Entity Framework Core"
    
    tools:
      - name: ".NET CLI"
        version: "8.0"
      - name: "Entity Framework Core Tools"
        version: "8.0"
    
    external_resources:
      - type: "api"
        description: "Required external API or service"
        availability: "available"  # available | needs_setup | unavailable
  
  # ──────────────────────────────────────────────────────────────────
  # OUTPUT - What will be PRODUCED
  # ──────────────────────────────────────────────────────────────────
  output:
    generated_artifacts:
      - type: "code"
        description: "Class, interface, or component created"
        location: "path/to/new-file.cs"
        language: "csharp"
      
      - type: "test"
        description: "Unit/integration tests"
        location: "path/to/file-test.cs"
        expected_coverage: "100%"
      
      - type: "documentation"
        description: "Generated technical documentation"
        location: "docs/technical/component.md"
    
    system_changes:
      - type: "database"
        description: "Migration created to add table X"
        impact: "low"  # low | medium | high
      
      - type: "api"
        description: "New endpoint /api/v1/resource"
        breaking_change: false
    
    expected_metrics:
      - metric: "Cyclomatic complexity"
        target: "<= 10"
      
      - metric: "Test coverage"
        target: ">= 90%"
      
      - metric: "Performance"
        target: "< 100ms response time"
  
  # ──────────────────────────────────────────────────────────────────
  # QUALITY CRITERIA
  # ──────────────────────────────────────────────────────────────────
  quality_criteria:
    functional:
      - criterion: "Input validation works correctly"
        type: "validation"
        how_to_verify: "Run unit test TestInputValidation()"
      
      - criterion: "Business rule implemented as specified"
        type: "business"
        how_to_verify: "Run integration test TestBusinessRule()"
    
    non_functional:
      - criterion: "Acceptable performance"
        type: "performance"
        metric: "Response time < 100ms"
        how_to_verify: "Run performance test with BenchmarkDotNet"
      
      - criterion: "Security implemented"
        type: "security"
        metric: "Authentication/authorization validation present"
        how_to_verify: "Code review + security test"
      
      - criterion: "Resilience guaranteed"
        type: "resilience"
        metric: "Circuit breaker and retry implemented"
        how_to_verify: "Simulated failure test"
    
    code_quality:
      - criterion: "Test coverage >= 90%"
        how_to_verify: "dotnet test --collect:\"XPlat Code Coverage\""
      
      - criterion: "Cyclomatic complexity <= 10"
        how_to_verify: "Static analysis with SonarQube"
      
      - criterion: "Code smells resolved"
        how_to_verify: "SonarQube quality gate passed"
      
      - criterion: "Code standards followed"
        how_to_verify: "dotnet format --verify-no-changes"
    
    documentation:
      - criterion: "XML comments on public members"
        how_to_verify: "Manual inspection or analysis tool"
      
      - criterion: "README updated if necessary"
        how_to_verify: "Documentation review"
  
  # ──────────────────────────────────────────────────────────────────
  # DEPENDENCIES
  # ──────────────────────────────────────────────────────────────────
  dependencies:
    upstream:
      # Micro-tasks that must be COMPLETE BEFORE this one
      - id: "mt-XXX-YYY"
        title: "Upstream task name"
        reason: "Why does this depend on that task?"
    
    downstream:
      # Micro-tasks that depend on THIS one being complete
      - id: "mt-XXX-YYY"
        title: "Downstream task name"
        reason: "Why does this task block that one?"
    
    external:
      # External dependencies (libraries, services, resources)
      - type: "library"
        name: "Entity Framework Core"
        version: "8.0.x"
        installed: true
      
      - type: "service"
        name: "PostgreSQL"
        version: "16.x"
        available: true
      
      - type: "resource"
        name: "Development environment configured"
        available: true
  
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # ESTIMATE
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  estimate:
    development_time: 4  # hours (max 8, ideal 2-4)
    testing_time: 1  # hours
    documentation_time: 0.5  # hours
    total_time: 5.5  # hours
    
    complexity: "medium"  # low | medium | high
    
    uncertainty: "low"  # low | medium | high
    
    estimate_justification: |
      Brief explanation of how this estimate was reached.
      Consider prior experience, technical complexity, risks.
  
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # AERT VALIDATION
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  aert_validation:
    atomicity:
      validated: true
      justification: "Task cannot be decomposed further without losing meaning"
    
    executability:
      validated: true
      justification: "Input and output clearly defined, task executable in isolation"
    
    traceability:
      validated: true
      justification: "Connected to the origin feature and strategic objectives"
    
    testability:
      validated: true
      justification: "Objective and verifiable quality criteria"
  
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # RISKS AND MITIGATIONS
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  risks:
    - id: "risk-mt-XXX-YYY-001"
      type: "technical"  # technical | business | resources | schedule
      description: "Description of the risk"
      probability: "medium"  # low | medium | high
      impact: "high"  # low | medium | high
      
      mitigation:
        strategy: "How to mitigate the risk"
        actions:
          - "Specific action 1"
          - "Specific action 2"
  
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # TECHNICAL NOTES
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  technical_notes:
    - "Important technical considerations"
    - "Architectural decisions made"
    - "Alternatives evaluated and discarded"
    - "Links to relevant documentation"
  
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # METADATA
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  metadata:
    version: "1.0.0"
    created_at: "YYYY-MM-DD"
    created_by: "Name of the Architect/Tech Lead"
    updated_at: "YYYY-MM-DD"
    status: "pending"  # pending | in_progress | completed | blocked | cancelled
    
    tags:
      - "ddd"
      - "cqrs"
      - "aggregate"
    
    technical_priority: "high"  # low | medium | high | critical
