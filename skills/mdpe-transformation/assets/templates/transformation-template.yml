# ====================================================================
# MDPE Framework - Transformation Layer Template
# ====================================================================
# Versão: 1.0.0
# Status: Draft
# Licença: MIT License
# 
# Descrição:
#   Template para documentar o processo de transformação de features
#   do Backlog Cognitivo em micro-tarefas executáveis. A Transformation
#   Layer é a ponte entre o estratégico (Discovery) e o operacional
#   (Ciclo MDPE).
#
# Uso:
#   Este template deve ser usado pelo Arquiteto/Orchestrator para
#   decompor features de alto nível em micro-tarefas atômicas,
#   analisando dependências técnicas e definindo sequenciamento.
# ====================================================================

transformation_layer:
  # Metadados da transformação
  metadata:
    id: "transformation-YYYYMMDD-001"
    versao: "1.0.0"
    data_transformacao: "YYYY-MM-DD"
    responsavel: "Nome do Arquiteto/Orchestrator"
    backlog_cognitivo_origem: "backlog-cognitivo-produto-YYYYMMDD.yml"
    modalidade: "hibrida" # manual | assistida-ia | hibrida
    status: "em_progresso" # planejada | em_progresso | concluida | revisao
  
  # Feature sendo transformada
  feature_origem:
    id: "feat-001"
    nome: "Nome da feature do Backlog Cognitivo"
    descricao: |
      Descrição da funcionalidade de alto nível que será decomposta.
    
    prioridade_moscow: "must-have"
    valor_negocio: 10
    esforco_estimado: 5

  # Análise de decomposição
  analise_decomposicao:
    # Análise técnica
    analise_tecnica:
      componentes_afetados:
        - nome: "Frontend - Dashboard"
          impacto: "alto"
          tecnologias: ["Angular 18", "TypeScript", "RxJS"]
        
        - nome: "Backend - API REST"
          impacto: "medio"
          tecnologias: [".NET 9", "C#", "Entity Framework Core"]
        
        - nome: "Banco de Dados"
          impacto: "baixo"
          tecnologias: ["PostgreSQL"]
      
      dependencias_tecnicas:
        - descricao: "Requer API de autenticação existente"
          tipo: "hard" # hard | soft
          status: "disponivel" # disponivel | em_desenvolvimento | bloqueada
        
        - descricao: "Integração com serviço de notificações"
          tipo: "soft"
          status: "disponivel"
      
      complexidade_tecnica:
        nivel: "media" # baixa | media | alta
        justificativa: |
          Requer integração com 2 sistemas existentes mas APIs estão documentadas.
          Não há grandes desafios arquiteturais.
      
      riscos_tecnicos:
        - descricao: "Performance da query pode ser lenta com grande volume"
          probabilidade: "media"
          impacto: "alto"
          mitigacao: "Implementar cache Redis e paginação"
        
        - descricao: "Compatibilidade com browsers antigos"
          probabilidade: "baixa"
          impacto: "medio"
          mitigacao: "Usar polyfills e transpilação"

    # Análise arquitetural
    analise_arquitetural:
      padrao_arquitetural: "Clean Architecture com CQRS"
      camadas_afetadas:
        - "Presentation Layer (Frontend)"
        - "Application Layer (Use Cases)"
        - "Domain Layer (Entidades)"
        - "Infrastructure Layer (Repositories)"
      
      decisoes_arquiteturais:
        - decisao: "Usar padrão Repository para acesso a dados"
          justificativa: "Facilita testes e desacoplamento"
          alternativas_consideradas:
            - "Acesso direto via ORM"
            - "Active Record Pattern"
        
        - decisao: "Implementar cache distribuído com Redis"
          justificativa: "Reduz latência e carga no banco"
          alternativas_consideradas:
            - "Cache em memória local"
            - "Sem cache"

  # Decomposição em micro-tarefas
  microtarefas_geradas:
    # Micro-tarefa 1
    - id: "mt-001"
      nome: "Criar entidade de domínio User"
      tipo: "codigo" # codigo | documentacao | arquitetura | validacao
      categoria: "domain" # domain | infrastructure | application | presentation
      
      descricao: |
        Criar classe User no Domain Layer com propriedades básicas
        (Id, Nome, Email, DataCriacao) seguindo princípios DDD.
      
      entrada:
        - "Modelo conceitual de User definido"
        - "Regras de negócio documentadas"
      
      saida:
        - "Classe User.cs no Domain Layer"
        - "Testes unitários cobrindo validações de domínio"
      
      criterios_aceitacao:
        - "Classe implementa Value Objects para Email"
        - "Validações de domínio implementadas"
        - "Cobertura de testes >= 90%"
        - "Code review aprovado"
      
      dependencias:
        upstream: [] # não depende de outras micro-tarefas
        downstream: ["mt-002", "mt-003"] # estas dependem desta
      
      estimativa_esforco: "2 horas"
      complexidade: "baixa"
      prioridade_execucao: 1

    # Micro-tarefa 2
    - id: "mt-002"
      nome: "Criar Repository Pattern para User"
      tipo: "codigo"
      categoria: "infrastructure"
      
      descricao: |
        Implementar IUserRepository interface e UserRepository concreto
        usando Entity Framework Core.
      
      entrada:
        - "Entidade User criada (mt-001)"
        - "DbContext configurado"
      
      saida:
        - "Interface IUserRepository"
        - "Classe UserRepository com CRUD básico"
        - "Testes de integração com banco in-memory"
      
      criterios_aceitacao:
        - "Operações CRUD funcionando corretamente"
        - "Queries otimizadas (sem N+1)"
        - "Tratamento de exceções implementado"
        - "Testes de integração passando"
      
      dependencias:
        upstream: ["mt-001"]
        downstream: ["mt-004"]
      
      estimativa_esforco: "3 horas"
      complexidade: "media"
      prioridade_execucao: 2

    # Micro-tarefa 3
    - id: "mt-003"
      nome: "Criar Use Case GetUserById"
      tipo: "codigo"
      categoria: "application"
      
      descricao: |
        Implementar use case na Application Layer para buscar usuário por ID.
      
      entrada:
        - "Entidade User criada (mt-001)"
        - "Repository interface definida"
      
      saida:
        - "Classe GetUserByIdHandler"
        - "DTOs de input/output"
        - "Testes unitários do handler"
      
      criterios_aceitacao:
        - "Handler implementa padrão Mediator/CQRS"
        - "Validação de input implementada"
        - "Mapeamento para DTO correto"
        - "Cobertura de testes >= 90%"
      
      dependencias:
        upstream: ["mt-001"]
        downstream: ["mt-005"]
      
      estimativa_esforco: "2 horas"
      complexidade: "baixa"
      prioridade_execucao: 3

    # Micro-tarefa 4
    - id: "mt-004"
      nome: "Implementar cache Redis para consultas de User"
      tipo: "codigo"
      categoria: "infrastructure"
      
      descricao: |
        Adicionar camada de cache usando Redis para otimizar consultas.
      
      entrada:
        - "Repository implementado (mt-002)"
        - "Configuração Redis disponível"
      
      saida:
        - "Decorator pattern para UserRepository com cache"
        - "Configuração de TTL e invalidação"
        - "Testes de integração com Redis"
      
      criterios_aceitacao:
        - "Cache hit rate > 80% em testes"
        - "Invalidação funcionando corretamente"
        - "Fallback para banco em caso de falha do Redis"
        - "Monitoramento de cache implementado"
      
      dependencias:
        upstream: ["mt-002"]
        downstream: []
      
      estimativa_esforco: "4 horas"
      complexidade: "media"
      prioridade_execucao: 5

    # Micro-tarefa 5
    - id: "mt-005"
      nome: "Criar endpoint API GET /api/users/{id}"
      tipo: "codigo"
      categoria: "presentation"
      
      descricao: |
        Criar controller e endpoint REST para buscar usuário por ID.
      
      entrada:
        - "Use case GetUserById implementado (mt-003)"
        - "Padrão de API REST definido"
      
      saida:
        - "UserController com endpoint GET"
        - "Documentação OpenAPI/Swagger"
        - "Testes de integração da API"
      
      criterios_aceitacao:
        - "Endpoint retorna status codes corretos (200, 404, 500)"
        - "Validação de input implementada"
        - "Documentação Swagger completa"
        - "Testes de integração passando"
      
      dependencias:
        upstream: ["mt-003"]
        downstream: ["mt-006"]
      
      estimativa_esforco: "2 horas"
      complexidade: "baixa"
      prioridade_execucao: 4

    # Micro-tarefa 6
    - id: "mt-006"
      nome: "Criar componente Angular UserProfile"
      tipo: "codigo"
      categoria: "presentation"
      
      descricao: |
        Criar componente Angular que consome API e exibe perfil do usuário.
      
      entrada:
        - "Endpoint API disponível (mt-005)"
        - "Design System / UI Kit definido"
      
      saida:
        - "Componente UserProfile standalone"
        - "Service para comunicação com API"
        - "Testes unitários do componente"
      
      criterios_aceitacao:
        - "Componente segue padrões de design definidos"
        - "Loading states implementados"
        - "Error handling implementado"
        - "Acessibilidade (WCAG 2.1 AA) validada"
        - "Cobertura de testes >= 80%"
      
      dependencias:
        upstream: ["mt-005"]
        downstream: []
      
      estimativa_esforco: "3 horas"
      complexidade: "media"
      prioridade_execucao: 6

  # Sequenciamento de execução
  sequenciamento:
    # Primeira onda (paralelas)
    wave_1:
      microtarefas: ["mt-001"]
      pode_executar_paralelo: false
      justificativa: "Entidade de domínio é fundação para todas as outras"
    
    # Segunda onda
    wave_2:
      microtarefas: ["mt-002", "mt-003"]
      pode_executar_paralelo: true
      justificativa: "Repository e Use Case podem ser desenvolvidos em paralelo"
    
    # Terceira onda
    wave_3:
      microtarefas: ["mt-005"]
      pode_executar_paralelo: false
      justificativa: "Controller depende de Use Case estar pronto"
    
    # Quarta onda
    wave_4:
      microtarefas: ["mt-004", "mt-006"]
      pode_executar_paralelo: true
      justificativa: "Cache e Frontend podem ser desenvolvidos em paralelo"

  # Rastreabilidade
  rastreabilidade:
    backlog_cognitivo:
      arquivo: "backlog-cognitivo-produto-YYYYMMDD.yml"
      feature_id: "feat-001"
    
    discovery_session:
      id: "discovery-session-YYYYMMDD-001"
      data: "YYYY-MM-DD"
    
    criterios_valor_origem:
      - "Feature deve aumentar retenção de usuários em 20%"
      - "Reduzir tempo de resposta da busca em 50%"
      - "Interface deve ter Net Promoter Score (NPS) > 8"
    
    metricas_sucesso:
      - metrica: "Tempo médio de resposta da API"
        baseline: "800ms"
        target: "< 200ms"
      
      - metrica: "Cache hit rate"
        baseline: "N/A"
        target: "> 80%"
      
      - metrica: "Cobertura de testes"
        baseline: "65%"
        target: "> 85%"

  # Output para Ciclo MDPE
  output_para_ciclo_mdpe:
    backlog_microtarefas_arquivo: "backlog-microtarefas-feat-001-YYYYMMDD.yml"
    total_microtarefas: 6
    estimativa_total: "16 horas"
    complexidade_media: "media"
    
    proxima_fase: "Plan (Ciclo MDPE)"
    responsavel_execucao: "Time de Desenvolvimento"
    data_inicio_prevista: "YYYY-MM-DD"

  # Notas do arquiteto
  notas_arquiteto:
    - timestamp: "YYYY-MM-DD HH:MM"
      nota: |
        Decisão de usar Redis foi questionada pelo time. 
        Argumentei com dados de performance de projetos similares.
    
    - timestamp: "YYYY-MM-DD HH:MM"
      nota: |
        POC de integração com ERP foi bem-sucedido, removendo risco técnico.

