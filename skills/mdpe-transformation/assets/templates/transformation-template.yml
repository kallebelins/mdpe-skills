# ====================================================================
# MDPE Framework - Transformation Layer Template
# ====================================================================
# Version: 1.0.0
# Status: Draft
# License: MIT License
# 
# Description:
#   Template for documenting the process of transforming features from
#   the Cognitive Backlog into executable micro-tasks. The Transformation
#   Layer is the bridge between the strategic (Discovery) and the
#   operational (MDPE Cycle).
#
# Usage:
#   This template should be used by the Architect/Orchestrator to
#   decompose high-level features into atomic micro-tasks, analyzing
#   technical dependencies and defining sequencing.
# ====================================================================

transformation_layer:
  # Transformation metadata
  metadata:
    id: "transformation-YYYYMMDD-001"
    version: "1.0.0"
    transformation_date: "YYYY-MM-DD"
    responsible: "Name of the Architect/Orchestrator"
    source_cognitive_backlog: "cognitive-backlog-product-YYYYMMDD.yml"
    modality: "hybrid" # manual | ai-assisted | hybrid
    status: "in_progress" # planned | in_progress | completed | review
  
  # Feature being transformed
  origin_feature:
    id: "feat-001"
    name: "Feature name from the Cognitive Backlog"
    description: |
      Description of the high-level functionality that will be decomposed.
    
    moscow_priority: "must-have"
    business_value: 10
    estimated_effort: 5

  # Decomposition analysis
  decomposition_analysis:
    # Technical analysis
    technical_analysis:
      affected_components:
        - name: "Frontend - Dashboard"
          impact: "high"
          technologies: ["Angular 18", "TypeScript", "RxJS"]
        
        - name: "Backend - REST API"
          impact: "medium"
          technologies: [".NET 9", "C#", "Entity Framework Core"]
        
        - name: "Database"
          impact: "low"
          technologies: ["PostgreSQL"]
      
      technical_dependencies:
        - description: "Requires an existing authentication API"
          type: "hard" # hard | soft
          status: "available" # available | in_development | blocked
        
        - description: "Integration with the notification service"
          type: "soft"
          status: "available"
      
      technical_complexity:
        level: "medium" # low | medium | high
        justification: |
          Requires integration with 2 existing systems, but the APIs
          are documented. No major architectural challenges.
      
      technical_risks:
        - description: "Query performance may be slow with a large volume of data"
          probability: "medium"
          impact: "high"
          mitigation: "Implement Redis cache and pagination"
        
        - description: "Compatibility with older browsers"
          probability: "low"
          impact: "medium"
          mitigation: "Use polyfills and transpilation"

    # Architectural analysis
    architectural_analysis:
      architectural_pattern: "Clean Architecture with CQRS"
      affected_layers:
        - "Presentation Layer (Frontend)"
        - "Application Layer (Use Cases)"
        - "Domain Layer (Entities)"
        - "Infrastructure Layer (Repositories)"
      
      architectural_decisions:
        - decision: "Use the Repository pattern for data access"
          justification: "Facilitates testing and decoupling"
          alternatives_considered:
            - "Direct access via ORM"
            - "Active Record Pattern"
        
        - decision: "Implement distributed cache with Redis"
          justification: "Reduces latency and database load"
          alternatives_considered:
            - "Local in-memory cache"
            - "No cache"

  # Decomposition into micro-tasks
  generated_microtasks:
    # Micro-task 1
    - id: "mt-001"
      name: "Create the User domain entity"
      type: "code" # code | documentation | architecture | validation
      category: "domain" # domain | infrastructure | application | presentation
      
      description: |
        Create the User class in the Domain Layer with basic properties
        (Id, Name, Email, CreatedAt) following DDD principles.
      
      input:
        - "User conceptual model defined"
        - "Business rules documented"
      
      output:
        - "User.cs class in the Domain Layer"
        - "Unit tests covering domain validations"
      
      acceptance_criteria:
        - "Class implements a Value Object for Email"
        - "Domain validations implemented"
        - "Test coverage >= 90%"
        - "Code review approved"
      
      dependencies:
        upstream: [] # does not depend on other micro-tasks
        downstream: ["mt-002", "mt-003"] # these depend on this one
      
      estimated_effort: "2 hours"
      complexity: "low"
      execution_priority: 1

    # Micro-task 2
    - id: "mt-002"
      name: "Create Repository Pattern for User"
      type: "code"
      category: "infrastructure"
      
      description: |
        Implement the IUserRepository interface and a concrete
        UserRepository using Entity Framework Core.
      
      input:
        - "User entity created (mt-001)"
        - "DbContext configured"
      
      output:
        - "IUserRepository interface"
        - "UserRepository class with basic CRUD"
        - "Integration tests with an in-memory database"
      
      acceptance_criteria:
        - "CRUD operations work correctly"
        - "Optimized queries (no N+1)"
        - "Exception handling implemented"
        - "Integration tests passing"
      
      dependencies:
        upstream: ["mt-001"]
        downstream: ["mt-004"]
      
      estimated_effort: "3 hours"
      complexity: "medium"
      execution_priority: 2

    # Micro-task 3
    - id: "mt-003"
      name: "Create GetUserById Use Case"
      type: "code"
      category: "application"
      
      description: |
        Implement a use case in the Application Layer to fetch a user by ID.
      
      input:
        - "User entity created (mt-001)"
        - "Repository interface defined"
      
      output:
        - "GetUserByIdHandler class"
        - "Input/output DTOs"
        - "Unit tests for the handler"
      
      acceptance_criteria:
        - "Handler implements the Mediator/CQRS pattern"
        - "Input validation implemented"
        - "Correct DTO mapping"
        - "Test coverage >= 90%"
      
      dependencies:
        upstream: ["mt-001"]
        downstream: ["mt-005"]
      
      estimated_effort: "2 hours"
      complexity: "low"
      execution_priority: 3

    # Micro-task 4
    - id: "mt-004"
      name: "Implement Redis cache for User queries"
      type: "code"
      category: "infrastructure"
      
      description: |
        Add a caching layer using Redis to optimize queries.
      
      input:
        - "Repository implemented (mt-002)"
        - "Redis configuration available"
      
      output:
        - "Decorator pattern for UserRepository with caching"
        - "TTL and invalidation configuration"
        - "Integration tests with Redis"
      
      acceptance_criteria:
        - "Cache hit rate > 80% in tests"
        - "Invalidation working correctly"
        - "Fallback to the database on Redis failure"
        - "Cache monitoring implemented"
      
      dependencies:
        upstream: ["mt-002"]
        downstream: []
      
      estimated_effort: "4 hours"
      complexity: "medium"
      execution_priority: 5

    # Micro-task 5
    - id: "mt-005"
      name: "Create GET /api/users/{id} API endpoint"
      type: "code"
      category: "presentation"
      
      description: |
        Create a controller and REST endpoint to fetch a user by ID.
      
      input:
        - "GetUserById use case implemented (mt-003)"
        - "REST API pattern defined"
      
      output:
        - "UserController with GET endpoint"
        - "OpenAPI/Swagger documentation"
        - "API integration tests"
      
      acceptance_criteria:
        - "Endpoint returns correct status codes (200, 404, 500)"
        - "Input validation implemented"
        - "Complete Swagger documentation"
        - "Integration tests passing"
      
      dependencies:
        upstream: ["mt-003"]
        downstream: ["mt-006"]
      
      estimated_effort: "2 hours"
      complexity: "low"
      execution_priority: 4

    # Micro-task 6
    - id: "mt-006"
      name: "Create Angular UserProfile component"
      type: "code"
      category: "presentation"
      
      description: |
        Create an Angular component that consumes the API and displays
        the user profile.
      
      input:
        - "API endpoint available (mt-005)"
        - "Design System / UI Kit defined"
      
      output:
        - "Standalone UserProfile component"
        - "Service for API communication"
        - "Unit tests for the component"
      
      acceptance_criteria:
        - "Component follows the defined design standards"
        - "Loading states implemented"
        - "Error handling implemented"
        - "Accessibility (WCAG 2.1 AA) validated"
        - "Test coverage >= 80%"
      
      dependencies:
        upstream: ["mt-005"]
        downstream: []
      
      estimated_effort: "3 hours"
      complexity: "medium"
      execution_priority: 6

  # Execution sequencing
  sequencing:
    # First wave (parallel)
    wave_1:
      microtasks: ["mt-001"]
      can_run_parallel: false
      justification: "The domain entity is the foundation for everything else"
    
    # Second wave
    wave_2:
      microtasks: ["mt-002", "mt-003"]
      can_run_parallel: true
      justification: "Repository and Use Case can be developed in parallel"
    
    # Third wave
    wave_3:
      microtasks: ["mt-005"]
      can_run_parallel: false
      justification: "Controller depends on the Use Case being ready"
    
    # Fourth wave
    wave_4:
      microtasks: ["mt-004", "mt-006"]
      can_run_parallel: true
      justification: "Cache and Frontend can be developed in parallel"

  # Traceability
  traceability:
    cognitive_backlog:
      file: "cognitive-backlog-product-YYYYMMDD.yml"
      feature_id: "feat-001"
    
    discovery_session:
      id: "discovery-session-YYYYMMDD-001"
      date: "YYYY-MM-DD"
    
    origin_value_criteria:
      - "Feature must increase user retention by 20%"
      - "Reduce search response time by 50%"
      - "Interface must have a Net Promoter Score (NPS) > 8"
    
    success_metrics:
      - metric: "Average API response time"
        baseline: "800ms"
        target: "< 200ms"
      
      - metric: "Cache hit rate"
        baseline: "N/A"
        target: "> 80%"
      
      - metric: "Test coverage"
        baseline: "65%"
        target: "> 85%"

  # Output for the MDPE Cycle
  output_for_mdpe_cycle:
    microtask_backlog_file: "microtask-backlog-feat-001-YYYYMMDD.yml"
    total_microtasks: 6
    total_estimate: "16 hours"
    average_complexity: "medium"
    
    next_phase: "Plan (MDPE Cycle)"
    execution_responsible: "Development Team"
    expected_start_date: "YYYY-MM-DD"

  # Architect's notes
  architect_notes:
    - timestamp: "YYYY-MM-DD HH:MM"
      note: |
        The decision to use Redis was questioned by the team.
        Argued the case using performance data from similar projects.
    
    - timestamp: "YYYY-MM-DD HH:MM"
      note: |
        The ERP integration POC succeeded, removing the technical risk.
