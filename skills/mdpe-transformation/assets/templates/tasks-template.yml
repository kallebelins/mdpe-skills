# ═══════════════════════════════════════════════════════════════════════
# TEMPLATE: Tasks de Implementação
# ═══════════════════════════════════════════════════════════════════════
# 
# PROPÓSITO: Estruturar arquivo tasks.md para projetos
# USADO POR: Comando 15 (TG-01 - Geração de Tasks)
# FORMATO SAÍDA: Markdown (.md)
#
# ═══════════════════════════════════════════════════════════════════════

# ───────────────────────────────────────────────────────────────────────
# ESTRUTURA DO ARQUIVO TASKS.MD
# ───────────────────────────────────────────────────────────────────────

estrutura:
  cabecalho:
    titulo: "# Tasks - {nome_projeto}"
    subtitulo: "## Tarefas de Implementação de Código"
    descricao: |
      Este documento contém todas as tarefas de implementação de código 
      para o projeto {nome_projeto}, organizadas por feature e priorizadas 
      tecnicamente.
  
  arquivos_entrada:
    backlog:
      - nome: "Backlog Index"
        caminho: "backlog/backlog-index.yml"
      - nome: "Features"
        caminho: "backlog/features/"
    transformation:
      - nome: "Transformation Index"
        caminho: "transformation/transformation-index.yml"
      - nome: "Execution Index"
        caminho: "transformation/execution-index.yml"

# ───────────────────────────────────────────────────────────────────────
# TEMPLATE DE FEATURE
# ───────────────────────────────────────────────────────────────────────

feature_template:
  cabecalho: "### Feature {feature_id}: {feature_nome}"
  
  arquivos_entrada:
    - nome: "Feature"
      caminho: "backlog/features/{feature_id}.yml"
    - nome: "Microtasks Index"
      caminho: "transformation/{feature_id}/microtasks-index.yml"
    - nome: "Validação"
      caminho: "transformation/{feature_id}/validation/validation-summary.yml"
    - nome: "Priorização"
      caminho: "transformation/{feature_id}/prioritization/ranking.yml"
    - nome: "Dependências/Waves"
      caminho: "transformation/{feature_id}/dependencies/waves.yml"
    - nome: "Contextos de Execução"
      caminho: "transformation/{feature_id}/execution/"
  
  secao_tarefas: "**Tarefas de Implementação:**"

# ───────────────────────────────────────────────────────────────────────
# TEMPLATE DE CAMADA/CATEGORIA
# ───────────────────────────────────────────────────────────────────────

camada_template:
  formato: "#### {nome_camada}"
  descricao: "{descricao_camada}"

camadas_padrao:
  - id: "database"
    nome: "Fundação - Database Schemas"
    descricao: "Criação dos schemas de banco de dados (base de tudo)"
    palavras_chave:
      - "schema"
      - "database"
      - "migration"
      - "table"
      - "sql"
    ordem: 1

  - id: "domain"
    nome: "Domain Layer - Entidades e Interfaces"
    descricao: "Criar entidades de domínio e interfaces de repositório"
    palavras_chave:
      - "entity"
      - "domain"
      - "interface"
      - "value object"
      - "aggregate"
      - "event"
    ordem: 2

  - id: "infrastructure"
    nome: "Infrastructure Layer - Repository"
    descricao: "Implementar Repository no Infrastructure"
    palavras_chave:
      - "repository"
      - "infrastructure"
      - "persistence"
      - "dbcontext"
    ordem: 3

  - id: "application_cqrs"
    nome: "Application Layer - Commands e Queries"
    descricao: "Implementar casos de uso (CQRS)"
    palavras_chave:
      - "command"
      - "query"
      - "handler"
      - "CQRS"
      - "validator"
    ordem: 4

  - id: "application_services"
    nome: "Application Layer - Serviços"
    descricao: "Implementar serviços de aplicação"
    palavras_chave:
      - "service"
      - "integration"
      - "provider"
      - "translator"
    ordem: 5

  - id: "api"
    nome: "API Layer - Controllers e Endpoints"
    descricao: "Criar API REST e endpoints"
    palavras_chave:
      - "controller"
      - "endpoint"
      - "API"
      - "REST"
      - "dto"
    ordem: 6

  - id: "frontend"
    nome: "Frontend - Componentes"
    descricao: "Desenvolver componentes de UI"
    palavras_chave:
      - "component"
      - "page"
      - "view"
      - "frontend"
      - "angular"
      - "react"
      - "wizard"
    ordem: 7

  - id: "tests"
    nome: "Testes - Unitários e Integração"
    descricao: "Criar testes automatizados"
    palavras_chave:
      - "test"
      - "spec"
      - "unit"
      - "integration"
      - "e2e"
    ordem: 8

# ───────────────────────────────────────────────────────────────────────
# TEMPLATE DE MICROTAREFA
# ───────────────────────────────────────────────────────────────────────

microtarefa_template:
  # Formato para tarefa pendente
  pendente: |
    - [ ] **{microtask_id}**: {titulo}
      - Arquivo: [`transformation/{feature_id}/microtasks/{microtask_id}.yml`](transformation/{feature_id}/microtasks/{microtask_id}.yml)
      - Contexto: [`transformation/{feature_id}/execution/{microtask_id}-context.yml`](transformation/{feature_id}/execution/{microtask_id}-context.yml)
      - Estimativa: {estimativa} horas
  
  # Formato para tarefa concluída
  concluida: |
    - [x] **{microtask_id}**: {titulo}
      - Arquivo: [`transformation/{feature_id}/microtasks/{microtask_id}.yml`](transformation/{feature_id}/microtasks/{microtask_id}.yml)
      - Contexto: [`transformation/{feature_id}/execution/{microtask_id}-context.yml`](transformation/{feature_id}/execution/{microtask_id}-context.yml)
      - Estimativa: {estimativa} horas
      {notas_conclusao}
  
  # Formato de nota de conclusão
  nota_conclusao: "  - ✅ {descricao}: `{caminho_arquivo}`"

# ───────────────────────────────────────────────────────────────────────
# TEMPLATE DE RESUMO
# ───────────────────────────────────────────────────────────────────────

resumo_template:
  cabecalho: "## Resumo"
  
  tabela:
    colunas:
      - nome: "Feature"
        alinhamento: "left"
      - nome: "Total"
        alinhamento: "center"
      - nome: "Concluídas"
        alinhamento: "center"
      - nome: "Pendentes"
        alinhamento: "center"
      - nome: "Progresso"
        alinhamento: "center"
    
    linha_total: true
  
  formato_progresso: "{percentual}%"

# ───────────────────────────────────────────────────────────────────────
# REGRAS DE FORMATAÇÃO
# ───────────────────────────────────────────────────────────────────────

regras:
  ids:
    feature: "feat-{numero:03d}"
    microtask: "mt-{feature_numero:03d}-{sequencia:03d}"
    exemplo_feature: "feat-001"
    exemplo_microtask: "mt-001-001"
  
  links:
    formato: "[`{texto}`]({caminho})"
    tipo: "relativo"  # Links relativos ao tasks.md
  
  checkboxes:
    pendente: "- [ ]"
    concluido: "- [x]"
  
  ordem_features:
    criterio: "MoSCoW"
    prioridade:
      - "Must Have"
      - "Should Have"
      - "Could Have"
      - "Won't Have"
  
  ordem_tarefas:
    criterios:
      - "wave"       # Wave 1, 2, 3...
      - "prioridade" # Dentro da wave
      - "dependencias" # Sem dependência primeiro

# ───────────────────────────────────────────────────────────────────────
# METADADOS DO ARQUIVO
# ───────────────────────────────────────────────────────────────────────

metadados:
  rodape: |
    ---
    **Versão:** 1.0.0  
    **Gerado em:** {data_geracao}  
    **Projeto:** {nome_projeto}  
    **Framework:** MDPE v2.0

# ───────────────────────────────────────────────────────────────────────
# EXEMPLO DE OUTPUT
# ───────────────────────────────────────────────────────────────────────

