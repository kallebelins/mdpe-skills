# ═══════════════════════════════════════════════════════════════════════
# TEMPLATE: Implementation Tasks
# ═══════════════════════════════════════════════════════════════════════
# 
# PURPOSE: Structure the tasks.md file for projects
# USED BY: Command 15 (TG-01 - Task Generation)
# OUTPUT FORMAT: Markdown (.md)
#
# ═══════════════════════════════════════════════════════════════════════

# ───────────────────────────────────────────────────────────────────────
# TASKS.MD FILE STRUCTURE
# ───────────────────────────────────────────────────────────────────────

structure:
  header:
    title: "# Tasks - {project_name}"
    subtitle: "## Code Implementation Tasks"
    description: |
      This document contains all the code implementation tasks
      for the {project_name} project, organized by feature and
      technically prioritized.
  
  input_files:
    backlog:
      - name: "Backlog Index"
        path: "backlog/backlog-index.yml"
      - name: "Features"
        path: "backlog/features/"
    transformation:
      - name: "Transformation Index"
        path: "transformation/transformation-index.yml"
      - name: "Execution Index"
        path: "transformation/execution-index.yml"

# ───────────────────────────────────────────────────────────────────────
# FEATURE TEMPLATE
# ───────────────────────────────────────────────────────────────────────

feature_template:
  header: "### Feature {feature_id}: {feature_name}"
  
  input_files:
    - name: "Feature"
      path: "backlog/features/{feature_id}.yml"
    - name: "Microtasks Index"
      path: "transformation/{feature_id}/microtasks-index.yml"
    - name: "Validation"
      path: "transformation/{feature_id}/validation/validation-summary.yml"
    - name: "Prioritization"
      path: "transformation/{feature_id}/prioritization/ranking.yml"
    - name: "Dependencies/Waves"
      path: "transformation/{feature_id}/dependencies/waves.yml"
    - name: "Execution Contexts"
      path: "transformation/{feature_id}/execution/"
  
  tasks_section: "**Implementation Tasks:**"

# ───────────────────────────────────────────────────────────────────────
# LAYER/CATEGORY TEMPLATE
# ───────────────────────────────────────────────────────────────────────

layer_template:
  format: "#### {layer_name}"
  description: "{layer_description}"

standard_layers:
  - id: "database"
    name: "Foundation - Database Schemas"
    description: "Creation of database schemas (the base of everything)"
    keywords:
      - "schema"
      - "database"
      - "migration"
      - "table"
      - "sql"
    order: 1

  - id: "domain"
    name: "Domain Layer - Entities and Interfaces"
    description: "Create domain entities and repository interfaces"
    keywords:
      - "entity"
      - "domain"
      - "interface"
      - "value object"
      - "aggregate"
      - "event"
    order: 2

  - id: "infrastructure"
    name: "Infrastructure Layer - Repository"
    description: "Implement Repository in the Infrastructure layer"
    keywords:
      - "repository"
      - "infrastructure"
      - "persistence"
      - "dbcontext"
    order: 3

  - id: "application_cqrs"
    name: "Application Layer - Commands and Queries"
    description: "Implement use cases (CQRS)"
    keywords:
      - "command"
      - "query"
      - "handler"
      - "CQRS"
      - "validator"
    order: 4

  - id: "application_services"
    name: "Application Layer - Services"
    description: "Implement application services"
    keywords:
      - "service"
      - "integration"
      - "provider"
      - "translator"
    order: 5

  - id: "api"
    name: "API Layer - Controllers and Endpoints"
    description: "Create the REST API and endpoints"
    keywords:
      - "controller"
      - "endpoint"
      - "API"
      - "REST"
      - "dto"
    order: 6

  - id: "frontend"
    name: "Frontend - Components"
    description: "Develop UI components"
    keywords:
      - "component"
      - "page"
      - "view"
      - "frontend"
      - "angular"
      - "react"
      - "wizard"
    order: 7

  - id: "tests"
    name: "Tests - Unit and Integration"
    description: "Create automated tests"
    keywords:
      - "test"
      - "spec"
      - "unit"
      - "integration"
      - "e2e"
    order: 8

# ───────────────────────────────────────────────────────────────────────
# MICROTASK TEMPLATE
# ───────────────────────────────────────────────────────────────────────

microtask_template:
  # Format for a pending task
  pending: |
    - [ ] **{microtask_id}**: {title}
      - File: [`transformation/{feature_id}/microtasks/{microtask_id}.yml`](transformation/{feature_id}/microtasks/{microtask_id}.yml)
      - Context: [`transformation/{feature_id}/execution/{microtask_id}-context.yml`](transformation/{feature_id}/execution/{microtask_id}-context.yml)
      - Estimate: {estimate} hours
  
  # Format for a completed task
  completed: |
    - [x] **{microtask_id}**: {title}
      - File: [`transformation/{feature_id}/microtasks/{microtask_id}.yml`](transformation/{feature_id}/microtasks/{microtask_id}.yml)
      - Context: [`transformation/{feature_id}/execution/{microtask_id}-context.yml`](transformation/{feature_id}/execution/{microtask_id}-context.yml)
      - Estimate: {estimate} hours
      {completion_notes}
  
  # Completion note format  [C] - only appended when the task is checked off
  completion_note: "  - Done: {description}: `{file_path}`"

# ───────────────────────────────────────────────────────────────────────
# SUMMARY TEMPLATE
# ───────────────────────────────────────────────────────────────────────

summary_template:
  header: "## Summary"
  
  table:
    columns:
      - name: "Feature"
        alignment: "left"
      - name: "Total"
        alignment: "center"
      - name: "Completed"
        alignment: "center"
      - name: "Pending"
        alignment: "center"
      - name: "Progress"
        alignment: "center"
    
    total_row: true
  
  progress_format: "{percentage}%"

# ───────────────────────────────────────────────────────────────────────
# FORMATTING RULES
# ───────────────────────────────────────────────────────────────────────

rules:
  ids:
    feature: "feat-{number:03d}"
    microtask: "mt-{feature_number:03d}-{sequence:03d}"
    feature_example: "feat-001"
    microtask_example: "mt-001-001"
  
  links:
    format: "[`{text}`]({path})"
    type: "relative"  # Links relative to tasks.md
  
  checkboxes:
    pending: "- [ ]"
    completed: "- [x]"
  
  feature_order:
    criterion: "MoSCoW"
    priority:
      - "Must Have"
      - "Should Have"
      - "Could Have"
      - "Won't Have"
  
  task_order:
    criteria:
      - "wave"       # Wave 1, 2, 3...
      - "priority"   # Within the wave
      - "dependencies" # No-dependency tasks first

# ───────────────────────────────────────────────────────────────────────
# FILE METADATA
# ───────────────────────────────────────────────────────────────────────

metadata:
  footer: |
    ---
    **Version:** 1.0.0  
    **Generated on:** {generation_date}  
    **Project:** {project_name}  
    **Framework:** MDPE v2.0

