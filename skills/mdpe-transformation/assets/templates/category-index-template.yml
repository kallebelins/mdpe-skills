# ====================================================================
# MDPE Framework - Micro-Task Category Index
# ====================================================================
# Version: 2.0.0
# Purpose: Template for grouping micro-tasks by category
# Phase: Transformation Layer (Organization)
# ====================================================================
#
# This file contains the template for category indexes.
# Categories group micro-tasks by type of work:
#   - backend: Server logic, APIs, services
#   - frontend: User interface, visual components
#   - database: Schemas, migrations, stored procedures
#   - infra: DevOps, CI/CD, environment configuration
#   - docs: Technical and user documentation
#   - tests: Dedicated tests (beyond those embedded in tasks)
#
# Location of generated files:
#   docs/transformation/{feature-id}/categories/
#   ├── backend.yml
#   ├── frontend.yml
#   ├── database.yml
#   ├── infra.yml
#   ├── docs.yml
#   └── tests.yml
# ====================================================================

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# TEMPLATE: CATEGORY INDEX
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# File: categories/{category}.yml
# Description: Groups all micro-tasks of a specific category
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

category_index_template:
  # ──────────────────────────────────────────────────────────────────
  # FILE HEADER
  # ──────────────────────────────────────────────────────────────────
  # # ====================================================================
  # # MDPE Framework - Category Index: {category}
  # # ====================================================================
  # # Feature: {feature-name}
  # # Feature ID: {feature-id}
  # # Version: 1.0.0
  # # Date: {YYYY-MM-DD}
  # # ====================================================================
  # ──────────────────────────────────────────────────────────────────

  category_index:
    # ──────────────────────────────────────────────────────────────────
    # METADATA
    # ──────────────────────────────────────────────────────────────────
    metadata:
      category: "backend"  # backend | frontend | database | infra | docs | tests
      
      # Category description
      description: |
        Description of the category and the type of work it covers.
        
        Examples per category:
        - backend: Aggregates, repositories, commands, queries, application services
        - frontend: Components, pages, hooks, state stores
        - database: Schemas, migrations, indexes, constraints
        - infra: Dockerfiles, CI/CD pipelines, environment configuration
        - docs: README, ADRs, API documentation
        - tests: E2E test suites, load tests
      
      # Origin feature
      feature_id: "feat-XXX"
      feature_name: "Feature Name"
      
      # Statistics
      total_microtasks: 0
      
      # Version control
      version: "1.0.0"
      created_at: "YYYY-MM-DD"
      updated_at: "YYYY-MM-DD"
    
    # ──────────────────────────────────────────────────────────────────
    # LIST OF MICRO-TASKS
    # ──────────────────────────────────────────────────────────────────
    microtasks:
      - id: "mt-XXX-001"
        title: "Descriptive title of the micro-task"
        
        # Architectural layer
        layer: "domain"  # domain | application | infrastructure | presentation
        
        # Type of work
        type: "implementation"  # implementation | refactoring | bugfix | documentation | testing
        
        # Estimate
        estimated_hours: 4
        complexity: "medium"  # low | medium | high
        
        # Priority
        technical_priority: "high"  # low | medium | high | critical
        
        # Status
        status: "pending"  # pending | in_progress | completed | blocked | cancelled
        
        # Execution wave
        wave: "wave_1"
        
        # Micro-task file
        file: "microtasks/mt-XXX-001.yml"
        
        # Dependencies
        dependencies:
          upstream: []  # IDs of tasks that must be ready before this one
          downstream: []  # IDs of tasks that depend on this one
      
      - id: "mt-XXX-002"
        title: "Another micro-task in the category"
        layer: "application"
        type: "implementation"
        estimated_hours: 3
        complexity: "medium"
        technical_priority: "high"
        status: "pending"
        wave: "wave_2"
        file: "microtasks/mt-XXX-002.yml"
        dependencies:
          upstream: ["mt-XXX-001"]
          downstream: ["mt-XXX-005"]
    
    # ──────────────────────────────────────────────────────────────────
    # STATISTICS
    # ──────────────────────────────────────────────────────────────────
    statistics:
      # Total time
      total_time_hours: 0
      average_time_per_task: 0
      
      # Distribution by layer
      layer_distribution:
        domain: 0
        application: 0
        infrastructure: 0
        presentation: 0
        tests: 0
        docs: 0
      
      # Distribution by complexity
      complexity_distribution:
        low: 0
        medium: 0
        high: 0
      
      # Distribution by status
      status_distribution:
        pending: 0
        in_progress: 0
        completed: 0
        blocked: 0
        cancelled: 0
      
      # Distribution by type
      type_distribution:
        implementation: 0
        refactoring: 0
        bugfix: 0
        documentation: 0
        testing: 0
      
      # Distribution by wave
      wave_distribution:
        wave_1: 0
        wave_2: 0
        wave_3: 0
    
    # ──────────────────────────────────────────────────────────────────
    # EXECUTION SEQUENCE
    # ──────────────────────────────────────────────────────────────────
    execution_sequence:
      # Tasks that can start immediately (no upstream within this category)
      can_start: []
      
      # Suggested order by wave
      by_wave:
        wave_1:
          tasks: ["mt-XXX-001"]
          time_hours: 4
        wave_2:
          tasks: ["mt-XXX-002"]
          time_hours: 3
      
      # Critical path within this category
      critical_path:
        - "mt-XXX-001"
        - "mt-XXX-002"
      critical_path_time: 7  # hours
    
    # ──────────────────────────────────────────────────────────────────
    # DEPENDENCIES EXTERNAL TO THE CATEGORY
    # ──────────────────────────────────────────────────────────────────
    external_category_dependencies:
      # Tasks from other categories that block tasks in this one
      blocking:
        - microtask_id: "mt-XXX-010"  # From another category
          origin_category: "database"
          blocks: ["mt-XXX-001"]
          reason: "Database schema must exist before the repository"
      
      # Tasks in this category that block others
      blocks:
        - microtask_id: "mt-XXX-002"
          target_category: "frontend"
          blocks_ids: ["mt-XXX-015"]
          reason: "API must be ready for frontend integration"
    
    # ──────────────────────────────────────────────────────────────────
    # CATEGORY-SPECIFIC RISKS
    # ──────────────────────────────────────────────────────────────────
    category_risks:
      - id: "risk-cat-001"
        description: "Description of the risk specific to this category"
        probability: "medium"  # low | medium | high
        impact: "high"  # low | medium | high
        affected_microtasks: ["mt-XXX-001", "mt-XXX-002"]
        mitigation: "Mitigation strategy"
    
    # ──────────────────────────────────────────────────────────────────
    # REQUIRED RESOURCES
    # ──────────────────────────────────────────────────────────────────
    required_resources:
      # Technical knowledge
      knowledge:
        - topic: "Topic/technology name"
          level: "intermediate"  # basic | intermediate | advanced
          tasks_requiring: ["mt-XXX-001"]
      
      # Tools
      tools:
        - name: "Tool name"
          version: "X.Y.Z"
          tasks_requiring: ["mt-XXX-001", "mt-XXX-002"]
      
      # Access
      access:
        - resource: "Resource name"
          type: "api"  # api | database | server | service
          tasks_requiring: ["mt-XXX-002"]
    
    # ──────────────────────────────────────────────────────────────────
    # PROGRESS
    # ──────────────────────────────────────────────────────────────────
    progress:
      completed_percentage: 0
      completed_tasks: 0
      in_progress_tasks: 0
      pending_tasks: 0
      blocked_tasks: 0
      
      # Burndown
      total_estimated_hours: 0
      completed_hours: 0
      remaining_hours: 0
      
      last_updated: "YYYY-MM-DD"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# USAGE INSTRUCTIONS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

usage_instructions:
  description: |
    This template is used to create category indexes for micro-tasks.
    A file is generated for each category present in the feature.
  
  when_to_use: |
    - After decomposing features into micro-tasks (TL-01)
    - To organize work by team specialty
    - To facilitate task assignment by profile
    - To track progress by category
  
  generation_flow:
    step_1:
      description: "Identify existing categories"
      input: "microtasks-index.yml"
      action: "List all unique categories among the micro-tasks"
    
    step_2:
      description: "Create a file for each category"
      output: "categories/{category}.yml"
      action: |
        For each category:
        1. Filter the category's micro-tasks
        2. Calculate statistics
        3. Identify the execution sequence
        4. Map cross-category dependencies
    
    step_3:
      description: "Validate completeness"
      action: |
        Verify that:
        - All micro-tasks belong to a category
        - Statistics are correct
        - Cross-category dependencies are mapped
  
  valid_categories:
    backend:
      description: "Server logic, APIs, application services"
      examples:
        - "Create Aggregate Root"
        - "Implement Repository"
        - "Create Command Handler"
        - "Implement Query Handler"
        - "Create application service"
    
    frontend:
      description: "User interface, visual components"
      examples:
        - "Create form component"
        - "Implement listing page"
        - "Create state hook"
        - "Implement API integration"
    
    database:
      description: "Schemas, migrations, indexes"
      examples:
        - "Create table schema"
        - "Create initial migration"
        - "Add performance indexes"
        - "Create stored procedure"
    
    infra:
      description: "DevOps, CI/CD, configuration"
      examples:
        - "Create Dockerfile"
        - "Configure CI/CD pipeline"
        - "Set up development environment"
        - "Configure monitoring"
    
    docs:
      description: "Technical and user documentation"
      examples:
        - "Document API (OpenAPI)"
        - "Create module README"
        - "Document ADR"
        - "Create usage guide"
    
    tests:
      description: "Dedicated tests beyond those already embedded"
      examples:
        - "Create E2E test suite"
        - "Implement load tests"
        - "Create test fixtures"
        - "Configure shared mocks"
  
  validation:
    - "Category is one of the valid ones (backend, frontend, database, infra, docs, tests)"
    - "All micro-tasks have a valid status"
    - "Statistics calculated correctly"
    - "External dependencies mapped"
    - "Execution sequence makes sense"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# USAGE EXAMPLE - BACKEND CATEGORY
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

backend_example:
  category_index:
    metadata:
      category: "backend"
      description: |
        Backend micro-tasks include implementing DDD aggregates,
        repositories, commands, queries, and application services following
        Clean Architecture.
      feature_id: "feat-001"
      feature_name: "Property Registration and Profile"
      total_microtasks: 12
      version: "1.0.0"
      created_at: "2025-01-15"
      updated_at: "2025-01-15"
    
    microtasks:
      - id: "mt-001-001"
        title: "Create Property Aggregate Root with Value Objects"
        layer: "domain"
        type: "implementation"
        estimated_hours: 4
        complexity: "medium"
        technical_priority: "critical"
        status: "pending"
        wave: "wave_1"
        file: "microtasks/mt-001-001.yml"
        dependencies:
          upstream: []
          downstream: ["mt-001-002", "mt-001-003"]
      
      - id: "mt-001-002"
        title: "Implement IPropertyRepository Interface"
        layer: "domain"
        type: "implementation"
        estimated_hours: 2
        complexity: "low"
        technical_priority: "high"
        status: "pending"
        wave: "wave_1"
        file: "microtasks/mt-001-002.yml"
        dependencies:
          upstream: ["mt-001-001"]
          downstream: ["mt-001-006"]
    
    statistics:
      total_time_hours: 48
      average_time_per_task: 4
      
      layer_distribution:
        domain: 4
        application: 6
        infrastructure: 2
        presentation: 0
      
      complexity_distribution:
        low: 3
        medium: 7
        high: 2
      
      status_distribution:
        pending: 12
        in_progress: 0
        completed: 0
        blocked: 0
    
    execution_sequence:
      can_start: ["mt-001-001"]
      by_wave:
        wave_1:
          tasks: ["mt-001-001", "mt-001-002"]
          time_hours: 6
        wave_2:
          tasks: ["mt-001-003", "mt-001-004"]
          time_hours: 8
    
    progress:
      completed_percentage: 0
      completed_tasks: 0
      pending_tasks: 12
      total_estimated_hours: 48
      completed_hours: 0
      remaining_hours: 48

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# DIRECTORY STRUCTURE
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

directory_structure:
  description: |
    docs/transformation/{feature-id}/
    ├── microtasks/
    │   ├── mt-XXX-001.yml
    │   ├── mt-XXX-002.yml
    │   └── ...
    ├── categories/                    # Category indexes
    │   ├── backend.yml                # Backend micro-tasks
    │   ├── frontend.yml               # Frontend micro-tasks
    │   ├── database.yml               # Database micro-tasks
    │   ├── infra.yml                  # Infra micro-tasks
    │   ├── docs.yml                   # Docs micro-tasks
    │   └── tests.yml                  # Tests micro-tasks
    ├── dependencies/
    │   └── ...
    ├── execution/
    │   └── ...
    └── microtasks-index.yml           # General index
