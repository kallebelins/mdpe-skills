# ====================================================================
# MDPE Framework - Dependency Templates
# ====================================================================
# Version: 1.0.0
# Purpose: Templates for analyzing dependencies between micro-tasks
# ====================================================================
#
# This file contains the templates for the 7 dependency files:
# 1. full-graph.yml - Overview of the dependency graph
# 2. hard-dependencies.yml - Blocking dependencies
# 3. soft-dependencies.yml - Preferential dependencies
# 4. external-dependencies.yml - External dependencies
# 5. waves.yml - Sequencing into execution waves
# 6. critical-path.yml - Project critical path
# 7. parallelizable.yml - Parallelizable tasks
#
# Location of generated files:
#   docs/transformation/{feature-id}/dependencies/
# ====================================================================

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# TEMPLATE 1: FULL DEPENDENCY GRAPH
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# File: full-graph.yml
# Description: Complete view of the dependency graph across all
#              micro-tasks, including upstream and downstream.
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

dependency_graph_template:
  # ──────────────────────────────────────────────────────────────────
  # FILE HEADER
  # ──────────────────────────────────────────────────────────────────
  # # ====================================================================
  # # Full Dependency Graph - {feature-id}
  # # ====================================================================
  # # Version: 1.0.0
  # # Date: {YYYY-MM-DD}
  # # 
  # # Description:
  # #   Complete view of the dependency graph across all micro-tasks,
  # #   including upstream (predecessors) and downstream (successors).
  # # ====================================================================
  # ──────────────────────────────────────────────────────────────────

  dependency_graph:
    metadata:
      feature_id: "feat-XXX"
      total_microtasks: 0  # Total number of micro-tasks
      total_hard_dependencies: 0  # Total blocking dependencies
      total_soft_dependencies: 0  # Total preferential dependencies
      total_external_dependencies: 0  # Total external dependencies
    
    microtasks:
      mt-XXX-YYY:
        name: "Descriptive name of the micro-task"
        category: "backend"  # backend | frontend | database | infra | docs | tests
        upstream_hard: []  # IDs of tasks that block this one
        upstream_soft: []  # IDs of tasks that facilitate this one
        downstream_hard: []  # IDs of tasks blocked by this one
        downstream_soft: []  # IDs of tasks facilitated by this one
        level: 1  # Level in the graph (1 = no upstream dependencies)
        wave: "wave_N_name"  # Execution wave
    
    graph_analysis:
      total_levels: 0  # Total number of levels in the graph
      tasks_per_level:
        level_1: 0
        level_2: 0
        # ... add levels as needed
      
      tasks_without_upstream: []  # IDs of tasks that can start immediately
      tasks_without_downstream: []  # IDs of tasks that don't block others
      
      convergence_points:
        - task: "mt-XXX-YYY"
          description: "Why this task is a convergence point"
          converging_dependencies: 0
      
      divergence_points:
        - task: "mt-XXX-YYY"
          description: "Why this task is a divergence point"
          diverging_dependencies: 0
    
    graph_validation:
      cycles_detected: []  # If empty, the graph is valid (DAG)
      status: "valid_graph"  # valid_graph | cycle_detected | incomplete
      observations: |
        State whether the graph is acyclic (DAG), whether there are
        cycles to fix, or other relevant observations about the graph structure.

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# TEMPLATE 2: HARD (BLOCKING) DEPENDENCIES
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# File: hard-dependencies.yml
# Description: Blocking dependencies between micro-tasks.
#              Task B can only start after task A is 100% complete.
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

hard_dependencies_template:
  # ──────────────────────────────────────────────────────────────────
  # FILE HEADER
  # ──────────────────────────────────────────────────────────────────
  # # ====================================================================
  # # Hard (Blocking) Dependencies - {feature-id}
  # # ====================================================================
  # # Version: 1.0.0
  # # Date: {YYYY-MM-DD}
  # # 
  # # Description:
  # #   Blocking dependencies between micro-tasks. Task B can only
  # #   start after task A is 100% complete.
  # # ====================================================================
  # ──────────────────────────────────────────────────────────────────

  hard_dependencies:
    metadata:
      feature_id: "feat-XXX"
      total_dependencies: 0  # Total hard dependencies
      total_microtasks_with_deps: 0  # Tasks with at least 1 hard dependency
    
    dependencies:
      # Group by layer flow (Database → Domain → Infrastructure → Application → API → Frontend → Tests)
      
      # Database → Database
      - source: "mt-XXX-YYY"  # Predecessor task
        target: "mt-XXX-ZZZ"  # Dependent task
        reason: "Why B can only start after A is complete"
      
      # Database → Domain
      - source: "mt-XXX-YYY"
        target: "mt-XXX-ZZZ"
        reason: "Technical justification for the dependency"
      
      # Domain → Domain
      - source: "mt-XXX-YYY"
        target: "mt-XXX-ZZZ"
        reason: "Technical justification for the dependency"
      
      # Domain → Infrastructure
      - source: "mt-XXX-YYY"
        target: "mt-XXX-ZZZ"
        reason: "Technical justification for the dependency"
      
      # Infrastructure → Application
      - source: "mt-XXX-YYY"
        target: "mt-XXX-ZZZ"
        reason: "Technical justification for the dependency"
      
      # Application → API
      - source: "mt-XXX-YYY"
        target: "mt-XXX-ZZZ"
        reason: "Technical justification for the dependency"
      
      # API → Frontend
      - source: "mt-XXX-YYY"
        target: "mt-XXX-ZZZ"
        reason: "Technical justification for the dependency"
      
      # API → Tests
      - source: "mt-XXX-YYY"
        target: "mt-XXX-ZZZ"
        reason: "Technical justification for the dependency"
      
      # Application → Tests
      - source: "mt-XXX-YYY"
        target: "mt-XXX-ZZZ"
        reason: "Technical justification for the dependency"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# TEMPLATE 3: SOFT (PREFERENTIAL) DEPENDENCIES
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# File: soft-dependencies.yml
# Description: Preferential dependencies between micro-tasks.
#              Task B is facilitated if task A is ready, but is not blocking.
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

soft_dependencies_template:
  # ──────────────────────────────────────────────────────────────────
  # FILE HEADER
  # ──────────────────────────────────────────────────────────────────
  # # ====================================================================
  # # Soft (Preferential) Dependencies - {feature-id}
  # # ====================================================================
  # # Version: 1.0.0
  # # Date: {YYYY-MM-DD}
  # # 
  # # Description:
  # #   Preferential dependencies between micro-tasks. Task B is
  # #   facilitated if task A is ready, but is not blocking.
  # # ====================================================================
  # ──────────────────────────────────────────────────────────────────

  soft_dependencies:
    metadata:
      feature_id: "feat-XXX"
      total_dependencies: 0  # Total soft dependencies
      total_microtasks_with_deps: 0  # Tasks with at least 1 soft dependency
    
    dependencies:
      - source: "mt-XXX-YYY"  # Predecessor task
        target: "mt-XXX-ZZZ"  # Task that benefits
        reason: "Why B is facilitated if A is ready"
      
      # Common reason examples:
      # - "Entity X can be created after the schema, but it's preferable to have the schema ready"
      # - "Service Y can function without Z, but it's preferable to have Z ready to avoid mocks"
      # - "Component can be created before the API, but it's preferable to have the API as a reference"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# TEMPLATE 4: EXTERNAL DEPENDENCIES
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# File: external-dependencies.yml
# Description: Dependencies on external resources (services, APIs, libraries)
#              that are not under the development team's control.
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

external_dependencies_template:
  # ──────────────────────────────────────────────────────────────────
  # FILE HEADER
  # ──────────────────────────────────────────────────────────────────
  # # ====================================================================
  # # External Dependencies - {feature-id}
  # # ====================================================================
  # # Version: 1.0.0
  # # Date: {YYYY-MM-DD}
  # # 
  # # Description:
  # #   Dependencies on external resources (services, APIs, libraries)
  # #   that are not under the development team's control.
  # # ====================================================================
  # ──────────────────────────────────────────────────────────────────

  external_dependencies:
    metadata:
      feature_id: "feat-XXX"
      total_dependencies: 0  # Total external dependencies
      total_microtasks_with_deps: 0  # Tasks with at least 1 external dependency
    
    dependencies:
      # Infrastructure
      - microtask: "mt-XXX-YYY"
        type: "service"  # service | library | framework | module | api
        resource: "Resource Name (e.g. PostgreSQL 16.x)"
        status: "available"  # available | in_development | unavailable
        criticality: "high"  # low | medium | high
        delay_impact: "Description of the impact if unavailable"
        mitigation_action: "Action to mitigate if unavailable"
        notes: "Additional notes (optional)"
      
      # Libraries
      - microtask: "mt-XXX-YYY"
        type: "library"
        resource: "Library Name (e.g. Entity Framework Core)"
        status: "available"
        criticality: "high"
        delay_impact: "Blocks feature X"
        mitigation_action: "Ensure the library is installed in the project"
      
      # Frameworks
      - microtask: "mt-XXX-YYY"
        type: "framework"
        resource: "Framework Name (e.g. Angular 18)"
        status: "available"
        criticality: "high"
        delay_impact: "Blocks frontend development"
        mitigation_action: "Ensure the framework is configured"
      
      # External APIs
      - microtask: "mt-XXX-YYY"
        type: "api"
        resource: "API Name (e.g. Azure Translator API)"
        status: "available"
        criticality: "medium"
        delay_impact: "Blocks feature X"
        mitigation_action: "Configure API credentials"
        notes: "Can use a mock temporarily during development"
      
      # Internal components (from other teams)
      - microtask: "mt-XXX-YYY"
        type: "component"
        resource: "Component Name (e.g. Concierge Component)"
        status: "in_development"
        criticality: "high"
        delay_impact: "Blocks integration with component X"
        mitigation_action: |
          Create a stub/mock for parallel development.
          Implement the real integration once the component is available.
        notes: "This is a critical dependency that may delay the project"
    
    status_summary:
      available: 0
      in_development: 0
      unavailable: 0
    
    criticality_summary:
      high: 0
      medium: 0
      low: 0
    
    main_risks:
      - risk: "Description of the risk"
        probability: "low"  # low | medium | high
        impact: "high"  # low | medium | high
        mitigation: "Mitigation strategy"
        affected_microtasks: ["mt-XXX-YYY", "mt-XXX-ZZZ"]

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# TEMPLATE 5: WAVE SEQUENCING
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# File: waves.yml
# Description: Organization of micro-tasks into waves (execution rounds)
#              based on hard dependencies and parallelization opportunities.
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

wave_sequencing_template:
  # ──────────────────────────────────────────────────────────────────
  # FILE HEADER
  # ──────────────────────────────────────────────────────────────────
  # # ====================================================================
  # # Wave Sequencing - {feature-id}
  # # ====================================================================
  # # Version: 1.0.0
  # # Date: {YYYY-MM-DD}
  # # 
  # # Description:
  # #   Organization of micro-tasks into waves (execution rounds)
  # #   based on hard dependencies and parallelization opportunities.
  # # ====================================================================
  # ──────────────────────────────────────────────────────────────────

  wave_sequencing:
    metadata:
      feature_id: "feat-XXX"
      total_waves: 0  # Total number of waves
      total_sequential_time: "X hours"  # Time if executed sequentially
      total_optimized_parallel_time: "Y hours"  # Time with maximum parallelization
      parallelization_gain: "Z hours (N% reduction)"
    
    waves:
      wave_N_name:
        name: "Descriptive Wave Name (e.g. Foundation - Database Schemas)"
        description: "Description of this wave's objective"
        microtasks:
          - id: "mt-XXX-YYY"
            name: "Micro-task name"
            estimate: "X hours"
          - id: "mt-XXX-ZZZ"
            name: "Micro-task name"
            estimate: "Y hours"
        can_run_parallel: true  # true | false
        justification: |
          Explain why the tasks can or cannot be run in parallel.
          List the dependencies between them.
        sequential_estimate: "X hours"
        parallel_estimate: "Y hours"
        parallelization_gain: "Z hours"
        upstream_dependencies:
          - "mt-XXX-AAA (hard for mt-XXX-YYY)"
        external_dependencies:
          - "Required external resource"
        deliverables:
          - "Deliverable 1"
          - "Deliverable 2"
    
    parallelization_summary:
      total_sequential_time: "X hours"
      total_parallel_time: "Y hours"
      total_gain: "Z hours (N% reduction)"
      
      waves_with_parallelization:
        - wave: "wave_N_name"
          gain: "X hours"
      
      resource_recommendation:
        - wave: "wave_N_name"
          suggested_developers: 0
          justification: "Why this number of developers"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# TEMPLATE 6: CRITICAL PATH
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# File: critical-path.yml
# Description: Identification of the critical path - the longest chain of
#              dependent tasks that determines the project's minimum duration.
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

critical_path_template:
  # ──────────────────────────────────────────────────────────────────
  # FILE HEADER
  # ──────────────────────────────────────────────────────────────────
  # # ====================================================================
  # # Critical Path - {feature-id}
  # # ====================================================================
  # # Version: 1.0.0
  # # Date: {YYYY-MM-DD}
  # # 
  # # Description:
  # #   Identification of the critical path - the longest chain of
  # #   dependent tasks that determines the project's minimum duration.
  # # ====================================================================
  # ──────────────────────────────────────────────────────────────────

  critical_path:
    metadata:
      feature_id: "feat-XXX"
      total_time: "X hours"
      definition: |
        The critical path is the longest chain of dependent tasks.
        Even if other tasks are done in parallel, the project cannot
        be completed in less time than the critical path.
    
    sequence:
      - id: "mt-XXX-YYY"
        name: "Micro-task name"
        estimate: "X hours"
        wave: "wave_N_name"
        reason: "Why this task is on the critical path"
    
    total_time: "X hours"
    
    analysis:
      description: |
        Explanation of the critical path flow:
        1. Phase 1 - Description
        2. Phase 2 - Description
        ...
    
    path_comparison:
      main_critical_path:
        time: "X hours"
        sequence: ["mt-XXX-001", "mt-XXX-002", "..."]
      
      alternative_path_N:
        time: "Y hours"
        sequence: ["mt-XXX-001", "mt-XXX-003", "..."]
        observation: "Why this path is an alternative"
    
    critical_tasks:
      - id: "mt-XXX-YYY"
        criticality: "Critical"
        reason: "Why this task is critical"
        action: "Recommended action to prioritize"
    
    possible_optimizations:
      - task: "mt-XXX-YYY"
        action: "Description of the possible optimization"
        time_reduction: "X hours"
        risk: "Low | Medium | High - Risk description"
        recommendation: "Recommendation to apply or not"
    
    delay_impact:
      - task: "mt-XXX-YYY"
        delay: "X hours"
        critical_path_impact: "+X hours"
        project_impact: "+X hours (critical | not critical)"
    
    recommendations:
      - type: "prioritization"  # prioritization | monitoring | buffer | parallelization
        description: |
          Detailed description of the recommendation
        action: "Specific action to take"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# TEMPLATE 7: PARALLELIZABLE TASKS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# File: parallelizable.yml
# Description: Identification of groups of tasks that can be executed
#              in parallel, optimizing the project's total time.
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

parallelizable_tasks_template:
  # ──────────────────────────────────────────────────────────────────
  # FILE HEADER
  # ──────────────────────────────────────────────────────────────────
  # # ====================================================================
  # # Parallelizable Tasks - {feature-id}
  # # ====================================================================
  # # Version: 1.0.0
  # # Date: {YYYY-MM-DD}
  # # 
  # # Description:
  # #   Identification of groups of tasks that can be executed in
  # #   parallel, optimizing the project's total time.
  # # ====================================================================
  # ──────────────────────────────────────────────────────────────────

  parallelizable_tasks:
    metadata:
      feature_id: "feat-XXX"
      total_groups: 0  # Number of parallelization groups
      total_parallelizable_tasks: 0  # Total tasks that can be parallelized
      potential_gain: "X hours"  # Total gain from parallelization
    
    parallelization_groups:
      group_N_wave_X:
        name: "Group Name (e.g. Database Schemas Wave 1)"
        description: "Description of what the tasks have in common"
        tasks:
          - id: "mt-XXX-YYY"
            name: "Micro-task name"
            estimate: "X hours"
          - id: "mt-XXX-ZZZ"
            name: "Micro-task name"
            estimate: "Y hours"
        common_dependency: "mt-XXX-AAA"  # Dependency shared by all
        can_parallelize: true
        gain: "X hours"
        developers_needed: 0
        notes: "Explanation of why they can be executed in parallel"
    
    parallelization_summary:
      total_sequential_time: "X hours"
      total_parallel_time: "Y hours"
      total_gain: "Z hours (N% reduction)"
      
      groups_by_priority:
        high_priority:
          - group: "group_N_wave_X"
            reason: "Why this group has high priority"
            developers_needed: 0
        
        medium_priority:
          - group: "group_N_wave_X"
            reason: "Why this group has medium priority"
            developers_needed: 0
        
        low_priority:
          - group: "group_N_wave_X"
            reason: "Why this group has low priority"
            developers_needed: 0
    
    execution_recommendations:
      - phase: "Phase Name"
        action: "Recommended action"
        expected_gain: "X hours"
        criticality: "High | Medium | Low - Description"
    
    resource_requirements:
      max_total_developers: 0  # For maximum parallelization
      average_total_developers: 0  # Balanced
      min_total_developers: 0  # Sequential
      
      distribution_by_wave:
        wave_N: "X developers (description)"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# USAGE INSTRUCTIONS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

usage_instructions:
  description: |
    This file contains the templates for the 7 dependency files.
    Use each section as a base to create the individual files.
  
  generation_flow:
    step_1:
      description: "Analyze existing micro-tasks"
      input: "docs/transformation/{feature-id}/microtasks/*.yml"
      action: "Identify dependencies between tasks"
    
    step_2:
      description: "Create the full graph"
      output: "dependencies/full-graph.yml"
      action: "Map all upstream/downstream dependencies"
    
    step_3:
      description: "Split hard and soft dependencies"
      output: "dependencies/hard-dependencies.yml, dependencies/soft-dependencies.yml"
      action: "Classify each dependency as blocking or preferential"
    
    step_4:
      description: "Identify external dependencies"
      output: "dependencies/external-dependencies.yml"
      action: "List required external resources"
    
    step_5:
      description: "Organize into waves"
      output: "dependencies/waves.yml"
      action: "Group tasks by level in the graph"
    
    step_6:
      description: "Identify the critical path"
      output: "dependencies/critical-path.yml"
      action: "Find the longest chain of dependencies"
    
    step_7:
      description: "Identify parallelization"
      output: "dependencies/parallelizable.yml"
      action: "Group tasks that can be executed in parallel"
  
  validation:
    - "The graph is acyclic (DAG)"
    - "All hard dependencies are necessary"
    - "Soft dependencies are not mandatory"
    - "External dependencies have mitigation"
    - "Waves follow the dependency order"
    - "The critical path is the longest sequence"
    - "Parallelization groups are independent"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# EXAMPLE DIRECTORY STRUCTURE
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

directory_structure:
  description: |
    docs/transformation/{feature-id}/dependencies/
    ├── full-graph.yml           # Graph overview
    ├── hard-dependencies.yml    # Blocking dependencies
    ├── soft-dependencies.yml    # Preferential dependencies
    ├── external-dependencies.yml # External dependencies
    ├── waves.yml                # Wave sequencing
    ├── critical-path.yml        # Critical path
    └── parallelizable.yml       # Parallelizable tasks
