# ====================================================================
# MDPE Framework - Hypothesis and Risk Validation Templates
# ====================================================================
# Version: 1.0.0
# Purpose: Templates for hypothesis validation and risk mapping
# Phase: Discovery & Cognitive Backlog (Strategic)
# ====================================================================
#
# This file contains the templates for the 10 output files:
#
# GENERAL INDEX:
# 1. 05-validation-risks.yml - Consolidated general index
#
# HYPOTHESES (docs/discovery/hypotheses/):
# 2. value-hypotheses.yml - Value hypotheses
# 3. usability-hypotheses.yml - Usability hypotheses
# 4. feasibility-hypotheses.yml - Feasibility hypotheses
#
# RISKS (docs/discovery/risks/):
# 5. technology-risks.yml - Technology risks
# 6. regulatory-risks.yml - Regulatory risks
# 7. market-risks.yml - Market risks
# 8. operational-risks.yml - Operational risks
# 9. risk-matrix.yml - Risk matrix (Probability × Impact)
#
# VALIDATION (docs/discovery/validation/):
# 10. validation-plans.yml - Validation plans
#
# Location of generated files:
#   docs/discovery/
#   ├── 05-validation-risks.yml
#   ├── hypotheses/
#   │   ├── value-hypotheses.yml
#   │   ├── usability-hypotheses.yml
#   │   └── feasibility-hypotheses.yml
#   ├── risks/
#   │   ├── technology-risks.yml
#   │   ├── regulatory-risks.yml
#   │   ├── market-risks.yml
#   │   ├── operational-risks.yml
#   │   └── risk-matrix.yml
#   └── validation/
#       └── validation-plans.yml
#
# --------------------------------------------------------------------
# EVERY FILE BELOW IS CONDITIONAL ON REAL CONTENT [C]. Create
# hypotheses/value-hypotheses.yml only if the session raised >=1 value
# hypothesis; create risks/regulatory-risks.yml only if there is a
# real regulatory risk (a project with no personal data may have
# none), and so on for each of the 9 per-category files. The general
# index (05-validation-risks.yml) is [C] too: it exists only when
# there is at least one hypothesis or risk to consolidate. Do not
# create an empty file for a category with nothing real to record -
# that is a correct, honest absence, not a gap.
# ====================================================================

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# TEMPLATE 1: GENERAL VALIDATION AND RISKS INDEX
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# File: 05-validation-risks.yml
# Description: General index consolidating all hypotheses and risks
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

validation_risks_index_template:
  # ──────────────────────────────────────────────────────────────────
  # FILE HEADER
  # ──────────────────────────────────────────────────────────────────
  # # ====================================================================
  # # Hypothesis and Risk Validation - {product}
  # # ====================================================================
  # # Version: 1.0.0
  # # Date: {YYYY-MM-DD}
  # # 
  # # Description:
  # #   General index of unvalidated hypotheses and identified risks
  # #   for the product/project.
  # # ====================================================================
  # ──────────────────────────────────────────────────────────────────

  validation_risks:
    metadata:
      product: "Product Name"
      version: "1.0.0"
      created_at: "YYYY-MM-DD"
      updated_at: "YYYY-MM-DD"
      responsible: "Responsible Name"
    
    # ──────────────────────────────────────────────────────────────────
    # EXECUTIVE SUMMARY
    # ──────────────────────────────────────────────────────────────────
    summary:
      total_hypotheses: 0
      total_risks: 0
      
      hypotheses_by_type:
        value: 0
        usability: 0
        feasibility: 0
      
      hypotheses_by_confidence:
        high: 0  # >80%
        medium: 0  # 50-80%
        low: 0  # <50%
      
      risks_by_category:
        technology: 0
        regulatory: 0
        market: 0
        operational: 0
      
      risks_by_severity:
        critical: 0  # High probability × High impact
        high: 0  # High/Medium or Medium/High
        medium: 0  # Medium/Medium
        low: 0  # Low/*
      
      validation_plans:
        mvp: 0
        prototype: 0
        research: 0
        spike: 0
    
    # ──────────────────────────────────────────────────────────────────
    # RELATED FILES
    # ──────────────────────────────────────────────────────────────────
    files:
      hypotheses:
        - file: "hypotheses/value-hypotheses.yml"
          description: "Value hypotheses (do users want this?)"
        - file: "hypotheses/usability-hypotheses.yml"
          description: "Usability hypotheses (will they be able to use it?)"
        - file: "hypotheses/feasibility-hypotheses.yml"
          description: "Feasibility hypotheses (is it technically viable?)"
      
      risks:
        - file: "risks/technology-risks.yml"
          description: "Technology risks (integration, performance, security)"
        - file: "risks/regulatory-risks.yml"
          description: "Regulatory risks (compliance, LGPD, licenses)"
        - file: "risks/market-risks.yml"
          description: "Market risks (competition, timing, adoption)"
        - file: "risks/operational-risks.yml"
          description: "Operational risks (resources, skills, infrastructure)"
        - file: "risks/risk-matrix.yml"
          description: "Risk matrix (Probability × Impact)"
      
      validation:
        - file: "validation/validation-plans.yml"
          description: "Validation plans (MVP, prototype, research, spike)"
    
    # ──────────────────────────────────────────────────────────────────
    # CRITICAL HYPOTHESES (Summary)
    # ──────────────────────────────────────────────────────────────────
    critical_hypotheses:
      - id: "hyp-XXX"
        type: "value"  # value | usability | feasibility
        description: "Description of the critical hypothesis"
        confidence: "low"  # high | medium | low
        affected_features: ["feat-001", "feat-002"]
        validation_plan: "validation_type"  # mvp | prototype | research | spike
    
    # ──────────────────────────────────────────────────────────────────
    # CRITICAL RISKS (Summary)
    # ──────────────────────────────────────────────────────────────────
    critical_risks:
      - id: "risk-XXX"
        category: "technology"  # technology | regulatory | market | operational
        description: "Description of the critical risk"
        probability: "high"  # low | medium | high
        impact: "high"  # low | medium | high
        affected_features: ["feat-001", "feat-002"]
        mitigation_summary: "Summary of the mitigation strategy"
    
    # ──────────────────────────────────────────────────────────────────
    # NEXT STEPS
    # ──────────────────────────────────────────────────────────────────
    next_steps:
      - action: "Description of the priority action"
        responsible: "Responsible name"
        deadline: "YYYY-MM-DD"
        status: "pending"  # pending | in_progress | completed

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# TEMPLATE 2: VALUE HYPOTHESES
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# File: hypotheses/value-hypotheses.yml
# Description: Hypotheses about whether users really want/need the
#              proposed features.
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

value_hypotheses_template:
  # ──────────────────────────────────────────────────────────────────
  # FILE HEADER
  # ──────────────────────────────────────────────────────────────────
  # # ====================================================================
  # # Value Hypotheses - {product}
  # # ====================================================================
  # # Version: 1.0.0
  # # Date: {YYYY-MM-DD}
  # # 
  # # Description:
  # #   Hypotheses about whether users really want/need the proposed
  # #   features. Answers the question: "Do users want this?"
  # # ====================================================================
  # ──────────────────────────────────────────────────────────────────

  value_hypotheses:
    metadata:
      product: "Product Name"
      type: "value"
      total_hypotheses: 0
      updated_at: "YYYY-MM-DD"
    
    hypotheses:
      - id: "hyp-value-001"
        title: "Descriptive title of the hypothesis"
        description: |
          Full description of the hypothesis.
          What are we assuming about value for the user?
        
        # Related feature(s)
        related_features:
          - id: "feat-XXX"
            name: "Feature name"
            priority: "must-have"  # must-have | should-have | could-have | wont-have
        
        # Affected personas
        affected_personas:
          - name: "Persona Name"
            impact: "high"  # low | medium | high
        
        # Confidence level
        confidence:
          level: "medium"  # high (>80%) | medium (50-80%) | low (<50%)
          estimated_percentage: 65
          justification: |
            Explanation of why we have this confidence level.
            What evidence do we have? What uncertainties exist?
        
        # Existing evidence
        evidence:
          - type: "quantitative"  # quantitative | qualitative | analogous | assumption
            description: "Description of the evidence"
            source: "Evidence source"
            date: "YYYY-MM-DD"
          
          - type: "qualitative"
            description: "Description of the evidence"
            source: "User interviews"
            date: "YYYY-MM-DD"
        
        # Validation plan
        validation:
          method: "research"  # mvp | prototype | research | spike
          description: |
            Description of how this hypothesis will be validated.
          
          success_criteria: |
            Objective criterion that indicates whether the hypothesis was validated.
            E.g.: "70% of users show interest in the feature"
          
          estimated_deadline: "2 weeks"
          required_resources:
            - "Description of the required resource"
        
        # Status
        status: "not_validated"  # not_validated | validating | validated | invalidated
        
        # Impact if invalidated
        invalidation_impact: |
          What happens if we discover this hypothesis is false?
          Which decisions would be affected?

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# TEMPLATE 3: USABILITY HYPOTHESES
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# File: hypotheses/usability-hypotheses.yml
# Description: Hypotheses about whether users will be able to use the
#              features effectively.
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

usability_hypotheses_template:
  # ──────────────────────────────────────────────────────────────────
  # FILE HEADER
  # ──────────────────────────────────────────────────────────────────
  # # ====================================================================
  # # Usability Hypotheses - {product}
  # # ====================================================================
  # # Version: 1.0.0
  # # Date: {YYYY-MM-DD}
  # # 
  # # Description:
  # #   Hypotheses about whether users will be able to use the features
  # #   effectively. Answers the question: "Will users be able to use it?"
  # # ====================================================================
  # ──────────────────────────────────────────────────────────────────

  usability_hypotheses:
    metadata:
      product: "Product Name"
      type: "usability"
      total_hypotheses: 0
      updated_at: "YYYY-MM-DD"
    
    hypotheses:
      - id: "hyp-usab-001"
        title: "Descriptive title of the hypothesis"
        description: |
          Full description of the hypothesis.
          What are we assuming about the ability to use it?
        
        # Related feature(s)
        related_features:
          - id: "feat-XXX"
            name: "Feature name"
        
        # Usability aspects
        aspects:
          - type: "learnability"  # learnability | efficiency | memorability | errors | satisfaction
            description: "Description of the usability aspect"
        
        # Affected personas
        affected_personas:
          - name: "Persona Name"
            technical_level: "low"  # low | medium | high
            usage_context: "Context in which the persona will use it"
        
        # Confidence level
        confidence:
          level: "medium"  # high (>80%) | medium (50-80%) | low (<50%)
          estimated_percentage: 50
          justification: |
            Explanation of why we have this confidence level.
        
        # Existing evidence
        evidence:
          - type: "qualitative"
            description: "Description of the evidence"
            source: "Evidence source"
        
        # Validation plan
        validation:
          method: "prototype"  # mvp | prototype | research | spike
          description: |
            Description of how this hypothesis will be validated.
            E.g.: "Usability test with 5 users using a prototype"
          
          success_criteria: |
            Objective criterion that indicates whether the hypothesis was validated.
            E.g.: "80% of users complete the task in under 3 minutes"
          
          metrics:
            - name: "Completion rate"
              target: ">= 80%"
            - name: "Average task time"
              target: "< 3 minutes"
            - name: "Number of errors"
              target: "< 2 per task"
        
        # Status
        status: "not_validated"
        
        # Impact if invalidated
        invalidation_impact: |
          What happens if we discover this hypothesis is false?

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# TEMPLATE 4: FEASIBILITY HYPOTHESES
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# File: hypotheses/feasibility-hypotheses.yml
# Description: Hypotheses about whether it is technically feasible to
#              implement the proposed features.
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

feasibility_hypotheses_template:
  # ──────────────────────────────────────────────────────────────────
  # FILE HEADER
  # ──────────────────────────────────────────────────────────────────
  # # ====================================================================
  # # Feasibility Hypotheses - {product}
  # # ====================================================================
  # # Version: 1.0.0
  # # Date: {YYYY-MM-DD}
  # # 
  # # Description:
  # #   Hypotheses about whether it is technically feasible to implement
  # #   the proposed features. Answers: "Is it technically feasible?"
  # # ====================================================================
  # ──────────────────────────────────────────────────────────────────

  feasibility_hypotheses:
    metadata:
      product: "Product Name"
      type: "feasibility"
      total_hypotheses: 0
      updated_at: "YYYY-MM-DD"
    
    hypotheses:
      - id: "hyp-feas-001"
        title: "Descriptive title of the hypothesis"
        description: |
          Full description of the hypothesis.
          What are we assuming about technical feasibility?
        
        # Related feature(s)
        related_features:
          - id: "feat-XXX"
            name: "Feature name"
        
        # Technical aspects
        technical_aspects:
          - type: "integration"  # integration | performance | security | scalability | cost
            description: "Description of the technical aspect"
            technologies_involved: ["Technology 1", "Technology 2"]
        
        # Technical dependencies
        dependencies:
          - type: "api"  # api | service | library | infrastructure
            name: "Dependency name"
            status: "available"  # available | in_development | uncertain
            risk: "low"  # low | medium | high
        
        # Confidence level
        confidence:
          level: "low"  # high (>80%) | medium (50-80%) | low (<50%)
          estimated_percentage: 40
          justification: |
            Explanation of why we have this confidence level.
            E.g.: "We've never worked with this API before"
        
        # Existing evidence
        evidence:
          - type: "analogous"
            description: "A similar project was already implemented in another context"
            source: "Internal documentation"
        
        # Validation plan
        validation:
          method: "spike"  # mvp | prototype | research | spike
          description: |
            Description of how this hypothesis will be validated.
            E.g.: "2-day technical spike to test API integration"
          
          success_criteria: |
            Objective criterion that indicates whether the hypothesis was validated.
            E.g.: "Successfully call the API and process the response in < 500ms"
          
          spike_effort: "2 days"
          required_resources:
            - "Senior developer"
            - "Access to sandbox API"
        
        # Status
        status: "not_validated"
        
        # Impact if invalidated
        invalidation_impact: |
          What happens if we discover this hypothesis is false?
          What alternatives exist?
        
        # Technical alternatives
        alternatives:
          - description: "Technical alternative if the hypothesis is invalidated"
            feasibility: "medium"  # low | medium | high
            additional_cost: "Description of the additional cost"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# TEMPLATE 5: TECHNOLOGY RISKS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# File: risks/technology-risks.yml
# Description: Risks related to technology, integration, performance,
#              and security.
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

technology_risks_template:
  # ──────────────────────────────────────────────────────────────────
  # FILE HEADER
  # ──────────────────────────────────────────────────────────────────
  # # ====================================================================
  # # Technology Risks - {product}
  # # ====================================================================
  # # Version: 1.0.0
  # # Date: {YYYY-MM-DD}
  # # 
  # # Description:
  # #   Risks related to technology, integration, performance, and security.
  # # ====================================================================
  # ──────────────────────────────────────────────────────────────────

  technology_risks:
    metadata:
      product: "Product Name"
      category: "technology"
      total_risks: 0
      updated_at: "YYYY-MM-DD"
    
    risks:
      - id: "risk-tech-001"
        title: "Descriptive title of the risk"
        description: |
          Full description of the technology risk.
          What could technically go wrong?
        
        # Subcategory
        subcategory: "integration"  # integration | performance | security | scalability | obsolescence
        
        # Affected features
        affected_features:
          - id: "feat-XXX"
            name: "Feature name"
            impact: "high"  # low | medium | high
        
        # Risk assessment
        assessment:
          probability: "medium"  # low | medium | high
          probability_percentage: 50  # 0-100
          impact: "high"  # low | medium | high
          impact_description: |
            Detailed description of the impact if the risk materializes.
          
          severity: "high"  # low | medium | high | critical
          # Severity = Probability × Impact
          # Critical: High × High
          # High: High × Medium or Medium × High
          # Medium: Medium × Medium
          # Low: Low × *
        
        # Warning indicators
        warning_indicators:
          - indicator: "Description of the indicator that signals the risk is materializing"
            metric: "Quantifiable metric if possible"
        
        # Mitigation strategy
        mitigation:
          strategy: "mitigate"  # avoid | mitigate | transfer | accept
          description: |
            Detailed description of the mitigation strategy.
          
          actions:
            - action: "Specific mitigation action"
              responsible: "Responsible name"
              deadline: "YYYY-MM-DD"
              status: "pending"  # pending | in_progress | completed
              estimated_cost: "Description of the cost"
          
          contingency_plan: |
            What to do if the risk materializes despite mitigation?
        
        # Risk status
        status: "identified"  # identified | monitoring | mitigating | materialized | resolved
        
        # Monitoring responsible
        responsible: "Responsible name"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# TEMPLATE 6: REGULATORY RISKS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# File: risks/regulatory-risks.yml
# Description: Risks related to compliance, LGPD, licenses, and regulations.
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

regulatory_risks_template:
  # ──────────────────────────────────────────────────────────────────
  # FILE HEADER
  # ──────────────────────────────────────────────────────────────────
  # # ====================================================================
  # # Regulatory Risks - {product}
  # # ====================================================================
  # # Version: 1.0.0
  # # Date: {YYYY-MM-DD}
  # # 
  # # Description:
  # #   Risks related to compliance, LGPD, licenses, and regulations.
  # # ====================================================================
  # ──────────────────────────────────────────────────────────────────

  regulatory_risks:
    metadata:
      product: "Product Name"
      category: "regulatory"
      total_risks: 0
      updated_at: "YYYY-MM-DD"
    
    risks:
      - id: "risk-reg-001"
        title: "Descriptive title of the risk"
        description: |
          Full description of the regulatory risk.
          Which regulation could be affected?
        
        # Subcategory
        subcategory: "lgpd"  # lgpd | compliance | licenses | tax | sector-specific
        
        # Affected regulation
        regulation:
          name: "Regulation name (e.g. LGPD)"
          articles: ["Art. X", "Art. Y"]
          regulatory_body: "Name of the regulatory body"
        
        # Affected features
        affected_features:
          - id: "feat-XXX"
            name: "Feature name"
            sensitive_data: true  # If it involves personal/sensitive data
        
        # Risk assessment
        assessment:
          probability: "low"  # low | medium | high
          impact: "high"  # low | medium | high
          legal_impact: |
            Description of the legal impact if the risk materializes.
            E.g.: fines, sanctions, lawsuits.
          
          severity: "high"
        
        # Mitigation
        mitigation:
          strategy: "avoid"  # avoid | mitigate | transfer | accept
          description: |
            Description of the mitigation strategy.
          
          actions:
            - action: "Specific action"
              responsible: "Name"
              deadline: "YYYY-MM-DD"
              status: "pending"
          
          legal_review_required: true  # If legal counsel is needed
        
        # Status
        status: "identified"
        responsible: "Responsible name"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
