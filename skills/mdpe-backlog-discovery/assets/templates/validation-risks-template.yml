# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# TEMPLATE 9: RISK MATRIX
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# File: risks/risk-matrix.yml
# Description: Consolidated risk matrix (Probability × Impact)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

risk_matrix_template:
  # ──────────────────────────────────────────────────────────────────
  # FILE HEADER
  # ──────────────────────────────────────────────────────────────────
  # # ====================================================================
  # # Risk Matrix - {product}
  # # ====================================================================
  # # Version: 1.0.0
  # # Date: {YYYY-MM-DD}
  # # 
  # # Description:
  # #   Consolidated risk matrix organizing all risks by
  # #   Probability × Impact.
  # # ====================================================================
  # ──────────────────────────────────────────────────────────────────

  risk_matrix:
    metadata:
      product: "Product Name"
      total_risks: 0
      updated_at: "YYYY-MM-DD"
    
    # ──────────────────────────────────────────────────────────────────
    # MATRIX LEGEND
    # ──────────────────────────────────────────────────────────────────
    # 
    #                    IMPACT
    #               Low    Medium   High
    #            ┌───────┬───────┬───────┐
    #      High  │ MEDIUM│ HIGH  │CRITICAL│
    # P         ├───────┼───────┼───────┤
    # R  Medium  │  LOW  │MEDIUM │  HIGH │
    # O         ├───────┼───────┼───────┤
    # B   Low    │  LOW  │  LOW  │MEDIUM │
    #            └───────┴───────┴───────┘
    # ──────────────────────────────────────────────────────────────────
    
    # Summary by severity
    severity_summary:
      critical: 0  # High probability × High impact
      high: 0  # High × Medium or Medium × High
      medium: 0  # Medium × Medium or High × Low or Low × High
      low: 0  # Low × Low or Low × Medium or Medium × Low
    
    # Risks organized by severity
    critical_risks:
      # High Probability × High Impact
      description: "Risks that require immediate action"
      risks:
        - id: "risk-XXX"
          title: "Risk title"
          category: "technology"  # technology | regulatory | market | operational
          probability: "high"
          impact: "high"
          mitigation_status: "pending"  # pending | in_progress | completed
          responsible: "Name"
    
    high_risks:
      # High Probability × Medium Impact OR Medium Probability × High Impact
      description: "Risks that require a mitigation plan"
      risks:
        - id: "risk-XXX"
          title: "Risk title"
          category: "regulatory"
          probability: "medium"
          impact: "high"
          mitigation_status: "pending"
          responsible: "Name"
    
    medium_risks:
      # Medium Probability × Medium Impact OR High × Low OR Low × High
      description: "Risks that should be monitored"
      risks:
        - id: "risk-XXX"
          title: "Risk title"
          category: "market"
          probability: "medium"
          impact: "medium"
          mitigation_status: "pending"
          responsible: "Name"
    
    low_risks:
      # Low Probability × Low/Medium Impact OR Medium × Low
      description: "Accepted risks or light monitoring"
      risks:
        - id: "risk-XXX"
          title: "Risk title"
          category: "operational"
          probability: "low"
          impact: "low"
          mitigation_status: "accepted"
          responsible: "Name"
    
    # Matrix visualization
    matrix_visualization:
      # Format: [probability][impact] = [list of risk IDs]
      high_high: []  # Critical
      high_medium: []  # High
      high_low: []  # Medium
      medium_high: []  # High
      medium_medium: []  # Medium
      medium_low: []  # Low
      low_high: []  # Medium
      low_medium: []  # Low
      low_low: []  # Low
    
    # Priority actions
    priority_actions:
      - risk_id: "risk-XXX"
        action: "Description of the priority action"
        responsible: "Name"
        deadline: "YYYY-MM-DD"
        status: "pending"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# TEMPLATE 10: VALIDATION PLANS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# File: validation/validation-plans.yml
# Description: Validation plans for identified hypotheses
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

validation_plans_template:
  # ──────────────────────────────────────────────────────────────────
  # FILE HEADER
  # ──────────────────────────────────────────────────────────────────
  # # ====================================================================
  # # Validation Plans - {product}
  # # ====================================================================
  # # Version: 1.0.0
  # # Date: {YYYY-MM-DD}
  # # 
  # # Description:
  # #   Validation plans for identified hypotheses.
  # #   Methods: MVP, Prototype, Research, Technical Spike.
  # # ====================================================================
  # ──────────────────────────────────────────────────────────────────

  validation_plans:
    metadata:
      product: "Product Name"
      total_plans: 0
      updated_at: "YYYY-MM-DD"
    
    # Summary by method
    method_summary:
      mvp: 0  # Minimum Viable Product
      prototype: 0  # Mockup, wireframe
      research: 0  # Interviews, surveys
      spike: 0  # Technical proof of concept
    
    # ──────────────────────────────────────────────────────────────────
    # MVP PLANS (Minimum Viable Product)
    # ──────────────────────────────────────────────────────────────────
    mvp_plans:
      description: |
        MVPs are simplified versions of the product with minimal features
        to validate value hypotheses with real users.
      
      plans:
        - id: "val-mvp-001"
          title: "MVP title"
          validated_hypotheses:
            - id: "hyp-value-001"
              title: "Hypothesis title"
          
          scope:
            included_features:
              - "Feature 1"
              - "Feature 2"
            excluded_features:
              - "Feature 3 (out of MVP scope)"
          
          success_metrics:
            - metric: "Metric name"
              target: "Target value"
              how_to_measure: "How it will be measured"
          
          resources:
            estimated_effort: "2 weeks"
            team:
              - role: "Developer"
                quantity: 1
          
          schedule:
            expected_start: "YYYY-MM-DD"
            expected_end: "YYYY-MM-DD"
          
          status: "planned"  # planned | in_progress | completed | cancelled
    
    # ──────────────────────────────────────────────────────────────────
    # PROTOTYPE PLANS
    # ──────────────────────────────────────────────────────────────────
    prototype_plans:
      description: |
        Prototypes are visual representations (mockups, wireframes) used
        to validate usability hypotheses before implementing.
      
      plans:
        - id: "val-proto-001"
          title: "Prototype title"
          validated_hypotheses:
            - id: "hyp-usab-001"
              title: "Hypothesis title"
          
          prototype_type: "high_fidelity"  # low_fidelity | medium_fidelity | high_fidelity
          tool: "Figma"  # Figma | Sketch | Adobe XD | Paper | etc
          
          included_screens:
            - name: "Screen name"
              description: "Screen description"
          
          usability_test:
            participants: 5
            profile: "Description of participant profile"
            tasks:
              - task: "Task the user must perform"
                success_criteria: "How to determine success"
          
          resources:
            estimated_effort: "3 days"
          
          schedule:
            expected_start: "YYYY-MM-DD"
            expected_end: "YYYY-MM-DD"
          
          status: "planned"
    
    # ──────────────────────────────────────────────────────────────────
    # RESEARCH PLANS
    # ──────────────────────────────────────────────────────────────────
    research_plans:
      description: |
        Research is a data collection method (interviews, surveys) used
        to validate value hypotheses and understand user needs.
      
      plans:
        - id: "val-research-001"
          title: "Research title"
          validated_hypotheses:
            - id: "hyp-value-001"
              title: "Hypothesis title"
          
          research_type: "interview"  # interview | survey | focus_group | observation
          
          participants:
            target_quantity: 10
            profile: "Description of participant profile"
            inclusion_criteria:
              - "Criterion 1"
            exclusion_criteria:
              - "Criterion 1"
          
          script:
            main_questions:
              - "Question 1"
              - "Question 2"
          
          analysis:
            method: "Thematic qualitative analysis"
            success_criteria:
              - criterion: "Description of the criterion"
                threshold: "70% of participants"
          
          resources:
            estimated_effort: "1 week"
          
          schedule:
            expected_start: "YYYY-MM-DD"
            expected_end: "YYYY-MM-DD"
          
          status: "planned"
    
    # ──────────────────────────────────────────────────────────────────
    # TECHNICAL SPIKE PLANS
    # ──────────────────────────────────────────────────────────────────
    spike_plans:
      description: |
        Technical spikes are proofs of concept used to validate feasibility
        hypotheses before committing significant resources.
      
      plans:
        - id: "val-spike-001"
          title: "Spike title"
          validated_hypotheses:
            - id: "hyp-feas-001"
              title: "Hypothesis title"
          
          technical_objective: |
            Clear description of what the spike must prove or discover.
          
          technical_scope:
            technologies_tested:
              - "Technology 1"
              - "Technology 2"
            integration_tested: "Description of the integration"
          
          deliverables:
            - type: "code"  # code | documentation | poc | report
              description: "Description of the deliverable"
          
          success_criteria:
            - criterion: "Description of the technical criterion"
              how_to_validate: "How it will be validated"
          
          resources:
            estimated_effort: "2 days"
            developer: "Name or profile"
          
          schedule:
            expected_start: "YYYY-MM-DD"
            expected_end: "YYYY-MM-DD"
          
          status: "planned"
    
    # ──────────────────────────────────────────────────────────────────
    # CONSOLIDATED SCHEDULE
    # ──────────────────────────────────────────────────────────────────
    validations_schedule:
      - plan_id: "val-XXX-001"
        title: "Title"
        type: "mvp"  # mvp | prototype | research | spike
        start: "YYYY-MM-DD"
        end: "YYYY-MM-DD"
        status: "planned"
        dependencies: []  # IDs of other plans that must be completed first

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# USAGE INSTRUCTIONS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

usage_instructions:
  description: |
    This file contains the templates for the 10 validation and risk files.
    Use each section as a base to create the individual files.
  
  generation_flow:
    step_1:
      description: "Analyze prioritized features (Must Have and Should Have)"
      input: "docs/discovery/04-prioritization.yml"
      action: "Identify features that need validation"
    
    step_2:
      description: "Map hypotheses by type"
      output: "docs/discovery/hypotheses/*.yml"
      action: |
        For each feature, identify:
        - Value hypotheses: Do users want this?
        - Usability hypotheses: Will they be able to use it?
        - Feasibility hypotheses: Is it technically viable?
    
    step_3:
      description: "Classify confidence level"
      action: |
        For each hypothesis:
        - High (>80%): Solid evidence, quantitative data
        - Medium (50-80%): Some evidence, qualitative data
        - Low (<50%): Assumptions, no validation
    
    step_4:
      description: "Map risks by category"
      output: "docs/discovery/risks/*.yml"
      action: |
        Identify risks in each category:
        - Technology: integration, performance, security
        - Regulatory: compliance, LGPD, licenses
        - Market: competition, timing, adoption
        - Operational: resources, skills, infrastructure
    
    step_5:
      description: "Create the risk matrix"
      output: "docs/discovery/risks/risk-matrix.yml"
      action: "Organize risks by Probability × Impact"
    
    step_6:
      description: "Define validation plans"
      output: "docs/discovery/validation/validation-plans.yml"
      action: |
        For each hypothesis with low/medium confidence:
        - MVP: Validate value with real users
        - Prototype: Validate usability
        - Research: Collect qualitative/quantitative data
        - Spike: Validate technical feasibility
    
    step_7:
      description: "Create the general index"
      output: "docs/discovery/05-validation-risks.yml"
      action: "Consolidate a summary of all hypotheses and risks"
  
  validation:
    - "All Must Have features have mapped hypotheses"
    - "Low/medium confidence hypotheses have a validation plan"
    - "Critical risks have defined mitigations"
    - "The risk matrix is complete and up to date"
    - "Validation plans have a realistic schedule"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# EXAMPLE DIRECTORY STRUCTURE
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

directory_structure:
  description: |
    docs/discovery/
    ├── 05-validation-risks.yml          # General index
    ├── hypotheses/
    │   ├── value-hypotheses.yml         # Value hypotheses
    │   ├── usability-hypotheses.yml     # Usability hypotheses
    │   └── feasibility-hypotheses.yml   # Feasibility hypotheses
    ├── risks/
    │   ├── technology-risks.yml         # Technology risks
    │   ├── regulatory-risks.yml         # Regulatory risks
    │   ├── market-risks.yml             # Market risks
    │   ├── operational-risks.yml        # Operational risks
    │   └── risk-matrix.yml              # Risk matrix
    └── validation/
        └── validation-plans.yml         # Validation plans
