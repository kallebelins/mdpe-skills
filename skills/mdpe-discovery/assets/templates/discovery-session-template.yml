# ====================================================================
# MDPE Framework - Discovery Session Template
# ====================================================================
# Versão: 1.0.0
# Status: Draft
# Licença: MIT License
# 
# Descrição:
#   Template para estruturar e documentar uma sessão de Discovery.
#   Discovery é a fase estratégica que define O QUE fazer, gerando
#   como output o Backlog Cognitivo com funcionalidades priorizadas.
#
# Uso:
#   Este template pode ser usado para planejar e executar workshops
#   de Discovery, inspirados em Lean Inception e Design Thinking.
#   Deve ser preenchido antes, durante e depois da sessão.
# ====================================================================

discovery_session:
  # Metadados da sessão
  metadata:
    id: "discovery-session-YYYYMMDD-001"
    versao: "1.0.0"
    data_sessao: "YYYY-MM-DD"
    duracao_horas: 4
    formato: "presencial" # presencial | remoto | hibrido
    facilitador: "Nome do Facilitador"
    produto: "Nome do Produto"
    tipo_discovery: "inicial" # inicial | incremental | exploratorio
  
  # Participantes
  participantes:
    product_owner:
      nome: "Nome do PO"
      email: "po@empresa.com"
      papel: "Decisor de produto"
    
    stakeholders:
      - nome: "Stakeholder 1"
        papel: "Negócio"
        area: "Comercial"
      
      - nome: "Stakeholder 2"
        papel: "Usuário-chave"
        area: "Operações"
    
    time_tecnico:
      - nome: "Arquiteto/Tech Lead"
        papel: "Viabilidade técnica"
      
      - nome: "UX Designer"
        papel: "Experiência do usuário"
    
    convidados_opcionais:
      - nome: "Representante Jurídico"
        papel: "Conformidade regulatória"

  # Agenda da sessão
  agenda:
    - etapa: "Abertura e Alinhamento"
      duracao_minutos: 30
      objetivo: |
        Apresentar o contexto, visão do produto e objetivos da sessão.
        Alinhar expectativas e regras de participação.
      
      atividades:
        - "Apresentação da visão de produto"
        - "Revisão de objetivos estratégicos"
        - "Definição de anti-objetivos"
      
      ferramentas:
        - "Slides de apresentação"
        - "Canvas de Produto"

    - etapa: "Brainstorm de Funcionalidades"
      duracao_minutos: 60
      objetivo: |
        Gerar ideias de funcionalidades sem julgamento.
        Pensar amplamente sobre o que o produto poderia fazer.
      
      atividades:
        - "Brainstorm individual (5 minutos)"
        - "Compartilhamento de ideias (20 minutos)"
        - "Agrupamento por temas (15 minutos)"
        - "Refinamento de funcionalidades (20 minutos)"
      
      ferramentas:
        - "Post-its ou Miro/Mural"
        - "Canvas de Features"
      
      output_esperado: |
        Lista de funcionalidades de alto nível (features) agrupadas por temas.

    - etapa: "Mapeamento de Personas e Jornadas"
      duracao_minutos: 45
      objetivo: |
        Identificar personas principais e mapear suas jornadas críticas.
      
      atividades:
        - "Identificação de personas (15 minutos)"
        - "Mapeamento de necessidades críticas (15 minutos)"
        - "Associação features → personas (15 minutos)"
      
      ferramentas:
        - "Canvas de Personas"
        - "User Journey Map"
      
      output_esperado: |
        Personas definidas com necessidades mapeadas.
        Relação entre features e personas atendidas.

    - etapa: "Priorização de Funcionalidades"
      duracao_minutos: 60
      objetivo: |
        Priorizar features usando MoSCoW e matriz Valor vs Esforço.
      
      atividades:
        - "Classificação MoSCoW (20 minutos)"
        - "Avaliação de Valor de Negócio (20 minutos)"
        - "Estimativa de Esforço (20 minutos)"
        - "Posicionamento na matriz Valor vs Esforço"
      
      ferramentas:
        - "Matriz MoSCoW"
        - "Matriz Valor vs Esforço (2x2)"
        - "Votação por pontos"
      
      output_esperado: |
        Features classificadas como Must/Should/Could/Won't.
        Score de prioridade calculado para cada feature.

    - etapa: "Validação de Hipóteses e Riscos"
      duracao_minutos: 30
      objetivo: |
        Identificar hipóteses não validadas e riscos estratégicos.
      
      atividades:
        - "Identificação de hipóteses críticas"
        - "Documentação de evidências de validação"
        - "Mapeamento de riscos estratégicos"
        - "Definição de estratégias de mitigação"
      
      ferramentas:
        - "Canvas de Hipóteses"
        - "Matriz de Riscos"
      
      output_esperado: |
        Hipóteses documentadas com nível de confiança.
        Riscos estratégicos identificados com mitigações.

    - etapa: "Consolidação e Próximos Passos"
      duracao_minutos: 15
      objetivo: |
        Consolidar o Backlog Cognitivo e definir próximas ações.
      
      atividades:
        - "Revisão de features priorizadas"
        - "Alinhamento de expectativas"
        - "Definição de próximos passos"
      
      output_esperado: |
        Backlog Cognitivo inicial documentado.
        Data da sessão de Transformation Layer agendada.

  # Output da sessão
  outputs:
    backlog_cognitivo:
      arquivo: "backlog-cognitivo-produto-YYYYMMDD.yml"
      status: "rascunho" # rascunho | revisao | aprovado
      features_identificadas: 15
      features_must_have: 5
      features_should_have: 4
      features_could_have: 3
      features_wont_have: 3
    
    personas_identificadas:
      - id: "persona-001"
        nome: "Usuário Operacional"
      
      - id: "persona-002"
        nome: "Gestor de Equipe"
    
    hipoteses_criticas:
      - hipotese: "Usuários precisam de dashboard personalizado"
        validacao: "Entrevistas com 8 usuários confirmaram necessidade"
        confianca: "alta"
      
      - hipotese: "Integração mobile aumentará adoção"
        validacao: "Não validada ainda - requer pesquisa"
        confianca: "baixa"
    
    riscos_identificados:
      - tipo: "tecnologia"
        descricao: "Integração com ERP legado pode ser complexa"
        impacto: "alto"
        probabilidade: "media"
      
      - tipo: "regulatorio"
        descricao: "Conformidade LGPD obrigatória para dados pessoais"
        impacto: "alto"
        probabilidade: "alta"

  # Próximos passos
  proximos_passos:
    validacoes_necessarias:
      - acao: "Validar hipótese de uso mobile com pesquisa"
        responsavel: "UX Designer"
        prazo: "2 semanas"
      
      - acao: "POC de integração com ERP"
        responsavel: "Arquiteto"
        prazo: "1 sprint"
    
    proximo_evento:
      tipo: "Transformation Layer"
      data_prevista: "YYYY-MM-DD"
      responsavel: "Arquiteto/Orchestrator"
      objetivo: |
        Transformar features Must-Have e Should-Have em micro-tarefas 
        executáveis, gerando o Backlog de Micro-Tarefas.

  # Notas e observações
  notas_facilitador:
    - timestamp: "YYYY-MM-DD HH:MM"
      nota: |
        Observação relevante do facilitador durante a sessão.
        Exemplo: "Time muito engajado na priorização."
    
    - timestamp: "YYYY-MM-DD HH:MM"
      nota: |
        Conflito de prioridades resolvido através de votação.

  # Feedback dos participantes
  feedback_participantes:
    - participante: "Nome PO"
      avaliacao: 5 # escala 1-5
      comentario: |
        Sessão muito produtiva. Saímos com clareza das prioridades.
    
    - participante: "Stakeholder 1"
      avaliacao: 4
      comentario: |
        Bom processo. Poderia ter mais tempo para validação de hipóteses.

  # Documentos relacionados
  anexos:
    - tipo: "Canvas de Produto"
      arquivo: "produto-canvas-YYYYMMDD.pdf"
    
    - tipo: "Matriz Valor vs Esforço"
      arquivo: "valor-esforco-matriz-YYYYMMDD.png"
    
    - tipo: "User Journey Map"
      arquivo: "jornada-usuario-YYYYMMDD.pdf"

