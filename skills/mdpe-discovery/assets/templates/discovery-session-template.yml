# ====================================================================
# MDPE Framework - Discovery Session Template
# ====================================================================
# Version: 1.0.0
# Status: Draft
# License: MIT License
# 
# Description:
#   Template for structuring and documenting a Discovery session.
#   Discovery is the strategic phase that defines WHAT to build,
#   producing the Cognitive Backlog with prioritized features as output.
#
# Usage:
#   This template can be used to plan and run Discovery workshops,
#   inspired by Lean Inception and Design Thinking. It should be
#   filled in before, during, and after the session.
# ====================================================================

discovery_session:
  # Session metadata
  metadata:
    id: "discovery-session-YYYYMMDD-001"
    version: "1.0.0"
    session_date: "YYYY-MM-DD"
    duration_hours: 4
    format: "in-person" # in-person | remote | hybrid
    facilitator: "Facilitator Name"
    product: "Product Name"
    discovery_type: "initial" # initial | incremental | exploratory
  
  # Participants
  participants:
    product_owner:
      name: "PO Name"
      email: "po@company.com"
      role: "Product decision maker"
    
    stakeholders:
      - name: "Stakeholder 1"
        role: "Business"
        area: "Sales"
      
      - name: "Stakeholder 2"
        role: "Key user"
        area: "Operations"
    
    technical_team:
      - name: "Architect/Tech Lead"
        role: "Technical feasibility"
      
      - name: "UX Designer"
        role: "User experience"
    
    optional_guests:
      - name: "Legal Representative"
        role: "Regulatory compliance"

  # Session agenda
  agenda:
    - stage: "Opening and Alignment"
      duration_minutes: 30
      objective: |
        Present the context, product vision, and session objectives.
        Align expectations and participation rules.
      
      activities:
        - "Product vision presentation"
        - "Review of strategic objectives"
        - "Definition of anti-objectives"
      
      tools:
        - "Presentation slides"
        - "Product Canvas"

    - stage: "Feature Brainstorm"
      duration_minutes: 60
      objective: |
        Generate feature ideas without judgment.
        Think broadly about what the product could do.
      
      activities:
        - "Individual brainstorm (5 minutes)"
        - "Sharing ideas (20 minutes)"
        - "Grouping by themes (15 minutes)"
        - "Refining features (20 minutes)"
      
      tools:
        - "Sticky notes or Miro/Mural"
        - "Feature Canvas"
      
      expected_output: |
        List of high-level features (features) grouped by themes.

    - stage: "Persona and Journey Mapping"
      duration_minutes: 45
      objective: |
        Identify key personas and map their critical journeys.
      
      activities:
        - "Persona identification (15 minutes)"
        - "Critical needs mapping (15 minutes)"
        - "Feature-to-persona association (15 minutes)"
      
      tools:
        - "Persona Canvas"
        - "User Journey Map"
      
      expected_output: |
        Personas defined with mapped needs.
        Relationship between features and the personas they serve.

    - stage: "Feature Prioritization"
      duration_minutes: 60
      objective: |
        Prioritize features using MoSCoW and the Value vs Effort matrix.
      
      activities:
        - "MoSCoW classification (20 minutes)"
        - "Business value assessment (20 minutes)"
        - "Effort estimation (20 minutes)"
        - "Positioning on the Value vs Effort matrix"
      
      tools:
        - "MoSCoW Matrix"
        - "Value vs Effort Matrix (2x2)"
        - "Dot voting"
      
      expected_output: |
        Features classified as Must/Should/Could/Won't.
        Priority score calculated for each feature.

    - stage: "Hypothesis and Risk Validation"
      duration_minutes: 30
      objective: |
        Identify unvalidated hypotheses and strategic risks.
      
      activities:
        - "Identification of critical hypotheses"
        - "Documentation of validation evidence"
        - "Mapping of strategic risks"
        - "Definition of mitigation strategies"
      
      tools:
        - "Hypothesis Canvas"
        - "Risk Matrix"
      
      expected_output: |
        Hypotheses documented with confidence level.
        Strategic risks identified with mitigations.

    - stage: "Consolidation and Next Steps"
      duration_minutes: 15
      objective: |
        Consolidate the Cognitive Backlog and define next actions.
      
      activities:
        - "Review of prioritized features"
        - "Expectation alignment"
        - "Definition of next steps"
      
      expected_output: |
        Initial Cognitive Backlog documented.
        Transformation Layer session date scheduled.

  # Session output
  outputs:
    cognitive_backlog:
      file: "cognitive-backlog-product-YYYYMMDD.yml"
      status: "draft" # draft | review | approved
      features_identified: 15
      features_must_have: 5
      features_should_have: 4
      features_could_have: 3
      features_wont_have: 3
    
    personas_identified:
      - id: "persona-001"
        name: "Operational User"
      
      - id: "persona-002"
        name: "Team Manager"
    
    critical_hypotheses:
      - hypothesis: "Users need a personalized dashboard"
        validation: "Interviews with 8 users confirmed the need"
        confidence: "high"
      
      - hypothesis: "Mobile integration will increase adoption"
        validation: "Not yet validated - requires research"
        confidence: "low"
    
    identified_risks:
      - type: "technology"
        description: "Integration with legacy ERP may be complex"
        impact: "high"
        probability: "medium"
      
      - type: "regulatory"
        description: "LGPD compliance mandatory for personal data"
        impact: "high"
        probability: "high"

  # Next steps
  next_steps:
    required_validations:
      - action: "Validate mobile usage hypothesis with research"
        responsible: "UX Designer"
        deadline: "2 weeks"
      
      - action: "ERP integration POC"
        responsible: "Architect"
        deadline: "1 sprint"
    
    next_event:
      type: "Transformation Layer"
      expected_date: "YYYY-MM-DD"
      responsible: "Architect/Orchestrator"
      objective: |
        Transform Must-Have and Should-Have features into executable
        micro-tasks, generating the Micro-Task Backlog.

  # Facilitator notes
  facilitator_notes:
    - timestamp: "YYYY-MM-DD HH:MM"
      note: |
        Relevant observation from the facilitator during the session.
        Example: "Team was very engaged during prioritization."
    
    - timestamp: "YYYY-MM-DD HH:MM"
      note: |
        Priority conflict resolved through voting.

  # Participant feedback
  participant_feedback:
    - participant: "PO Name"
      rating: 5 # 1-5 scale
      comment: |
        Very productive session. We left with clarity on priorities.
    
    - participant: "Stakeholder 1"
      rating: 4
      comment: |
        Good process. Could have had more time for hypothesis validation.

  # Related documents
  attachments:
    - type: "Product Canvas"
      file: "product-canvas-YYYYMMDD.pdf"
    
    - type: "Value vs Effort Matrix"
      file: "value-effort-matrix-YYYYMMDD.png"
    
    - type: "User Journey Map"
      file: "user-journey-YYYYMMDD.pdf"
