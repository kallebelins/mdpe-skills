          criticidade: "medio"
        
        # Mitigação
        mitigacao:
          estrategia: "mitigar"
          descricao: |
            Descrição da estratégia de mitigação.
          
          acoes:
            - acao: "Ação específica"
              responsavel: "Nome"
              prazo: "YYYY-MM-DD"
              status: "pendente"
        
        # Status
        status: "identificado"
        responsavel: "Nome do responsável"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# TEMPLATE 8: RISCOS OPERACIONAIS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Arquivo: riscos/riscos-operacionais.yml
# Descrição: Riscos relacionados a recursos, habilidades e infraestrutura.
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

riscos_operacionais_template:
  # ──────────────────────────────────────────────────────────────────
  # CABEÇALHO DO ARQUIVO
  # ──────────────────────────────────────────────────────────────────
  # # ====================================================================
  # # Riscos Operacionais - {produto}
  # # ====================================================================
  # # Versão: 1.0.0
  # # Data: {YYYY-MM-DD}
  # # 
  # # Descrição:
  # #   Riscos relacionados a recursos, habilidades e infraestrutura.
  # # ====================================================================
  # ──────────────────────────────────────────────────────────────────

  riscos_operacionais:
    metadata:
      produto: "Nome do Produto"
      categoria: "operacional"
      total_riscos: 0
      data_atualizacao: "YYYY-MM-DD"
    
    riscos:
      - id: "risk-ops-001"
        titulo: "Título descritivo do risco"
        descricao: |
          Descrição completa do risco operacional.
          O que pode falhar na operação do time/empresa?
        
        # Subcategoria
        subcategoria: "recursos"  # recursos | habilidades | infraestrutura | processos | dependencias
        
        # Features afetadas
        features_afetadas:
          - id: "feat-XXX"
            nome: "Nome da feature"
        
        # Recursos envolvidos
        recursos_envolvidos:
          pessoas:
            - papel: "Nome do papel"
              disponibilidade: "parcial"  # total | parcial | incerta
              criticidade: "alta"  # baixa | media | alta
          
          infraestrutura:
            - recurso: "Nome do recurso"
              status: "disponivel"  # disponivel | em_aquisicao | incerto
          
          ferramentas:
            - ferramenta: "Nome da ferramenta"
              licenca: "ativa"  # ativa | expirando | inexistente
        
        # Avaliação do risco
        avaliacao:
          probabilidade: "media"
          impacto: "medio"
          impacto_operacional: |
            Descrição do impacto nas operações.
          
          criticidade: "medio"
        
        # Mitigação
        mitigacao:
          estrategia: "mitigar"
          descricao: |
            Descrição da estratégia de mitigação.
          
          acoes:
            - acao: "Ação específica"
              responsavel: "Nome"
              prazo: "YYYY-MM-DD"
              status: "pendente"
        
        # Status
        status: "identificado"
        responsavel: "Nome do responsável"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# TEMPLATE 9: MATRIZ DE RISCOS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Arquivo: riscos/matriz-riscos.yml
# Descrição: Matriz de riscos consolidada (Probabilidade × Impacto)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

matriz_riscos_template:
  # ──────────────────────────────────────────────────────────────────
  # CABEÇALHO DO ARQUIVO
  # ──────────────────────────────────────────────────────────────────
  # # ====================================================================
  # # Matriz de Riscos - {produto}
  # # ====================================================================
  # # Versão: 1.0.0
  # # Data: {YYYY-MM-DD}
  # # 
  # # Descrição:
  # #   Matriz de riscos consolidada organizando todos os riscos
  # #   por Probabilidade × Impacto.
  # # ====================================================================
  # ──────────────────────────────────────────────────────────────────

  matriz_riscos:
    metadata:
      produto: "Nome do Produto"
      total_riscos: 0
      data_atualizacao: "YYYY-MM-DD"
    
    # ──────────────────────────────────────────────────────────────────
    # LEGENDA DA MATRIZ
    # ──────────────────────────────────────────────────────────────────
    # 
    #                    IMPACTO
    #              Baixo   Médio   Alto
    #            ┌───────┬───────┬───────┐
    #      Alta  │ MÉDIO │ ALTO  │CRÍTICO│
    # P         ├───────┼───────┼───────┤
    # R   Média │ BAIXO │ MÉDIO │ ALTO  │
    # O         ├───────┼───────┼───────┤
    # B   Baixa │ BAIXO │ BAIXO │ MÉDIO │
    #            └───────┴───────┴───────┘
    # ──────────────────────────────────────────────────────────────────
    
    # Resumo por criticidade
    resumo_criticidade:
      criticos: 0  # Alta probabilidade × Alto impacto
      altos: 0  # Alta × Médio ou Média × Alto
      medios: 0  # Média × Médio ou Alta × Baixo ou Baixa × Alto
      baixos: 0  # Baixa × Baixo ou Baixa × Médio ou Média × Baixo
    
    # Riscos organizados por criticidade
    riscos_criticos:
      # Probabilidade Alta × Impacto Alto
      descricao: "Riscos que requerem ação imediata"
      riscos:
        - id: "risk-XXX"
          titulo: "Título do risco"
          categoria: "tecnologico"  # tecnologico | regulatorio | mercado | operacional
          probabilidade: "alta"
          impacto: "alto"
          mitigacao_status: "pendente"  # pendente | em_andamento | concluida
          responsavel: "Nome"
    
    riscos_altos:
      # Probabilidade Alta × Impacto Médio OU Probabilidade Média × Impacto Alto
      descricao: "Riscos que requerem plano de mitigação"
      riscos:
        - id: "risk-XXX"
          titulo: "Título do risco"
          categoria: "regulatorio"
          probabilidade: "media"
          impacto: "alto"
          mitigacao_status: "pendente"
          responsavel: "Nome"
    
    riscos_medios:
      # Probabilidade Média × Impacto Médio OU Alta × Baixo OU Baixa × Alto
      descricao: "Riscos que devem ser monitorados"
      riscos:
        - id: "risk-XXX"
          titulo: "Título do risco"
          categoria: "mercado"
          probabilidade: "media"
          impacto: "medio"
          mitigacao_status: "pendente"
          responsavel: "Nome"
    
    riscos_baixos:
      # Probabilidade Baixa × Impacto Baixo/Médio OU Média × Baixo
      descricao: "Riscos aceitos ou com monitoramento leve"
      riscos:
        - id: "risk-XXX"
          titulo: "Título do risco"
          categoria: "operacional"
          probabilidade: "baixa"
          impacto: "baixo"
          mitigacao_status: "aceito"
          responsavel: "Nome"
    
    # Visualização da matriz
    visualizacao_matriz:
      # Formato: [probabilidade][impacto] = [lista de IDs de riscos]
      alta_alto: []  # Críticos
      alta_medio: []  # Altos
      alta_baixo: []  # Médios
      media_alto: []  # Altos
      media_medio: []  # Médios
      media_baixo: []  # Baixos
      baixa_alto: []  # Médios
      baixa_medio: []  # Baixos
      baixa_baixo: []  # Baixos
    
    # Ações prioritárias
    acoes_prioritarias:
      - risco_id: "risk-XXX"
        acao: "Descrição da ação prioritária"
        responsavel: "Nome"
        prazo: "YYYY-MM-DD"
        status: "pendente"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# TEMPLATE 10: PLANOS DE VALIDAÇÃO
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Arquivo: validacao/planos-validacao.yml
# Descrição: Planos de validação para hipóteses identificadas
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

planos_validacao_template:
  # ──────────────────────────────────────────────────────────────────
  # CABEÇALHO DO ARQUIVO
  # ──────────────────────────────────────────────────────────────────
  # # ====================================================================
  # # Planos de Validação - {produto}
  # # ====================================================================
  # # Versão: 1.0.0
  # # Data: {YYYY-MM-DD}
  # # 
  # # Descrição:
  # #   Planos de validação para hipóteses identificadas.
  # #   Métodos: MVP, Protótipo, Pesquisa, Spike Técnico.
  # # ====================================================================
  # ──────────────────────────────────────────────────────────────────

  planos_validacao:
    metadata:
      produto: "Nome do Produto"
      total_planos: 0
      data_atualizacao: "YYYY-MM-DD"
    
    # Resumo por método
    resumo_metodos:
      mvp: 0  # Produto Mínimo Viável
      prototipo: 0  # Mockup, wireframe
      pesquisa: 0  # Entrevistas, surveys
      spike: 0  # Prova de conceito técnica
    
    # ──────────────────────────────────────────────────────────────────
    # PLANOS DE MVP (Produto Mínimo Viável)
    # ──────────────────────────────────────────────────────────────────
    planos_mvp:
      descricao: |
        MVPs são versões simplificadas do produto com funcionalidades mínimas
        para validar hipóteses de valor com usuários reais.
      
      planos:
        - id: "val-mvp-001"
          titulo: "Título do MVP"
          hipoteses_validadas:
            - id: "hip-valor-001"
              titulo: "Título da hipótese"
          
          escopo:
            funcionalidades_incluidas:
              - "Funcionalidade 1"
              - "Funcionalidade 2"
            funcionalidades_excluidas:
              - "Funcionalidade 3 (fora do escopo MVP)"
          
          metricas_sucesso:
            - metrica: "Nome da métrica"
              target: "Valor alvo"
              como_medir: "Como será medido"
          
          recursos:
            esforco_estimado: "2 semanas"
            equipe:
              - papel: "Desenvolvedor"
                quantidade: 1
          
          cronograma:
            inicio_previsto: "YYYY-MM-DD"
            fim_previsto: "YYYY-MM-DD"
          
          status: "planejado"  # planejado | em_andamento | concluido | cancelado
    
    # ──────────────────────────────────────────────────────────────────
    # PLANOS DE PROTÓTIPO
    # ──────────────────────────────────────────────────────────────────
    planos_prototipo:
      descricao: |
        Protótipos são representações visuais (mockups, wireframes) para
        validar hipóteses de usabilidade antes de implementar.
      
      planos:
        - id: "val-proto-001"
          titulo: "Título do protótipo"
          hipoteses_validadas:
            - id: "hip-usab-001"
              titulo: "Título da hipótese"
          
          tipo_prototipo: "alta_fidelidade"  # baixa_fidelidade | media_fidelidade | alta_fidelidade
          ferramenta: "Figma"  # Figma | Sketch | Adobe XD | Papel | etc
          
          telas_incluidas:
            - nome: "Nome da tela"
              descricao: "Descrição da tela"
          
          teste_usabilidade:
            participantes: 5
            perfil: "Descrição do perfil dos participantes"
            tarefas:
              - tarefa: "Tarefa que o usuário deve realizar"
                criterio_sucesso: "Como determinar sucesso"
          
          recursos:
            esforco_estimado: "3 dias"
          
          cronograma:
            inicio_previsto: "YYYY-MM-DD"
            fim_previsto: "YYYY-MM-DD"
          
          status: "planejado"
    
    # ──────────────────────────────────────────────────────────────────
    # PLANOS DE PESQUISA
    # ──────────────────────────────────────────────────────────────────
    planos_pesquisa:
      descricao: |
        Pesquisas são métodos de coleta de dados (entrevistas, surveys)
        para validar hipóteses de valor e entender necessidades dos usuários.
      
      planos:
        - id: "val-pesq-001"
          titulo: "Título da pesquisa"
          hipoteses_validadas:
            - id: "hip-valor-001"
              titulo: "Título da hipótese"
          
          tipo_pesquisa: "entrevista"  # entrevista | survey | grupo_focal | observacao
          
          participantes:
            quantidade_alvo: 10
            perfil: "Descrição do perfil dos participantes"
            criterios_inclusao:
              - "Critério 1"
            criterios_exclusao:
              - "Critério 1"
          
          roteiro:
            perguntas_principais:
              - "Pergunta 1"
              - "Pergunta 2"
          
          analise:
            metodo: "Análise qualitativa temática"
            criterios_sucesso:
              - criterio: "Descrição do critério"
                threshold: "70% dos participantes"
          
          recursos:
            esforco_estimado: "1 semana"
          
          cronograma:
            inicio_previsto: "YYYY-MM-DD"
            fim_previsto: "YYYY-MM-DD"
          
          status: "planejado"
    
    # ──────────────────────────────────────────────────────────────────
    # PLANOS DE SPIKE TÉCNICO
    # ──────────────────────────────────────────────────────────────────
    planos_spike:
      descricao: |
        Spikes técnicos são provas de conceito para validar hipóteses de
        viabilidade técnica antes de comprometer recursos significativos.
      
      planos:
        - id: "val-spike-001"
          titulo: "Título do spike"
          hipoteses_validadas:
            - id: "hip-viab-001"
              titulo: "Título da hipótese"
          
          objetivo_tecnico: |
            Descrição clara do que o spike deve provar ou descobrir.
          
          escopo_tecnico:
            tecnologias_testadas:
              - "Tecnologia 1"
              - "Tecnologia 2"
            integracao_testada: "Descrição da integração"
          
          entregaveis:
            - tipo: "codigo"  # codigo | documentacao | poc | relatorio
              descricao: "Descrição do entregável"
          
          criterios_sucesso:
            - criterio: "Descrição do critério técnico"
              como_validar: "Como será validado"
          
          recursos:
            esforco_estimado: "2 dias"
            desenvolvedor: "Nome ou perfil"
          
          cronograma:
            inicio_previsto: "YYYY-MM-DD"
            fim_previsto: "YYYY-MM-DD"
          
          status: "planejado"
    
    # ──────────────────────────────────────────────────────────────────
    # CRONOGRAMA CONSOLIDADO
    # ──────────────────────────────────────────────────────────────────
    cronograma_validacoes:
      - plano_id: "val-XXX-001"
        titulo: "Título"
        tipo: "mvp"  # mvp | prototipo | pesquisa | spike
        inicio: "YYYY-MM-DD"
        fim: "YYYY-MM-DD"
        status: "planejado"
        dependencias: []  # IDs de outros planos que devem ser concluídos antes

