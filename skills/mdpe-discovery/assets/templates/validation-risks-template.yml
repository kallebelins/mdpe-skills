# INSTRUÇÕES DE USO
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

instrucoes_uso:
  descricao: |
    Este arquivo contém os templates para os 10 arquivos de validação e riscos.
    Use cada seção como base para criar os arquivos individuais.
  
  fluxo_geracao:
    passo_1:
      descricao: "Analisar features priorizadas (Must Have e Should Have)"
      entrada: "docs/discovery/04-priorizacao.yml"
      acao: "Identificar features que precisam de validação"
    
    passo_2:
      descricao: "Mapear hipóteses por tipo"
      saida: "docs/discovery/hipoteses/*.yml"
      acao: |
        Para cada feature, identificar:
        - Hipóteses de Valor: Usuários querem isso?
        - Hipóteses de Usabilidade: Conseguirão usar?
        - Hipóteses de Viabilidade: É tecnicamente viável?
    
    passo_3:
      descricao: "Classificar nível de confiança"
      acao: |
        Para cada hipótese:
        - Alta (>80%): Evidências sólidas, dados quantitativos
        - Média (50-80%): Algumas evidências, dados qualitativos
        - Baixa (<50%): Suposições, sem validação
    
    passo_4:
      descricao: "Mapear riscos por categoria"
      saida: "docs/discovery/riscos/*.yml"
      acao: |
        Identificar riscos em cada categoria:
        - Tecnológicos: integração, performance, segurança
        - Regulatórios: compliance, LGPD, licenças
        - Mercado: concorrência, timing, adoção
        - Operacionais: recursos, habilidades, infraestrutura
    
    passo_5:
      descricao: "Criar matriz de riscos"
      saida: "docs/discovery/riscos/matriz-riscos.yml"
      acao: "Organizar riscos por Probabilidade × Impacto"
    
    passo_6:
      descricao: "Definir planos de validação"
      saida: "docs/discovery/validacao/planos-validacao.yml"
      acao: |
        Para cada hipótese com baixa/média confiança:
        - MVP: Validar valor com usuários reais
        - Protótipo: Validar usabilidade
        - Pesquisa: Coletar dados qualitativos/quantitativos
        - Spike: Validar viabilidade técnica
    
    passo_7:
      descricao: "Criar índice geral"
      saida: "docs/discovery/05-validacao-riscos.yml"
      acao: "Consolidar resumo de todas as hipóteses e riscos"
  
  validacao:
    - "Todas as features Must Have têm hipóteses mapeadas"
    - "Hipóteses com baixa confiança têm plano de validação"
    - "Riscos críticos têm mitigação definida"
    - "Matriz de riscos está completa e atualizada"
    - "Planos de validação têm cronograma realista"

