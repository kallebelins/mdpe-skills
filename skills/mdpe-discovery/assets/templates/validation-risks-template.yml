  # #   Riscos relacionados a concorrência, timing e adoção do mercado.
  # # ====================================================================
  # ──────────────────────────────────────────────────────────────────

  riscos_mercado:
    metadata:
      produto: "Nome do Produto"
      categoria: "mercado"
      total_riscos: 0
      data_atualizacao: "YYYY-MM-DD"
    
    riscos:
      - id: "risk-mkt-001"
        titulo: "Título descritivo do risco"
        descricao: |
          Descrição completa do risco de mercado.
          O que pode mudar no mercado que afetaria o produto?
        
        # Subcategoria
        subcategoria: "concorrencia"  # concorrencia | timing | adocao | economia | tendencias
        
        # Features afetadas
        features_afetadas:
          - id: "feat-XXX"
            nome: "Nome da feature"
        
        # Análise de mercado
        analise_mercado:
          concorrentes_afetados: ["Concorrente 1", "Concorrente 2"]
          tendencia_mercado: "Descrição da tendência"
          janela_oportunidade: "Descrição da janela de oportunidade"
        
        # Avaliação do risco
        avaliacao:
          probabilidade: "media"
          impacto: "medio"
          impacto_negocio: |
