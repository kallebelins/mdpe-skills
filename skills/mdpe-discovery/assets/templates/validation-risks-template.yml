# ====================================================================
# MDPE Framework - Templates de Validação de Hipóteses e Riscos
# ====================================================================
# Versão: 1.0.0
# Propósito: Templates para validação de hipóteses e mapeamento de riscos
# Fase: Discovery & Backlog Cognitivo (Estratégico)
# ====================================================================
#
# Este arquivo contém os templates para os 10 arquivos de saída:
#
# ÍNDICE GERAL:
# 1. 05-validacao-riscos.yml - Índice geral consolidado
#
# HIPÓTESES (docs/discovery/hipoteses/):
# 2. hipoteses-valor.yml - Hipóteses de valor
# 3. hipoteses-usabilidade.yml - Hipóteses de usabilidade
# 4. hipoteses-viabilidade.yml - Hipóteses de viabilidade
#
# RISCOS (docs/discovery/riscos/):
# 5. riscos-tecnologicos.yml - Riscos tecnológicos
# 6. riscos-regulatorios.yml - Riscos regulatórios
# 7. riscos-mercado.yml - Riscos de mercado
# 8. riscos-operacionais.yml - Riscos operacionais
# 9. matriz-riscos.yml - Matriz de riscos (Probabilidade × Impacto)
#
# VALIDAÇÃO (docs/discovery/validacao/):
# 10. planos-validacao.yml - Planos de validação
#
# Localização dos arquivos gerados:
#   docs/discovery/
#   ├── 05-validacao-riscos.yml
#   ├── hipoteses/
#   │   ├── hipoteses-valor.yml
#   │   ├── hipoteses-usabilidade.yml
#   │   └── hipoteses-viabilidade.yml
#   ├── riscos/
#   │   ├── riscos-tecnologicos.yml
#   │   ├── riscos-regulatorios.yml
#   │   ├── riscos-mercado.yml
#   │   ├── riscos-operacionais.yml
#   │   └── matriz-riscos.yml
#   └── validacao/
#       └── planos-validacao.yml
# ====================================================================

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# TEMPLATE 1: ÍNDICE GERAL DE VALIDAÇÃO E RISCOS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Arquivo: 05-validacao-riscos.yml
# Descrição: Índice geral consolidando todas as hipóteses e riscos
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

indice_validacao_riscos_template:
  # ──────────────────────────────────────────────────────────────────
  # CABEÇALHO DO ARQUIVO
  # ──────────────────────────────────────────────────────────────────
  # # ====================================================================
  # # Validação de Hipóteses e Riscos - {produto}
  # # ====================================================================
  # # Versão: 1.0.0
  # # Data: {YYYY-MM-DD}
  # # 
  # # Descrição:
  # #   Índice geral de hipóteses não validadas e riscos identificados
  # #   para o produto/projeto.
  # # ====================================================================
  # ──────────────────────────────────────────────────────────────────

  validacao_riscos:
    metadata:
      produto: "Nome do Produto"
      versao: "1.0.0"
      data_criacao: "YYYY-MM-DD"
      data_atualizacao: "YYYY-MM-DD"
      responsavel: "Nome do Responsável"
    
    # ──────────────────────────────────────────────────────────────────
    # RESUMO EXECUTIVO
    # ──────────────────────────────────────────────────────────────────
    resumo:
      total_hipoteses: 0
      total_riscos: 0
      
      hipoteses_por_tipo:
        valor: 0
        usabilidade: 0
        viabilidade: 0
      
      hipoteses_por_confianca:
        alta: 0  # >80%
        media: 0  # 50-80%
        baixa: 0  # <50%
      
      riscos_por_categoria:
        tecnologicos: 0
        regulatorios: 0
        mercado: 0
        operacionais: 0
      
      riscos_por_criticidade:
        criticos: 0  # Alta probabilidade × Alto impacto
        altos: 0  # Alta/Média ou Média/Alta
        medios: 0  # Média/Média
        baixos: 0  # Baixa/*
      
      planos_validacao:
        mvp: 0
        prototipo: 0
        pesquisa: 0
        spike: 0
    
    # ──────────────────────────────────────────────────────────────────
    # ARQUIVOS RELACIONADOS
    # ──────────────────────────────────────────────────────────────────
    arquivos:
      hipoteses:
        - arquivo: "hipoteses/hipoteses-valor.yml"
          descricao: "Hipóteses de valor (usuários querem?)"
        - arquivo: "hipoteses/hipoteses-usabilidade.yml"
          descricao: "Hipóteses de usabilidade (conseguirão usar?)"
        - arquivo: "hipoteses/hipoteses-viabilidade.yml"
          descricao: "Hipóteses de viabilidade (é tecnicamente viável?)"
      
      riscos:
        - arquivo: "riscos/riscos-tecnologicos.yml"
          descricao: "Riscos de tecnologia (integração, performance, segurança)"
        - arquivo: "riscos/riscos-regulatorios.yml"
          descricao: "Riscos regulatórios (compliance, LGPD, licenças)"
        - arquivo: "riscos/riscos-mercado.yml"
          descricao: "Riscos de mercado (concorrência, timing, adoção)"
        - arquivo: "riscos/riscos-operacionais.yml"
          descricao: "Riscos operacionais (recursos, habilidades, infraestrutura)"
        - arquivo: "riscos/matriz-riscos.yml"
          descricao: "Matriz de riscos (Probabilidade × Impacto)"
      
      validacao:
        - arquivo: "validacao/planos-validacao.yml"
          descricao: "Planos de validação (MVP, protótipo, pesquisa, spike)"
    
    # ──────────────────────────────────────────────────────────────────
    # HIPÓTESES CRÍTICAS (Resumo)
    # ──────────────────────────────────────────────────────────────────
    hipoteses_criticas:
      - id: "hip-XXX"
        tipo: "valor"  # valor | usabilidade | viabilidade
        descricao: "Descrição da hipótese crítica"
        confianca: "baixa"  # alta | media | baixa
        features_afetadas: ["feat-001", "feat-002"]
        plano_validacao: "tipo_de_validacao"  # mvp | prototipo | pesquisa | spike
    
    # ──────────────────────────────────────────────────────────────────
    # RISCOS CRÍTICOS (Resumo)
    # ──────────────────────────────────────────────────────────────────
    riscos_criticos:
      - id: "risk-XXX"
        categoria: "tecnologico"  # tecnologico | regulatorio | mercado | operacional
        descricao: "Descrição do risco crítico"
        probabilidade: "alta"  # baixa | media | alta
        impacto: "alto"  # baixo | medio | alto
        features_afetadas: ["feat-001", "feat-002"]
        mitigacao_resumo: "Resumo da estratégia de mitigação"
    
    # ──────────────────────────────────────────────────────────────────
    # PRÓXIMOS PASSOS
    # ──────────────────────────────────────────────────────────────────
    proximos_passos:
      - acao: "Descrição da ação prioritária"
        responsavel: "Nome do responsável"
        prazo: "YYYY-MM-DD"
        status: "pendente"  # pendente | em_andamento | concluido

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# TEMPLATE 2: HIPÓTESES DE VALOR
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Arquivo: hipoteses/hipoteses-valor.yml
# Descrição: Hipóteses sobre se os usuários realmente querem/precisam
#            das funcionalidades propostas.
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

hipoteses_valor_template:
  # ──────────────────────────────────────────────────────────────────
  # CABEÇALHO DO ARQUIVO
  # ──────────────────────────────────────────────────────────────────
  # # ====================================================================
  # # Hipóteses de Valor - {produto}
  # # ====================================================================
  # # Versão: 1.0.0
  # # Data: {YYYY-MM-DD}
  # # 
  # # Descrição:
  # #   Hipóteses sobre se os usuários realmente querem/precisam
  # #   das funcionalidades propostas. Responde à pergunta: "Usuários querem isso?"
  # # ====================================================================
  # ──────────────────────────────────────────────────────────────────

  hipoteses_valor:
    metadata:
      produto: "Nome do Produto"
      tipo: "valor"
      total_hipoteses: 0
      data_atualizacao: "YYYY-MM-DD"
    
    hipoteses:
      - id: "hip-valor-001"
        titulo: "Título descritivo da hipótese"
        descricao: |
          Descrição completa da hipótese.
          O que estamos assumindo sobre o valor para o usuário?
        
        # Feature(s) relacionada(s)
        features_relacionadas:
          - id: "feat-XXX"
            nome: "Nome da feature"
            prioridade: "must-have"  # must-have | should-have | could-have | wont-have
        
        # Personas afetadas
        personas_afetadas:
          - nome: "Nome da Persona"
            impacto: "alto"  # baixo | medio | alto
        
        # Nível de confiança
        confianca:
          nivel: "media"  # alta (>80%) | media (50-80%) | baixa (<50%)
          percentual_estimado: 65
          justificativa: |
            Explicação de por que temos este nível de confiança.
            Quais evidências temos? Quais incertezas existem?
        
        # Evidências existentes
        evidencias:
          - tipo: "quantitativa"  # quantitativa | qualitativa | analogica | suposicao
            descricao: "Descrição da evidência"
            fonte: "Fonte da evidência"
            data: "YYYY-MM-DD"
          
          - tipo: "qualitativa"
            descricao: "Descrição da evidência"
            fonte: "Entrevistas com usuários"
            data: "YYYY-MM-DD"
        
        # Plano de validação
        validacao:
          metodo: "pesquisa"  # mvp | prototipo | pesquisa | spike
          descricao: |
            Descrição de como validaremos esta hipótese.
          
          criterio_sucesso: |
            Critério objetivo que indica se a hipótese foi validada.
            Ex: "70% dos usuários demonstram interesse na funcionalidade"
          
          prazo_estimado: "2 semanas"
          recursos_necessarios:
            - "Descrição do recurso necessário"
        
        # Status
        status: "nao_validada"  # nao_validada | em_validacao | validada | invalidada
        
        # Impacto se invalidada
        impacto_invalidacao: |
          O que acontece se descobrirmos que esta hipótese é falsa?
          Quais decisões serão afetadas?

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# TEMPLATE 3: HIPÓTESES DE USABILIDADE
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Arquivo: hipoteses/hipoteses-usabilidade.yml
# Descrição: Hipóteses sobre se os usuários conseguirão usar as
#            funcionalidades de forma efetiva.
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

hipoteses_usabilidade_template:
  # ──────────────────────────────────────────────────────────────────
  # CABEÇALHO DO ARQUIVO
  # ──────────────────────────────────────────────────────────────────
  # # ====================================================================
  # # Hipóteses de Usabilidade - {produto}
  # # ====================================================================
  # # Versão: 1.0.0
  # # Data: {YYYY-MM-DD}
  # # 
  # # Descrição:
  # #   Hipóteses sobre se os usuários conseguirão usar as funcionalidades
  # #   de forma efetiva. Responde à pergunta: "Usuários conseguirão usar?"
  # # ====================================================================
  # ──────────────────────────────────────────────────────────────────

  hipoteses_usabilidade:
    metadata:
      produto: "Nome do Produto"
      tipo: "usabilidade"
      total_hipoteses: 0
      data_atualizacao: "YYYY-MM-DD"
    
    hipoteses:
      - id: "hip-usab-001"
        titulo: "Título descritivo da hipótese"
        descricao: |
          Descrição completa da hipótese.
          O que estamos assumindo sobre a capacidade de uso?
        
        # Feature(s) relacionada(s)
        features_relacionadas:
          - id: "feat-XXX"
            nome: "Nome da feature"
        
        # Aspectos de usabilidade
        aspectos:
          - tipo: "aprendizado"  # aprendizado | eficiencia | memorabilidade | erros | satisfacao
            descricao: "Descrição do aspecto de usabilidade"
        
        # Personas afetadas
        personas_afetadas:
          - nome: "Nome da Persona"
            nivel_tecnico: "baixo"  # baixo | medio | alto
            contexto_uso: "Contexto em que a persona usará"
        
        # Nível de confiança
        confianca:
          nivel: "media"  # alta (>80%) | media (50-80%) | baixa (<50%)
          percentual_estimado: 50
          justificativa: |
            Explicação de por que temos este nível de confiança.
        
        # Evidências existentes
        evidencias:
          - tipo: "qualitativa"
            descricao: "Descrição da evidência"
            fonte: "Fonte da evidência"
        
        # Plano de validação
        validacao:
          metodo: "prototipo"  # mvp | prototipo | pesquisa | spike
          descricao: |
            Descrição de como validaremos esta hipótese.
            Ex: "Teste de usabilidade com 5 usuários usando protótipo"
          
          criterio_sucesso: |
            Critério objetivo que indica se a hipótese foi validada.
            Ex: "80% dos usuários completam a tarefa em menos de 3 minutos"
          
          metricas:
            - nome: "Taxa de conclusão"
              target: ">= 80%"
            - nome: "Tempo médio de tarefa"
              target: "< 3 minutos"
            - nome: "Número de erros"
              target: "< 2 por tarefa"
        
        # Status
        status: "nao_validada"
        
        # Impacto se invalidada
        impacto_invalidacao: |
          O que acontece se descobrirmos que esta hipótese é falsa?

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# TEMPLATE 4: HIPÓTESES DE VIABILIDADE
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Arquivo: hipoteses/hipoteses-viabilidade.yml
# Descrição: Hipóteses sobre se é tecnicamente viável implementar
#            as funcionalidades propostas.
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

hipoteses_viabilidade_template:
  # ──────────────────────────────────────────────────────────────────
  # CABEÇALHO DO ARQUIVO
  # ──────────────────────────────────────────────────────────────────
  # # ====================================================================
  # # Hipóteses de Viabilidade - {produto}
  # # ====================================================================
  # # Versão: 1.0.0
  # # Data: {YYYY-MM-DD}
  # # 
  # # Descrição:
  # #   Hipóteses sobre se é tecnicamente viável implementar as
  # #   funcionalidades propostas. Responde à pergunta: "É tecnicamente viável?"
  # # ====================================================================
  # ──────────────────────────────────────────────────────────────────

  hipoteses_viabilidade:
    metadata:
      produto: "Nome do Produto"
      tipo: "viabilidade"
      total_hipoteses: 0
      data_atualizacao: "YYYY-MM-DD"
    
    hipoteses:
      - id: "hip-viab-001"
        titulo: "Título descritivo da hipótese"
        descricao: |
          Descrição completa da hipótese.
          O que estamos assumindo sobre a viabilidade técnica?
        
        # Feature(s) relacionada(s)
        features_relacionadas:
          - id: "feat-XXX"
            nome: "Nome da feature"
        
        # Aspectos técnicos
        aspectos_tecnicos:
          - tipo: "integracao"  # integracao | performance | seguranca | escalabilidade | custo
            descricao: "Descrição do aspecto técnico"
            tecnologias_envolvidas: ["Tecnologia 1", "Tecnologia 2"]
        
        # Dependências técnicas
        dependencias:
          - tipo: "api"  # api | servico | biblioteca | infraestrutura
            nome: "Nome da dependência"
            status: "disponivel"  # disponivel | em_desenvolvimento | incerto
            risco: "baixo"  # baixo | medio | alto
        
        # Nível de confiança
        confianca:
          nivel: "baixa"  # alta (>80%) | media (50-80%) | baixa (<50%)
          percentual_estimado: 40
          justificativa: |
            Explicação de por que temos este nível de confiança.
            Ex: "Nunca trabalhamos com esta API antes"
        
        # Evidências existentes
        evidencias:
          - tipo: "analogica"
            descricao: "Projeto similar já foi implementado em outro contexto"
            fonte: "Documentação interna"
        
        # Plano de validação
        validacao:
          metodo: "spike"  # mvp | prototipo | pesquisa | spike
          descricao: |
            Descrição de como validaremos esta hipótese.
            Ex: "Spike técnico de 2 dias para testar integração com API"
          
          criterio_sucesso: |
            Critério objetivo que indica se a hipótese foi validada.
            Ex: "Conseguir fazer chamada à API e processar resposta em < 500ms"
          
          esforco_spike: "2 dias"
          recursos_necessarios:
            - "Desenvolvedor sênior"
            - "Acesso à API de sandbox"
        
        # Status
        status: "nao_validada"
        
        # Impacto se invalidada
        impacto_invalidacao: |
          O que acontece se descobrirmos que esta hipótese é falsa?
          Quais alternativas existem?
        
        # Alternativas técnicas
        alternativas:
          - descricao: "Alternativa técnica se a hipótese for invalidada"
            viabilidade: "media"  # baixa | media | alta
            custo_adicional: "Descrição do custo adicional"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# TEMPLATE 5: RISCOS TECNOLÓGICOS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Arquivo: riscos/riscos-tecnologicos.yml
# Descrição: Riscos relacionados a tecnologia, integração, performance
#            e segurança.
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

riscos_tecnologicos_template:
  # ──────────────────────────────────────────────────────────────────
  # CABEÇALHO DO ARQUIVO
  # ──────────────────────────────────────────────────────────────────
  # # ====================================================================
  # # Riscos Tecnológicos - {produto}
  # # ====================================================================
  # # Versão: 1.0.0
  # # Data: {YYYY-MM-DD}
  # # 
  # # Descrição:
  # #   Riscos relacionados a tecnologia, integração, performance e segurança.
  # # ====================================================================
  # ──────────────────────────────────────────────────────────────────

  riscos_tecnologicos:
    metadata:
      produto: "Nome do Produto"
      categoria: "tecnologico"
      total_riscos: 0
      data_atualizacao: "YYYY-MM-DD"
    
    riscos:
      - id: "risk-tec-001"
        titulo: "Título descritivo do risco"
        descricao: |
          Descrição completa do risco tecnológico.
          O que pode dar errado tecnicamente?
        
        # Subcategoria
        subcategoria: "integracao"  # integracao | performance | seguranca | escalabilidade | obsolescencia
        
        # Features afetadas
        features_afetadas:
          - id: "feat-XXX"
            nome: "Nome da feature"
            impacto: "alto"  # baixo | medio | alto
        
        # Avaliação do risco
        avaliacao:
          probabilidade: "media"  # baixa | media | alta
          probabilidade_percentual: 50  # 0-100
          impacto: "alto"  # baixo | medio | alto
          impacto_descricao: |
            Descrição detalhada do impacto se o risco se materializar.
          
          criticidade: "alto"  # baixo | medio | alto | critico
          # Criticidade = Probabilidade × Impacto
          # Crítico: Alta × Alto
          # Alto: Alta × Médio ou Média × Alto
          # Médio: Média × Médio
          # Baixo: Baixa × *
        
        # Indicadores de alerta
        indicadores_alerta:
          - indicador: "Descrição do indicador que sinaliza que o risco está se materializando"
            metrica: "Métrica quantificável se possível"
        
        # Estratégia de mitigação
        mitigacao:
          estrategia: "mitigar"  # evitar | mitigar | transferir | aceitar
          descricao: |
            Descrição detalhada da estratégia de mitigação.
          
          acoes:
            - acao: "Ação específica de mitigação"
              responsavel: "Nome do responsável"
              prazo: "YYYY-MM-DD"
              status: "pendente"  # pendente | em_andamento | concluida
              custo_estimado: "Descrição do custo"
          
          plano_contingencia: |
            O que fazer se o risco se materializar apesar da mitigação?
        
        # Status do risco
        status: "identificado"  # identificado | monitorando | mitigando | materializado | resolvido
        
        # Responsável pelo monitoramento
        responsavel: "Nome do responsável"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# TEMPLATE 6: RISCOS REGULATÓRIOS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Arquivo: riscos/riscos-regulatorios.yml
# Descrição: Riscos relacionados a compliance, LGPD, licenças e regulamentações.
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

riscos_regulatorios_template:
  # ──────────────────────────────────────────────────────────────────
  # CABEÇALHO DO ARQUIVO
  # ──────────────────────────────────────────────────────────────────
  # # ====================================================================
  # # Riscos Regulatórios - {produto}
  # # ====================================================================
  # # Versão: 1.0.0
  # # Data: {YYYY-MM-DD}
  # # 
  # # Descrição:
  # #   Riscos relacionados a compliance, LGPD, licenças e regulamentações.
  # # ====================================================================
  # ──────────────────────────────────────────────────────────────────

  riscos_regulatorios:
    metadata:
      produto: "Nome do Produto"
      categoria: "regulatorio"
      total_riscos: 0
      data_atualizacao: "YYYY-MM-DD"
    
    riscos:
      - id: "risk-reg-001"
        titulo: "Título descritivo do risco"
        descricao: |
          Descrição completa do risco regulatório.
          Qual regulamentação pode ser afetada?
        
        # Subcategoria
        subcategoria: "lgpd"  # lgpd | compliance | licencas | fiscal | setorial
        
        # Regulamentação afetada
        regulamentacao:
          nome: "Nome da regulamentação (ex: LGPD)"
          artigos: ["Art. X", "Art. Y"]
          orgao_regulador: "Nome do órgão regulador"
        
        # Features afetadas
        features_afetadas:
          - id: "feat-XXX"
            nome: "Nome da feature"
            dados_sensiveis: true  # Se envolve dados pessoais/sensíveis
        
        # Avaliação do risco
        avaliacao:
          probabilidade: "baixa"  # baixa | media | alta
          impacto: "alto"  # baixo | medio | alto
          impacto_legal: |
            Descrição do impacto legal se o risco se materializar.
            Ex: Multas, sanções, processos judiciais.
          
          criticidade: "alto"
        
        # Mitigação
        mitigacao:
          estrategia: "evitar"  # evitar | mitigar | transferir | aceitar
          descricao: |
            Descrição da estratégia de mitigação.
          
          acoes:
            - acao: "Ação específica"
              responsavel: "Nome"
              prazo: "YYYY-MM-DD"
              status: "pendente"
          
          consulta_juridica: true  # Se precisa de consultoria jurídica
        
        # Status
        status: "identificado"
        responsavel: "Nome do responsável"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# TEMPLATE 7: RISCOS DE MERCADO
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
