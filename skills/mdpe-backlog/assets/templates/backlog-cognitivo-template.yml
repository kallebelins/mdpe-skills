# GLOSSÁRIO
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

glossario:
  backlog_cognitivo: |
    Output estruturado da fase de Discovery que contém funcionalidades
    priorizadas antes da transformação em micro-tarefas executáveis.
  
  feature: |
    Funcionalidade de alto nível que agrupa várias funcionalidades 
    menores relacionadas. Representa uma capacidade do produto.
  
  moscow: |
    Técnica de priorização:
    - Must Have: Essencial, sem isso não há produto viável
    - Should Have: Importante, agrega valor significativo
    - Could Have: Desejável se houver tempo/recurso
    - Won't Have: Não será feito nesta iteração
  
  categoria:
    core: "Funcionalidade essencial para o produto existir"
    complementar: "Agrega valor mas não é essencial"
    exploratoria: "Para validar novas ideias ou mercados"
  
  rice_score: |
    Método de priorização:
    - Reach: Quantas pessoas impactadas
    - Impact: Nível de impacto individual
    - Confidence: Confiança nas estimativas
    - Effort: Esforço necessário
    Score = (Reach × Impact × Confidence) / Effort
