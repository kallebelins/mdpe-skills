estrutura_diretorio:
  descricao: |
    docs/backlog/
    ├── backlog-index.yml          # Índice geral do backlog
    ├── roadmap.yml                # Roadmap indicativo
    └── features/
        ├── feat-001.yml           # Feature 1 detalhada
        ├── feat-002.yml           # Feature 2 detalhada
        ├── feat-003.yml           # Feature 3 detalhada
        └── feat-XXX.yml           # Feature N detalhada

