# ====================================================================
# MDPE Framework - Cognitive Backlog Templates
# ====================================================================
# Version: 2.0.0
# Purpose: Templates for structuring the Cognitive Backlog
# Phase: Discovery & Cognitive Backlog (Structuring)
# ====================================================================
#
# This file contains the templates for the Cognitive Backlog files:
#
# 1. backlog-index.yml - General backlog index (main)
# 2. feat-XXX.yml - Detailed individual feature
# 3. roadmap.yml - Derived indicative roadmap
#
# Location of generated files:
#   docs/backlog/
#   ├── backlog-index.yml          # General index
#   ├── roadmap.yml                # Indicative roadmap
#   └── features/
#       ├── feat-001.yml           # Feature 1
#       ├── feat-002.yml           # Feature 2
#       └── feat-XXX.yml           # Feature N
#
# --------------------------------------------------------------------
# OBLIGATION LEGEND (per block, in comments below)
#   [E] essential    - the backlog entry is invalid without it
#   [C] conditional  - required only when it actually applies
#   [O] optional     - fill only if it carries real content
# No count here (functionalities, hypotheses, risks) is a target. A
# feature with 2 real functionalities is complete at 2; do not invent
# one to fill a range. Never write a placeholder like "TBD" - an
# unknown value is `unknown`, and an empty list is `[]`.
# ====================================================================

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# TEMPLATE 1: BACKLOG INDEX (General Index)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# File: backlog-index.yml
# Description: General cognitive backlog index with metadata, context,
#              feature list, and consolidated statistics.
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

backlog_index_template:
  # ──────────────────────────────────────────────────────────────────
  # FILE HEADER
  # ──────────────────────────────────────────────────────────────────
  # # ====================================================================
  # # MDPE Framework - Cognitive Backlog - Index
  # # ====================================================================
  # # Project: {Project Name}
  # # Version: 1.0.0
  # # Creation Date: {YYYY-MM-DD}
  # # ====================================================================
  # ──────────────────────────────────────────────────────────────────

  cognitive_backlog:
    # ──────────────────────────────────────────────────────────────────
    # METADATA
    # ──────────────────────────────────────────────────────────────────
    metadata:
      version: "1.0.0"
      created_at: "YYYY-MM-DD"
      updated_at: "YYYY-MM-DD"
      product: "Product/Project Name"
      po_responsible: "Product Owner Name"
      discovery_session_id: "discovery-{project}-YYYYMMDD"
      status: "active"  # active | archived | review
      
      version_history:
        - version: "1.0.0"
          date: "YYYY-MM-DD"
          changes: "Initial version post-Discovery"
    
    # ──────────────────────────────────────────────────────────────────
    # STRATEGIC CONTEXT
    # ──────────────────────────────────────────────────────────────────
    context:
      product_vision: |
        For [target audience]
        Who need [need/problem]
        The [product name]
        Is a [product category]
        That offers [key benefits]
        Unlike [alternatives/competitors]
        Our product [competitive differentiator]
      
      strategic_objectives:
        - id: "obj-001"
          description: "Description of the strategic objective"
          key_metric: "Name of the main metric"
          baseline: "Current value or N/A"
          target: "Goal to achieve"
          deadline: "X months"
          status: "active"  # active | achieved | cancelled
        
        - id: "obj-002"
          description: "Objective description"
          key_metric: "Metric"
          baseline: "Baseline"
          target: "Target"
          deadline: "X months"
          status: "active"
      
      anti_objectives:
        - "What we do NOT want to do or be"
        - "Explicitly excluded scope"
        - "Features we will not implement"
      
      product_success_metrics:
        - metric: "Metric name"
          target: "Target value"
          measurement_frequency: "daily | weekly | monthly"
    
    # ──────────────────────────────────────────────────────────────────
    # MAIN PERSONAS
    # ──────────────────────────────────────────────────────────────────
    main_personas:
      - id: "persona-001"
        name: "Persona Name"
        profile: |
          Description of the persona's profile.
          Context, role, responsibilities.
        critical_needs:
          - "Need 1"
          - "Need 2"
          - "Need 3"
      
      - id: "persona-002"
        name: "Persona Name 2"
        profile: |
          Profile description.
        critical_needs:
          - "Need 1"
    
    # ──────────────────────────────────────────────────────────────────
    # FEATURE LIST (Summary)
    # ──────────────────────────────────────────────────────────────────
    features:
      - id: "feat-001"
        name: "Feature Name"
        category: "core"  # core | complementary | exploratory
        moscow: "must-have"  # must-have | should-have | could-have | wont-have
        grouped_functionalities: 0  # Number of grouped functionalities
        short_description: "Short description of the feature"
        file: "features/feat-001.yml"
      
      - id: "feat-002"
        name: "Feature Name 2"
        category: "complementary"
        moscow: "should-have"
        grouped_functionalities: 0
        short_description: "Short description"
        file: "features/feat-002.yml"
    
    # ──────────────────────────────────────────────────────────────────
    # STATISTICS
    # ──────────────────────────────────────────────────────────────────
    statistics:
      total_features: 0
      total_functionalities: 0
      
      features_by_category:
        core: 0
        complementary: 0
        exploratory: 0
      
      features_by_moscow:
        must_have: 0
        should_have: 0
        could_have: 0
        wont_have: 0
    
    # ──────────────────────────────────────────────────────────────────
    # TRACEABILITY
    # ──────────────────────────────────────────────────────────────────
    traceability:
      related_discovery_sessions:
        - id: "discovery-{module}-YYYYMMDD"
          date: "YYYY-MM-DD"
          type: "lean-inception"  # lean-inception | brainstorming | workshop | interviews
          participants:
            - "Product Owner"
            - "Stakeholders"
            - "Architect"
            - "UX Designer"
          duration_hours: 8
          
          outputs:
            - "X functionalities identified"
            - "Y personas documented"
            - "Z strategic objectives defined"
      
      feature_origin:
        - source: "docs/lean-inception/brainstorm.md"
          date: "YYYY-MM-DD"
          type: "brainstorming"
          description: "Description of the source session"
    
    # ──────────────────────────────────────────────────────────────────
    # INDICATIVE ROADMAP (Summary)
    # ──────────────────────────────────────────────────────────────────
    indicative_roadmap:
      phase_1_mvp:
        deadline: "X months"
        objective: "Description of the phase 1 objective"
        features:
          - "feat-001"
          - "feat-002"
      
      phase_2_growth:
        deadline: "X-Y months"
        objective: "Description of the phase 2 objective"
        features:
          - "feat-003"
          - "feat-004"
      
      phase_3_expansion:
        deadline: "Y-Z months"
        objective: "Description of the phase 3 objective"
        features:
          - "feat-005"
    
    # ──────────────────────────────────────────────────────────────────
    # NEXT STEPS
    # ──────────────────────────────────────────────────────────────────
    next_steps:
      next_event: "Transformation Layer"
      expected_date: "YYYY-MM-DD"
      responsible: "Architect/Tech Lead"
      objective: |
        Transform Must-Have features into executable micro-tasks,
        generating the Micro-Task Backlog to kick off development.
      
      features_for_transformation:
        - "feat-001"
        - "feat-002"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# TEMPLATE 2: INDIVIDUAL FEATURE (feat-XXX.yml)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# File: features/feat-XXX.yml
# Description: Full detail of an individual feature.
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

feature_template:
  # ──────────────────────────────────────────────────────────────────
  # FILE HEADER
  # ──────────────────────────────────────────────────────────────────
  # # ====================================================================
  # # MDPE Framework - Feature {feat-XXX}
  # # ====================================================================
  # # Project: {Project Name}
  # # Version: 1.0.0
  # # Creation Date: {YYYY-MM-DD}
  # # ====================================================================
  # ──────────────────────────────────────────────────────────────────

  feature:
    # ──────────────────────────────────────────────────────────────────
    # IDENTIFICATION
    # ──────────────────────────────────────────────────────────────────
    id: "feat-XXX"  # Format: feat-001, feat-002, etc.
    name: "Descriptive functionality name"
    
    # ──────────────────────────────────────────────────────────────────
    # DESCRIPTION
    # ──────────────────────────────────────────────────────────────────
    description: |
      Detailed description of the high-level functionality.
      What does it solve? Which user problem does it address?
      What are the main benefits?
    
    # ──────────────────────────────────────────────────────────────────
    # CLASSIFICATION
    # ──────────────────────────────────────────────────────────────────
    category: "core"  # core | complementary | exploratory
    # core: Essential functionality for the product
    # complementary: Adds value but is not essential
    # exploratory: Functionality to validate/explore
    
    # ──────────────────────────────────────────────────────────────────
    # PRIORITIZATION
    # ──────────────────────────────────────────────────────────────────
    priority:
      moscow: "must-have"  # must-have | should-have | could-have | wont-have
      business_value: 10  # 1-10 scale (10 = very high value)
      estimated_effort: 5  # 1-10 scale (10 = very high effort)
      priority_score: 50  # business_value * (10 - estimated_effort)
      
      # RICE Score  [O] - alternative prioritization method, only if actually used
      rice:
        reach: 0  # How many people impacted per period
        impact: 0  # Individual impact (0.25, 0.5, 1, 2, 3)
        confidence: 0  # Confidence level (0-100%)
        effort: 0  # Effort in person-months
        score: 0  # (Reach × Impact × Confidence) / Effort
      
      prioritization_justification: |
        Why does this feature have this priority?
        Which factors were considered?
    
    # ──────────────────────────────────────────────────────────────────
    # GROUPED FUNCTIONALITIES  [E] - no floor or ceiling on the count
    # ──────────────────────────────────────────────────────────────────
    functionalities:
      total: 0  # Total number of grouped functionalities - whatever the real count is
      
      list:
        - id: "func-001"
          description: "Description of the specific functionality"
          priority: "high"  # high | medium | low
        
        - id: "func-002"
          description: "Another functionality"
          priority: "medium"
    
    # ──────────────────────────────────────────────────────────────────
    # VALUE CRITERIA
    # ──────────────────────────────────────────────────────────────────
    value_criteria:
      - criterion: "Success criterion 1"
        metric: "Observable metric"
        target: "Target value"
      
      - criterion: "Success criterion 2"
        metric: "Expected result"
        target: "Target value"
    
    # ──────────────────────────────────────────────────────────────────
    # PERSONAS SERVED
    # ──────────────────────────────────────────────────────────────────
    personas_served:
      - id: "persona-001"
        name: "Persona Name"
        impact: "high"  # low | medium | high
        needs_addressed:
          - "Need 1"
          - "Need 2"
    
    # ──────────────────────────────────────────────────────────────────
    # HYPOTHESES  [C] - only real hypotheses from discovery; [] is valid
    # ──────────────────────────────────────────────────────────────────
    hypotheses:
      - id: "hyp-feat-XXX-001"
        type: "value"  # value | usability | feasibility
        hypothesis: "Description of the hypothesis"
        validation: "How it was validated or its validation status"
        confidence: "high"  # high | medium | low
        evidence:
          - "Evidence 1"
          - "Evidence 2"
    
    # ──────────────────────────────────────────────────────────────────
    # DEPENDENCIES
    # ──────────────────────────────────────────────────────────────────
    dependencies:
      business:
        # Features that must exist for this to work in the business
        - feature_id: "feat-YYY"
          reason: "Why it depends"
          type: "hard"  # hard | soft
      
      technical:
        # Technical dependencies (components, APIs, services)
        - type: "component"
          name: "Component/service name"
          status: "available"  # available | in_development | planned
    
    # ──────────────────────────────────────────────────────────────────
    # RISKS  [C] - only real risks; [] is valid, not a gap to fill
    # ──────────────────────────────────────────────────────────────────
    risks:
      - id: "risk-feat-XXX-001"
        type: "technology"  # technology | regulatory | business | resources
        description: "Description of the risk"
        probability: "medium"  # low | medium | high
        impact: "high"  # low | medium | high
        mitigation: "Mitigation strategy"
    
    # ──────────────────────────────────────────────────────────────────
    # ACCEPTANCE CRITERIA (High-Level)
    # ──────────────────────────────────────────────────────────────────
    acceptance_criteria:
      - "Acceptance criterion 1 - observable and verifiable"
      - "Acceptance criterion 2"
      - "Acceptance criterion 3"
    
    # ──────────────────────────────────────────────────────────────────
    # DISCOVERY NOTES  [O]
    # ──────────────────────────────────────────────────────────────────
    discovery_notes:
      - date: "YYYY-MM-DD"
        author: "Name"
        note: "Relevant discovery observation"
    
    # ──────────────────────────────────────────────────────────────────
    # METADATA
    # ──────────────────────────────────────────────────────────────────
    metadata:
      version: "1.0.0"
      created_at: "YYYY-MM-DD"
      updated_at: "YYYY-MM-DD"
      status: "backlog"  # backlog | in_transformation | transformed | in_development | completed
      
      changelog:
        - version: "1.0.0"
          date: "YYYY-MM-DD"
          description: "Initial version"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# TEMPLATE 3: INDICATIVE ROADMAP
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# File: roadmap.yml
# Description: Indicative roadmap derived from the cognitive backlog.
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

roadmap_template:
  # ──────────────────────────────────────────────────────────────────
  # FILE HEADER
  # ──────────────────────────────────────────────────────────────────
  # # ====================================================================
  # # MDPE Framework - Indicative Roadmap
  # # ====================================================================
  # # Project: {Project Name}
  # # Version: 1.0.0
  # # Creation Date: {YYYY-MM-DD}
  # # ====================================================================
  # ──────────────────────────────────────────────────────────────────

  roadmap:
    # ──────────────────────────────────────────────────────────────────
    # METADATA
    # ──────────────────────────────────────────────────────────────────
    metadata:
      version: "1.0.0"
      created_at: "YYYY-MM-DD"
      updated_at: "YYYY-MM-DD"
      product: "Product Name"
      status: "active"  # active | review | archived
    
    # ──────────────────────────────────────────────────────────────────
    # OVERVIEW
    # ──────────────────────────────────────────────────────────────────
    overview: |
      General description of the roadmap.
      Criteria used to organize the phases.
      Assumptions and constraints considered.
    
    # ──────────────────────────────────────────────────────────────────
    # PHASE 1 - MVP
    # ──────────────────────────────────────────────────────────────────
    phase_1_mvp:
      name: "Functional MVP"
      deadline: "X months"
      objective: |
        Description of the phase 1 objective.
        What will be delivered? What minimum value will be validated?
      
      features:
        - feature_id: "feat-001"
          name: "Feature Name"
          priority: "critical"  # critical | high | medium | low
          justification: "Why it's in this phase"
          dependencies: []  # IDs of features that must come first
          estimated_weeks: 0
        
        - feature_id: "feat-002"
          name: "Feature Name"
          priority: "critical"
          justification: "Justification"
          dependencies: ["feat-001"]
          estimated_weeks: 0
      
      expected_deliverables:
        - "Deliverable 1"
        - "Deliverable 2"
      
      success_metrics:
        - metric: "Metric name"
          target: "Target value"
    
    # ──────────────────────────────────────────────────────────────────
    # PHASE 2 - GROWTH
    # ──────────────────────────────────────────────────────────────────
    phase_2_growth:
      name: "Growth and Sophistication"
      deadline: "X-Y months"
      objective: |
        Description of the phase 2 objective.
      
      features:
        - feature_id: "feat-003"
          name: "Feature Name"
          priority: "high"
          justification: "Justification"
          dependencies: ["feat-001"]
          estimated_weeks: 0
      
      expected_deliverables:
        - "Deliverable 1"
      
      success_metrics:
        - metric: "Metric name"
          target: "Target value"
    
    # ──────────────────────────────────────────────────────────────────
    # PHASE 3 - EXPANSION
    # ──────────────────────────────────────────────────────────────────
    phase_3_expansion:
      name: "Expansion and Differentiators"
      deadline: "Y-Z months"
      objective: |
        Description of the phase 3 objective.
      
      features:
        - feature_id: "feat-005"
          name: "Feature Name"
          priority: "medium"
          justification: "Justification"
          dependencies: ["feat-001", "feat-003"]
          estimated_weeks: 0
      
      expected_deliverables:
        - "Deliverable 1"
      
      success_metrics:
        - metric: "Metric name"
          target: "Target value"
    
    # ──────────────────────────────────────────────────────────────────
    # CRITICAL DEPENDENCIES
    # ──────────────────────────────────────────────────────────────────
    critical_dependencies:
      - source: "feat-001"
        target: "feat-002"
        type: "hard"  # hard | soft
        description: "Why this dependency exists"
    
    # ──────────────────────────────────────────────────────────────────
    # ROADMAP RISKS
    # ──────────────────────────────────────────────────────────────────
    roadmap_risks:
      - id: "risk-roadmap-001"
        description: "Description of the risk to the roadmap"
        probability: "medium"  # low | medium | high
        impact: "high"  # low | medium | high
        mitigation: "Mitigation strategy"
        affected_features: ["feat-001"]
    
    # ──────────────────────────────────────────────────────────────────
    # PLANNED REVIEWS
    # ──────────────────────────────────────────────────────────────────
    planned_reviews:
      - date: "YYYY-MM-DD"
        type: "checkpoint"  # checkpoint | full_review | retrospective
        objective: "Objective of the review"
    
    # ──────────────────────────────────────────────────────────────────
    # NOTES
    # ──────────────────────────────────────────────────────────────────
    notes:
      - date: "YYYY-MM-DD"
        author: "Name"
        note: |
          Relevant observation about the roadmap.

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# USAGE INSTRUCTIONS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

usage_instructions:
  description: |
    This file contains the templates for structuring the Cognitive Backlog.
    Use each section as a base to create the individual files.
  
  generation_flow:
    step_1:
      description: "Consolidate Discovery outputs"
      input: "docs/discovery/*.yml, lean-inception/*.md"
      action: "Gather all identified functionalities"
    
    step_2:
      description: "Group functionalities into features"
      action: |
        Group related functionalities into high-level features.
        There is no floor or ceiling on the count: group as many real
        functionalities as the feature actually has. 2 or 40 are both
        valid if that is what discovery produced - never pad the list
        to reach a round number.
    
    step_3:
      description: "Create backlog-index.yml"
      output: "docs/backlog/backlog-index.yml"
      action: |
        Use backlog_index_template.
        Fill in metadata, context, personas.
        List all features with a summary.
    
    step_4:
      description: "Create individual feature files"
      output: "docs/backlog/features/feat-XXX.yml"
      action: |
        Use feature_template for each feature.
        Detail functionalities, criteria, hypotheses, risks.
    
    step_5:
      description: "Create roadmap.yml"
      output: "docs/backlog/roadmap.yml"
      action: |
        Use roadmap_template.
        Organize features into phases (MVP, Growth, Expansion).
        Define dependencies and success metrics.
    
    step_6:
      description: "Validate and update statistics"
      action: |
        Update statistics in backlog-index.yml.
        Validate consistency across files.
  
  validation:
    - "All features have a unique ID (feat-XXX)"
    - "Each feature is saved in a separate file"
    - "backlog-index contains the list of all features"
    - "Complete metadata (description, value, priority)"
    - "Traceability configured (origin, version)"
    - "Roadmap organized into phases"
    - "Dependencies mapped"
    - "Acceptance criteria defined"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# EXAMPLE DIRECTORY STRUCTURE
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

directory_structure:
  description: |
