glossary:
  cognitive_backlog: |
    Structured output of the Discovery phase containing prioritized
    functionalities before being transformed into executable micro-tasks.
  
  feature: |
    A high-level functionality that groups several related smaller
    functionalities. Represents a product capability.
  
  moscow: |
    Prioritization technique:
    - Must Have: Essential, no viable product without it
    - Should Have: Important, adds significant value
    - Could Have: Desirable if there is time/resources
    - Won't Have: Will not be done this iteration
  
  category:
    core: "Essential functionality for the product to exist"
    complementary: "Adds value but is not essential"
    exploratory: "To validate new ideas or markets"
  
  rice_score: |
    Prioritization method:
    - Reach: How many people impacted
    - Impact: Level of individual impact
    - Confidence: Confidence in the estimates
    - Effort: Effort required
    Score = (Reach × Impact × Confidence) / Effort
