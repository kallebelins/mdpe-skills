# ====================================================================
# MDPE Framework - Contexto de Execução de Micro-Tarefa - Template
# ====================================================================
# Versão: 1.0.0
# Propósito: Template para geração de contextos de execução de micro-tarefas
# 
# Descrição:
#   O Contexto de Execução é um documento completo e autocontido que fornece
#   todas as informações necessárias para um desenvolvedor (humano ou IA)
#   executar uma micro-tarefa com sucesso, sem necessidade de buscar
#   informações adicionais em outros documentos.
#
# Uso:
#   Este template deve ser preenchido após a decomposição de features em
#   micro-tarefas (etapa de Transformation). Cada micro-tarefa deve ter
#   seu próprio contexto de execução gerado a partir deste template.
#
# Estrutura:
#   1. Metadata - Identificação e rastreabilidade
#   2. Contexto Estratégico - Por que esta tarefa existe
#   3. Contexto Técnico - O que e como implementar
#   4. Contexto de Entrada - O que está disponível
#   5. Contexto de Saída - O que deve ser produzido
#   6. Contexto de Validação - Como validar sucesso
#   7. Contexto de Referência - Exemplos e documentação
#   8. Instruções de Execução - Passo a passo para executar
# ====================================================================

contexto_execucao_microtarefa:
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # METADATA
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Identificação e rastreabilidade da micro-tarefa
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  metadata:
    microtarefa_id: "mt-XXX-YYY"  # Formato: mt-{feature-number}-{sequence}
    titulo: "Título claro e descritivo da micro-tarefa"
    data_geracao: "YYYY-MM-DD"
    versao_contexto: "1.0.0"
    gerado_por: "Nome do autor/sistema"
    
    feature_origem_id: "feat-XXX"
    feature_origem_nome: "Nome da Feature de Origem"
    
    categoria: "backend"  # backend | frontend | database | infra | docs | tests
    camada: "domain"  # domain | application | infrastructure | presentation | tests | docs
    wave: 1  # Número da wave de execução
    
    estimativas:
      tempo_horas: 4
      complexidade: "media"  # baixa | media | alta
    
    status: "pendente"  # pendente | em_progresso | concluida | bloqueada
  
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 💡 1. CONTEXTO ESTRATÉGICO - Por que esta tarefa existe?
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Justificativa de negócio, valor gerado e impacto da tarefa
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  contexto_estrategico:
    feature_origem:
      id: "feat-XXX"
      nome: "Nome da Feature de Origem"
      
      problema_resolvido: |
        Descreva o problema de negócio/usuário que a feature resolve.
        
        - Qual é a dor do usuário?
        - Qual é o cenário atual (as-is)?
        - Por que é importante resolver?
        
        Exemplo:
        - Proprietários enfrentam dificuldades para cadastrar propriedades
        - Processo manual demorado (4+ horas por propriedade)
        - Falta de orientação sobre como descrever propriedades
      
      valor_negocio: |
        Descreva o valor gerado pela feature quando implementada.
        
        - Quais métricas de negócio são impactadas?
        - Quais objetivos estratégicos são suportados?
        - Qual é o ROI esperado?
        
        Exemplo:
        - Habilita gestão de 50.000+ propriedades (obj-001)
        - Reduz tempo de cadastro de 4h para 20min (obj-003)
        - Suporta curadoria para garantir qualidade (obj-017)
    
    impacto_desta_microtarefa: |
      Descreva o impacto específico DESTA micro-tarefa.
      
      - Esta é a primeira/crítica? Por quê?
      - O que NÃO funciona sem esta tarefa?
      - O que será habilitado após sua conclusão?
      - Quais tarefas downstream dependem desta?
      
      ⚠️ Seja específico e quantifique quando possível.
      
      Exemplo:
      Esta é a PRIMEIRA e mais CRÍTICA micro-tarefa de todo o sistema.
      
      Sem esta tarefa:
      ✗ Não é possível cadastrar propriedades
      ✗ Não é possível criar quartos
      ✗ Bloqueia todas as 21 micro-tarefas downstream
      
      Com esta tarefa:
      ✓ Fundação de dados estabelecida
      ✓ Habilita desenvolvimento de entidades de domínio
      ✓ Permite implementação de repositórios
    
    objetivos_estrategicos_suportados:
      - id: "obj-XXX"
        descricao: "Descrição do objetivo estratégico"
        contribuicao: "Como esta tarefa contribui para o objetivo"
    
    personas_impactadas:
      - id: "persona-XXX"
        nome: "Nome da Persona"
        necessidade_atendida: |
          Descrição de como esta tarefa atende às necessidades da persona.
          Seja específico sobre o que a persona poderá fazer após a conclusão.
  
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 🔧 2. CONTEXTO TÉCNICO - O que e como implementar?
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Informações técnicas completas para implementação
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  contexto_tecnico:
    arquitetura:
      padrao_geral: "Clean Architecture com DDD"  # Padrão arquitetural do projeto
      camada_alvo: "Infrastructure Layer - Persistence"  # Camada específica
      
      estrutura_diretorios:
        - caminho: "caminho/para/diretorio"
          descricao: "Descrição do propósito do diretório"
        
        - caminho: "outro/caminho"
          descricao: "Descrição do propósito"
      
      dependencias_entre_camadas: |
        Descreva como esta tarefa se relaciona com outras camadas.
        
        Exemplo:
        Infrastructure → Domain (depende de entities)
        Esta tarefa está na camada Infrastructure (Persistence).
        NÃO depende de Domain neste momento (migration pura).
      
      padroes_arquiteturais:
        - nome: "Nome do Padrão"
          descricao: "Descrição breve do padrão"
          justificativa: |
            Por que este padrão está sendo usado nesta tarefa.
            Quais benefícios ele proporciona.
    
    stack_tecnologico:
      linguagem: "C#"  # Linguagem principal
      versao_linguagem: ".NET 8.0"
      
      frameworks:
        - nome: "Nome do Framework"
          versao: "X.Y.Z"
          uso: "Como o framework é usado nesta tarefa"
          nuget_package: "Nome.Do.Pacote"  # Se aplicável
      
      banco_dados:
        nome: "PostgreSQL"
        versao: "16.x"
        schema: "nome_do_schema"
        encoding: "UTF8"
        collation: "pt_BR.UTF-8"
      
      ferramentas_desenvolvimento:
        - nome: "Nome da Ferramenta"
          versao: "X.Y"
          uso: "Como a ferramenta é usada"
          comandos_relevantes:
            - "comando1"
            - "comando2"
    
    convencoes_codigo:
      nomenclatura_database:  # Se aplicável
        tabelas: "snake_case plural (ex: properties)"
        colunas: "snake_case (ex: tenant_id, created_at)"
        indices: "idx_{table}_{column}"
        constraints: "pk_{table}, fk_{table}_{ref}, uk_{table}_{column}"
        schema: "nome_do_schema"
      
      nomenclatura_csharp:  # Se aplicável
        classes: "PascalCase"
        interfaces: "IPascalCase"
        metodos: "PascalCase"
        propriedades: "PascalCase"
        variaveis_locais: "camelCase"
        campos_privados: "_camelCase"
      
      tipos_dados:
        - tipo: "Nome do Tipo"
          uso: "Quando usar este tipo"
          exemplo: "Exemplo de uso"
      
      padroes_especificos:
        - "Descrição do padrão ou convenção específica"
        - "Outro padrão importante"
    
    padroes_projeto:
      # Defina padrões específicos do projeto relevantes para esta tarefa
      nome_do_padrao:
        estrategia: "Descrição da estratégia"
        implementacao: |
          Detalhes de como implementar o padrão.
          Inclua exemplos de código se necessário.
  
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 📦 3. CONTEXTO DE ENTRADA - O que está disponível?
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Dependências, artefatos e recursos disponíveis ANTES de iniciar
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  contexto_entrada:
    dependencias_upstream_concluidas:
      # Liste TODAS as micro-tarefas que devem estar concluídas
      # Se esta é a primeira tarefa, deixe vazio: []
      - microtarefa_id: "mt-XXX-YYY"
        nome: "Nome da micro-tarefa dependente"
        output_gerado:
          - tipo: "codigo"  # codigo | database | documentacao | configuracao
            descricao: "Descrição do artefato gerado"
            localizacao: "caminho/para/artefato"
            detalhes: |
              Detalhes adicionais sobre o artefato.
              Como este artefato será usado nesta tarefa.
        
        como_verificar: |
          Comando ou procedimento para verificar que a dependência
          foi concluída com sucesso.
    
    artefatos_disponiveis:
      # Liste TODOS os artefatos que serão usados como referência
      - tipo: "codigo"  # codigo | documentacao | configuracao | exemplo
        nome: "Nome descritivo do artefato"
        localizacao: "caminho/para/artefato"
        conteudo_relevante: |
          Descrição do conteúdo relevante para esta tarefa.
          Quais partes do artefato devem ser consultadas.
    
    conhecimento_necessario:
      # Liste os conhecimentos técnicos necessários para executar
      - tema: "Nome do Tema/Tecnologia"
        descricao: "Descrição breve do conhecimento necessário"
        nivel_requerido: "básico"  # básico | intermediário | avançado
        recursos_aprendizado:
          - url: "https://link.para/documentacao"
            titulo: "Título da Documentação"
    
    recursos_externos:
      # Liste recursos externos necessários (serviços, ferramentas)
      - tipo: "servico"  # servico | ferramenta | api | biblioteca
        nome: "Nome do Recurso"
        versao: "X.Y.Z"
        disponibilidade: "deve estar rodando"  # instalado | deve ser configurado
        como_verificar: "Comando para verificar disponibilidade"
        como_instalar: "Comando ou procedimento de instalação"  # Opcional
  
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 🎯 4. CONTEXTO DE SAÍDA - O que deve ser produzido?
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Artefatos e mudanças esperadas após conclusão da tarefa
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  contexto_saida:
    artefatos_esperados:
      - tipo: "codigo"  # codigo | database | documentacao | configuracao | teste
        nome: "Nome descritivo do artefato"
        localizacao: "caminho/para/artefato"
        linguagem: "csharp"  # csharp | typescript | sql | yaml | markdown
        
        estrutura_esperada: |
          Estrutura detalhada do código ou artefato a ser gerado.
          
          Use código exemplo quando apropriado:
          
          public class ExampleClass
          {
              public void ExampleMethod()
              {
                  // Implementação esperada
              }
          }
          
          ⚠️ Quanto mais detalhado, melhor a qualidade do output.
        
        exemplo_uso: |
          Exemplo de como o artefato será usado ou comandos para gerá-lo.
          
          # Criar migration
          dotnet ef migrations add NomeDaMigration
          
          # Aplicar migration
          dotnet ef database update
        
        notas_importantes:
          - "Nota importante sobre o artefato"
          - "Outra consideração relevante"
    
    mudancas_sistema:
      # Liste mudanças que serão feitas no sistema
      - tipo: "database"  # database | api | configuracao | infra
        descricao: "Descrição da mudança"
        impacto: "baixo"  # baixo | medio | alto
        breaking_change: false
    
    metricas_sucesso:
      # Defina métricas objetivas e mensuráveis
      - metrica: "Nome da Métrica"
        tipo: "funcional"  # funcional | performance | qualidade
        target: "Valor alvo esperado"
        como_medir: |
          Comando ou procedimento para medir a métrica.
          Seja específico e forneça exemplos de queries/comandos.
  
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # ✅ 5. CONTEXTO DE VALIDAÇÃO - Como validar sucesso?
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Checklists e critérios para validar a conclusão da tarefa
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  contexto_validacao:
    checklist_funcional:
      # Critérios funcionais que devem ser validados
      - criterio: "Descrição do critério funcional"
        como_validar: |
          Comando ou procedimento para validar o critério.
          Inclua o resultado esperado.
          
          Exemplo:
          SELECT COUNT(*) FROM table WHERE ...;
          
          Resultado esperado: > 0
    
    checklist_nao_funcional:
      # Critérios não-funcionais (performance, segurança, etc.)
      - criterio: "Descrição do critério não-funcional"
        tipo: "performance"  # performance | seguranca | escalabilidade | resiliencia
        como_validar: |
          Comando ou procedimento para validar.
          Inclua métricas esperadas.
    
    checklist_qualidade:
      # Critérios de qualidade de código
      - criterio: "Código compila sem warnings"
        como_validar: |
          dotnet build --no-incremental
          
          Resultado esperado: Build succeeded, 0 Warning(s)
      
      - criterio: "Convenções de código seguidas"
        como_validar: |
          Revisão de código ou ferramenta de análise.
      
      - criterio: "Documentação inline presente"
        como_validar: |
          Inspeção manual ou ferramenta de análise.
    
    definition_of_done:
      # Lista resumida de TODOS os critérios para considerar DONE
      - "✅ Critério obrigatório 1"
      - "✅ Critério obrigatório 2"
      - "✅ Critério obrigatório 3"
      - "✅ Todos os testes passando"
      - "✅ Documentação atualizada"
      - "✅ Code review aprovado"
  
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 📚 6. CONTEXTO DE REFERÊNCIA - Exemplos e documentação
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Links, exemplos e documentação de suporte
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  contexto_referencia:
    exemplos_codigo_projeto:
      # Exemplos de código dentro do próprio projeto
      - arquivo: "caminho/para/arquivo"
        descricao: "Descrição do que o arquivo exemplifica"
        relevancia: |
          Por que este exemplo é relevante para esta tarefa.
          Quais partes devem ser seguidas como referência.
        linhas_relevantes: "X-Y"  # Opcional: especificar linhas
    
    documentacao_externa:
      # Links para documentação oficial e recursos externos
      - titulo: "Título da Documentação"
        url: "https://link.para/documentacao"
        tipo: "documentacao_oficial"  # documentacao_oficial | tutorial | blog | stackoverflow
        relevancia: |
          Por que esta documentação é relevante.
          Quais seções são mais importantes.
    
    documentacao_interna:
      # Documentação do próprio projeto
      - arquivo: "caminho/para/doc.md"
        descricao: "Descrição do documento"
        secao_relevante: "Nome da Seção"  # Opcional
    
    tutoriais_relevantes:
      # Tutoriais passo-a-passo relevantes
      - titulo: "Título do Tutorial"
        url: "https://link.para/tutorial"
        tipo: "tutorial"
        topicos_cobertos:
          - "Tópico 1"
          - "Tópico 2"
    
    padroes_similares_projeto:
      # Referências a implementações similares no projeto
      - descricao: "Implementação similar existente"
        localizacao: "caminho/para/implementacao"
        como_adaptar: |
          Como adaptar esta implementação para a tarefa atual.
  
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # ⚠️ 7. RISCOS E TROUBLESHOOTING
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Riscos conhecidos e soluções para problemas comuns
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  riscos_e_troubleshooting:
    riscos_identificados:
      - id: "risk-mt-XXX-YYY-001"
        tipo: "tecnico"  # tecnico | negocio | recursos | cronograma
        descricao: "Descrição do risco identificado"
        probabilidade: "media"  # baixa | media | alta
        impacto: "alto"  # baixo | medio | alto
        mitigacao:
          estrategia: "Estratégia para mitigar o risco"
          acoes:
            - "Ação preventiva 1"
            - "Ação preventiva 2"
    
    troubleshooting_comum:
      # Lista de problemas comuns e suas soluções
      - erro: "Mensagem ou descrição do erro"
        causa_provavel: "Causa mais provável do erro"
        solucao: |
          Passos para resolver o problema.
          
          1. Primeiro passo
          2. Segundo passo
          3. Verificação final
      
      - erro: "Outro erro comum"
        causa_provavel: "Causa provável"
        solucao: |
          Solução detalhada.
  
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 📋 8. INSTRUÇÕES DE EXECUÇÃO - Passo a Passo
