  # Guia completo e sequencial para executar a tarefa
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  instrucoes_execucao: |
    ═══════════════════════════════════════════════════════════════════
