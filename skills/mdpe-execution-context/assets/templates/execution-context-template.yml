# ====================================================================
# NOTAS PARA O GERADOR DE CONTEXTOS
# ====================================================================
# 
# 1. COMPLETUDE: O contexto deve ser autocontido. O executor não deve
#    precisar buscar informações em outros documentos.
#
# 2. ESPECIFICIDADE: Quanto mais específico e detalhado, melhor.
#    Evite descrições vagas como "implementar corretamente".
#
# 3. EXEMPLOS: Sempre que possível, inclua exemplos de código
#    diretamente no template.
#
# 4. VALIDAÇÃO: Cada critério de validação deve ter um comando
#    ou procedimento específico para verificação.
#
# 5. RASTREABILIDADE: Mantenha conexões claras com a feature
#    de origem e objetivos estratégicos.
#
# 6. TROUBLESHOOTING: Antecipe problemas comuns e forneça soluções.
#
# 7. INSTRUÇÕES: O passo-a-passo deve ser sequencial e completo,
#    permitindo execução por alguém sem conhecimento prévio.
#
# 8. MÉTRICAS: Use métricas objetivas e mensuráveis sempre que
#    possível (tempo, quantidade, percentual).
# ====================================================================

