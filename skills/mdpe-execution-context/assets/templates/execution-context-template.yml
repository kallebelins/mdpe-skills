# ====================================================================
# MDPE Framework - Micro-Task Execution Context - Template
# ====================================================================
# Version: 1.0.0
# Purpose: Template for generating micro-task execution contexts
# 
# Description:
#   The Execution Context is a complete, self-contained document that
#   provides all the information a developer (human or AI) needs to
#   execute a micro-task successfully, without needing to look up
#   additional information elsewhere.
#
# Usage:
#   This template should be filled in after decomposing features into
#   micro-tasks (Transformation step). Each micro-task should have its
#   own execution context generated from this template.
#
# Structure:
#   1. Metadata - Identification and traceability
#   2. Strategic Context - Why this task exists
#   3. Technical Context - What and how to implement
#   4. Input Context - What is available
#   5. Output Context - What must be produced
#   6. Validation Context - How to validate success
#   7. Reference Context - Examples and documentation
#   8. Execution Instructions - Step-by-step guide
# ====================================================================

microtask_execution_context:
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # METADATA
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Identification and traceability of the micro-task
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  metadata:
    microtask_id: "mt-XXX-YYY"  # Format: mt-{feature-number}-{sequence}
    title: "Clear and descriptive title of the micro-task"
    generation_date: "YYYY-MM-DD"
    context_version: "1.0.0"
    generated_by: "Name of the author/system"
    
    origin_feature_id: "feat-XXX"
    origin_feature_name: "Origin Feature Name"
    
    category: "backend"  # backend | frontend | database | infra | docs | tests
    layer: "domain"  # domain | application | infrastructure | presentation | tests | docs
    wave: 1  # Execution wave number
    
    estimates:
      hours: 4
      complexity: "medium"  # low | medium | high
    
    status: "pending"  # pending | in_progress | completed | blocked
  
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 1. STRATEGIC CONTEXT - Why does this task exist?
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Business rationale, value generated, and impact of the task
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  strategic_context:
    origin_feature:
      id: "feat-XXX"
      name: "Origin Feature Name"
      
      problem_solved: |
        Describe the business/user problem the feature solves.
        
        - What is the user's pain point?
        - What is the current (as-is) scenario?
        - Why is it important to solve this?
        
        Example:
        - Owners struggle to register properties
        - Manual process is slow (4+ hours per property)
        - Lack of guidance on how to describe properties
      
      business_value: |
        Describe the value generated once the feature is implemented.
        
        - Which business metrics are impacted?
        - Which strategic objectives are supported?
        - What is the expected ROI?
        
        Example:
        - Enables managing 50,000+ properties (obj-001)
        - Reduces registration time from 4h to 20min (obj-003)
        - Supports curation to ensure quality (obj-017)
    
    this_microtask_impact: |
      Describe the specific impact of THIS micro-task.
      
      - Is this the first/critical one? Why?
      - What does NOT work without this task?
      - What will be enabled once it's complete?
      - Which downstream tasks depend on this one?
      
      Be specific and quantify whenever possible.
      
      Example:
      This is the FIRST and most CRITICAL micro-task in the entire system.
      
      Without this task:
      - Properties cannot be registered
      - Rooms cannot be created
      - Blocks all 21 downstream micro-tasks
      
      With this task:
      - Data foundation established
      - Enables development of domain entities
      - Allows implementing repositories
    
    supported_strategic_objectives:
      - id: "obj-XXX"
        description: "Description of the strategic objective"
        contribution: "How this task contributes to the objective"
    
    impacted_personas:
      - id: "persona-XXX"
        name: "Persona Name"
        need_addressed: |
          Description of how this task addresses the persona's needs.
          Be specific about what the persona will be able to do once complete.
  
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 2. TECHNICAL CONTEXT - What and how to implement?
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Full technical information for implementation
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  technical_context:
    architecture:
      overall_pattern: "Clean Architecture with DDD"  # Project's architectural pattern
      target_layer: "Infrastructure Layer - Persistence"  # Specific layer
      
      directory_structure:
        - path: "path/to/directory"
          description: "Description of the directory's purpose"
        
        - path: "another/path"
          description: "Description of the purpose"
      
      layer_dependencies: |
        Describe how this task relates to other layers.
        
        Example:
        Infrastructure → Domain (depends on entities)
        This task is in the Infrastructure layer (Persistence).
        It does NOT depend on Domain at this stage (pure migration).
      
      architectural_patterns:
        - name: "Pattern Name"
          description: "Brief description of the pattern"
          justification: |
            Why this pattern is used in this task.
            What benefits it provides.
    
    technology_stack:
      language: "C#"  # Main language
      language_version: ".NET 8.0"
      
      frameworks:
        - name: "Framework Name"
          version: "X.Y.Z"
          usage: "How the framework is used in this task"
          nuget_package: "Package.Name"  # If applicable
      
      database:
        name: "PostgreSQL"
        version: "16.x"
        schema: "schema_name"
        encoding: "UTF8"
        collation: "en_US.UTF-8"
      
      development_tools:
        - name: "Tool Name"
          version: "X.Y"
          usage: "How the tool is used"
          relevant_commands:
            - "command1"
            - "command2"
    
    code_conventions:
      database_naming:  # If applicable
        tables: "snake_case plural (e.g. properties)"
        columns: "snake_case (e.g. tenant_id, created_at)"
        indexes: "idx_{table}_{column}"
        constraints: "pk_{table}, fk_{table}_{ref}, uk_{table}_{column}"
        schema: "schema_name"
      
      csharp_naming:  # If applicable
        classes: "PascalCase"
        interfaces: "IPascalCase"
        methods: "PascalCase"
        properties: "PascalCase"
        local_variables: "camelCase"
        private_fields: "_camelCase"
      
      data_types:
        - type: "Type Name"
          usage: "When to use this type"
          example: "Usage example"
      
      specific_patterns:
        - "Description of a specific pattern or convention"
        - "Another important pattern"
    
    project_patterns:
      # Define specific project patterns relevant to this task
      pattern_name:
        strategy: "Description of the strategy"
        implementation: |
          Details on how to implement the pattern.
          Include code examples if necessary.
  
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 3. INPUT CONTEXT - What is available?
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Dependencies, artifacts, and resources available BEFORE starting
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  input_context:
    completed_upstream_dependencies:
      # List ALL micro-tasks that must be completed
      # If this is the first task, leave it empty: []
      - microtask_id: "mt-XXX-YYY"
        name: "Dependent micro-task name"
        generated_output:
          - type: "code"  # code | database | documentation | configuration
            description: "Description of the generated artifact"
            location: "path/to/artifact"
            details: |
              Additional details about the artifact.
              How this artifact will be used in this task.
        
        how_to_verify: |
          Command or procedure to verify that the dependency
          was completed successfully.
    
    available_artifacts:
      # List ALL artifacts that will be used as reference
      - type: "code"  # code | documentation | configuration | example
        name: "Descriptive artifact name"
        location: "path/to/artifact"
        relevant_content: |
          Description of the content relevant to this task.
          Which parts of the artifact should be consulted.
    
    required_knowledge:
      # List the technical knowledge required to execute this task
      - topic: "Topic/Technology Name"
        description: "Brief description of the required knowledge"
        required_level: "basic"  # basic | intermediate | advanced
        learning_resources:
          - url: "https://link.to/documentation"
            title: "Documentation Title"
    
    external_resources:
      # List required external resources (services, tools)
      - type: "service"  # service | tool | api | library
        name: "Resource Name"
        version: "X.Y.Z"
        availability: "must be running"  # installed | must be configured
        how_to_verify: "Command to verify availability"
        how_to_install: "Installation command or procedure"  # Optional
  
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 4. OUTPUT CONTEXT - What must be produced?
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Artifacts and changes expected after task completion
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  output_context:
    expected_artifacts:
      - type: "code"  # code | database | documentation | configuration | test
        name: "Descriptive artifact name"
        location: "path/to/artifact"
        language: "csharp"  # csharp | typescript | sql | yaml | markdown
        
        expected_structure: |
          Detailed structure of the code or artifact to be generated.
          
          Use sample code where appropriate:
          
          public class ExampleClass
          {
              public void ExampleMethod()
              {
                  // Expected implementation
              }
          }
          
          The more detailed, the better the output quality.
        
        usage_example: |
          Example of how the artifact will be used or commands to generate it.
          
          # Create migration
          dotnet ef migrations add MigrationName
          
          # Apply migration
          dotnet ef database update
        
        important_notes:
          - "Important note about the artifact"
          - "Another relevant consideration"
    
    system_changes:
      # List changes that will be made to the system
      - type: "database"  # database | api | configuration | infra
        description: "Description of the change"
        impact: "low"  # low | medium | high
        breaking_change: false
    
    success_metrics:
      # Define objective, measurable metrics
      - metric: "Metric Name"
        type: "functional"  # functional | performance | quality
        target: "Expected target value"
        how_to_measure: |
          Command or procedure to measure the metric.
          Be specific and provide query/command examples.
  
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 5. VALIDATION CONTEXT - How to validate success?
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Checklists and criteria to validate task completion
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  validation_context:
    functional_checklist:
      # Functional criteria to be validated
      - criterion: "Description of the functional criterion"
        how_to_validate: |
          Command or procedure to validate the criterion.
          Include the expected result.
          
          Example:
          SELECT COUNT(*) FROM table WHERE ...;
          
          Expected result: > 0
    
    non_functional_checklist:
      # Non-functional criteria (performance, security, etc.)
      - criterion: "Description of the non-functional criterion"
        type: "performance"  # performance | security | scalability | resilience
        how_to_validate: |
          Command or procedure to validate.
          Include expected metrics.
    
    quality_checklist:
      # Code quality criteria
      - criterion: "Code compiles without warnings"
        how_to_validate: |
          dotnet build --no-incremental
          
          Expected result: Build succeeded, 0 Warning(s)
      
      - criterion: "Code conventions followed"
        how_to_validate: |
          Code review or static analysis tool.
      
      - criterion: "Inline documentation present"
        how_to_validate: |
          Manual inspection or analysis tool.
    
    definition_of_done:
      # Summarized list of ALL criteria to consider the task DONE
      - "Mandatory criterion 1 met"
      - "Mandatory criterion 2 met"
      - "Mandatory criterion 3 met"
      - "All tests passing"
      - "Documentation updated"
      - "Code review approved"
  
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 6. REFERENCE CONTEXT - Examples and documentation
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Links, examples, and supporting documentation
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  reference_context:
    project_code_examples:
      # Code examples from within the project itself
      - file: "path/to/file"
        description: "Description of what the file demonstrates"
        relevance: |
          Why this example is relevant to this task.
          Which parts should be followed as a reference.
        relevant_lines: "X-Y"  # Optional: specify lines
    
    external_documentation:
      # Links to official documentation and external resources
      - title: "Documentation Title"
        url: "https://link.to/documentation"
        type: "official_documentation"  # official_documentation | tutorial | blog | stackoverflow
        relevance: |
          Why this documentation is relevant.
          Which sections are most important.
    
    internal_documentation:
      # Documentation from the project itself
      - file: "path/to/doc.md"
        description: "Description of the document"
        relevant_section: "Section Name"  # Optional
    
    relevant_tutorials:
      # Relevant step-by-step tutorials
      - title: "Tutorial Title"
        url: "https://link.to/tutorial"
        type: "tutorial"
        topics_covered:
          - "Topic 1"
          - "Topic 2"
    
    similar_project_patterns:
      # References to similar existing implementations in the project
      - description: "Existing similar implementation"
        location: "path/to/implementation"
        how_to_adapt: |
          How to adapt this implementation for the current task.
  
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 7. RISKS AND TROUBLESHOOTING
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Known risks and solutions for common problems
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  risks_and_troubleshooting:
    identified_risks:
      - id: "risk-mt-XXX-YYY-001"
        type: "technical"  # technical | business | resources | schedule
        description: "Description of the identified risk"
        probability: "medium"  # low | medium | high
        impact: "high"  # low | medium | high
        mitigation:
          strategy: "Strategy to mitigate the risk"
          actions:
            - "Preventive action 1"
            - "Preventive action 2"
    
    common_troubleshooting:
      # List of common problems and their solutions
      - error: "Error message or description"
        likely_cause: "Most likely cause of the error"
        solution: |
          Steps to resolve the problem.
          
          1. First step
          2. Second step
          3. Final verification
      
      - error: "Another common error"
        likely_cause: "Likely cause"
        solution: |
          Detailed solution.
  
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 8. EXECUTION INSTRUCTIONS - Step by Step
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Complete, sequential guide to execute the task
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  execution_instructions: |
    ═══════════════════════════════════════════════════════════════════
    EXECUTIVE SUMMARY - mt-XXX-YYY
    ═══════════════════════════════════════════════════════════════════
    
    OBJECTIVE:
    Clear and concise description of the task's objective.
    What must be delivered by the end.
    
    ESTIMATED TIME: X hours
    
    COMPLEXITY: low | medium | high
    
    POINTS OF ATTENTION:
    - Critical point 1
    - Critical point 2
    - Critical point 3
    
    ───────────────────────────────────────────────────────────────────
    PREREQUISITES
    ───────────────────────────────────────────────────────────────────
    
    Before starting, verify:
    
    [ ] Dependency 1 completed (mt-XXX-YYY)
    [ ] Tool X installed (verify: command --version)
    [ ] Service Y running (verify: verification command)
    [ ] Environment configured correctly
    
    ───────────────────────────────────────────────────────────────────
    STEP 1: [Step Name]
    ───────────────────────────────────────────────────────────────────
    
    1.1. Sub-step description:
         ```bash
         command to run
         ```
         
         Expected result: description
    
    1.2. Another sub-step:
         ```bash
         another command
         ```
    
    ───────────────────────────────────────────────────────────────────
    STEP 2: [Step Name]
    ───────────────────────────────────────────────────────────────────
    
    2.1. Sub-step description:
         - Detail A
         - Detail B
         
         Code example:
         ```csharp
         // Sample code
         public class Example { }
         ```
    
    2.2. Intermediate validation:
         ```bash
         validation command
         ```
         
         Expected result: description
    
    ───────────────────────────────────────────────────────────────────
    STEP 3: [Step Name]
