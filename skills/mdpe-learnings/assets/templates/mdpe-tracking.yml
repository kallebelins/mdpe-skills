# ============================================================================
# INSTRUÇÕES DE USO
# ============================================================================

# 1. CRIAR ARQUIVO:
#    Copiar este template para: mdpe-tracking.yml na raiz do projeto
#
# 2. ATUALIZAR MANUALMENTE:
#    - Ao iniciar tarefa: adicionar started_at, mudar status para in_progress
#    - Ao concluir: adicionar completed_at, mudar status para done
#    - Ao bloquear: adicionar blocked_since, blocked_reason
#
# 3. ATUALIZAR VIA SCRIPT:
#    python3 tools/mdpe-status.py update --task MT-XXX --status done
#
# 4. GERAR RELATÓRIOS:
#    python3 tools/mdpe-status.py report
#    python3 tools/mdpe-status.py report --by-executor
#    python3 tools/mdpe-status.py report --bottlenecks
#
# 5. INTEGRAÇÃO CI/CD:
#    - Workflow atualiza automaticamente ao fazer merge de PR
#    - Ver: .github/workflows/mdpe-tracking-update.yml
#
# 6. VERSIONAMENTO:
#    - Commitar sempre que atualizar
#    - Git history mostra evolução do sprint
#
# 7. DASHBOARD (opcional):
#    - Importar em Grafana, Metabase ou similar
#    - Visualizar métricas em tempo real

