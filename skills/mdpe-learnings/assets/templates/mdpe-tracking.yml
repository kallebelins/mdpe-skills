  total_tasks: 15
  completed: 5
  in_progress: 3
  blocked: 2
  pending: 5
  
  # By executor
  by_executor:
    human:
      completed: 2
      in_progress: 1
      blocked: 1
      pending: 2
      avg_completion_time: "3h"
      avg_quality_score: 0.88
      
    ai:
      completed: 3
      in_progress: 1
      blocked: 0
      pending: 2
      avg_completion_time: "1.2h"
      avg_quality_score: 0.93
      
    hybrid:
      completed: 0
      in_progress: 1
      blocked: 0
      pending: 1
      avg_completion_time: null
      avg_quality_score: null
  
  # By task type
  by_type:
    code: 6
    test: 3
    documental: 2
    architecture: 3
    validation: 1
  
  # By priority
  by_priority:
    critical: 1
    high: 3
    medium: 8
    low: 3
  
  # Throughput
  throughput:
    completed_last_7_days: 5
    completed_this_sprint: 5
    velocity_story_points: 12
    avg_cycle_time: "2.1h"
    avg_lead_time: "4.5h"
  
  # Quality
  quality:
    avg_quality_score: 0.92
    tasks_approved_first_try: 4
    tasks_rejected: 1
    tasks_rework: 1
    rejection_rate: 0.17  # 1/6
    test_coverage_avg: 0.82
  
  # Blockers
  blockers:
    active_blockers: 2
    total_blockers_this_sprint: 3
    avg_blocker_resolution_time: "6h"
    longest_blocker: "12h"
    blockers_by_type:
      decision-required: 1
      dependency: 1
      technical-issue: 0
      external-dependency: 0

# ============================================================================
# SPRINT EVENTS
# ============================================================================

events:
  - date: "2025-11-10T09:00:00Z"
    type: sprint_start
    description: "Start of Sprint 01"
    participants: ["john-smith", "mary-santos", "peter-costa", "anna-oliveira"]
    
  - date: "2025-11-10T11:00:00Z"
    type: blocker_raised
    task_id: MT-004
    description: "Pending architectural decision"
    escalated_to: "PO"
    
  - date: "2025-11-10T14:30:00Z"
    type: daily_standup
    duration: "15min"
    attendance: 5
    
  - date: "2025-11-09T16:00:00Z"
    type: task_rejected
    task_id: MT-006
    reason: "Security flaw in the RBAC logic"
    rejected_by: "mary-santos"

# ============================================================================
# ALERTS AND WARNINGS
# ============================================================================

alerts:
  - type: warning
    severity: medium
    message: "2 active blockers - above the recommended limit (1)"
    action_required: "Prioritize blocker resolution in the next daily standup"
    
  - type: info
    severity: low
    message: "Velocity stable at 12 story points"
    action_required: null

# ============================================================================
# DEPENDENCIES AND GRAPH
# ============================================================================

dependency_graph:
  # Dependency representation for visualization
  nodes:
    - id: MT-001
      status: done
    - id: MT-002
      status: done
    - id: MT-003
      status: in_progress
    - id: MT-004
      status: blocked
    - id: MT-005
      status: pending
  
  edges:
    - from: MT-001
      to: MT-002
    - from: MT-001
      to: MT-003
    - from: MT-002
      to: MT-003
    - from: MT-004
      to: MT-005

# ============================================================================
# CONFIGURATION AND METADATA
# ============================================================================

config:
  tracking_version: "1.0.0"
  last_updated: "2025-11-10T15:00:00Z"
  updated_by: "mdpe-bot"
  auto_update: true
  
  # Integrations
  integrations:
    github:
      enabled: true
      repo: "org/project"
      sync_on_pr_merge: true
    
    slack:
      enabled: true
      channel: "#mdpe-tracking"
      notify_on_events: ["blocker_raised", "task_rejected"]
  
  # Automatic calculations
  auto_calculations:
    - "avg_completion_time"
    - "velocity_story_points"
    - "rejection_rate"
    - "blocker_duration"

# ============================================================================
# USAGE INSTRUCTIONS
# ============================================================================

# 1. CREATE THE FILE:
#    Copy this template to: mdpe-tracking.yml at the project root
#
# 2. UPDATE MANUALLY:
#    - When starting a task: add started_at, change status to in_progress
#    - When completing: add completed_at, change status to done
#    - When blocked: add blocked_since, blocked_reason
#
# 3. UPDATE VIA SCRIPT:
#    python3 tools/mdpe-status.py update --task MT-XXX --status done
#
# 4. GENERATE REPORTS:
#    python3 tools/mdpe-status.py report
#    python3 tools/mdpe-status.py report --by-executor
#    python3 tools/mdpe-status.py report --bottlenecks
#
# 5. CI/CD INTEGRATION:
#    - Workflow updates automatically when a PR is merged
#    - See: .github/workflows/mdpe-tracking-update.yml
#
# 6. VERSIONING:
#    - Always commit after updating
#    - Git history shows the sprint's evolution
#
# 7. DASHBOARD (optional):
#    - Import into Grafana, Metabase, or similar
#    - Visualize metrics in real time

