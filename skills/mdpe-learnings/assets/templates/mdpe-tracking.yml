# MDPE Tracking - Micro-Task Tracking Template

# Based on: framework/12-gestao-paralela-humano-ia.md - Solution 2.2
# Usage: Tracking file versioned in Git
# Suggested location: project root or .mdpe/

# ============================================================================
# PROJECT INFORMATION
# ============================================================================

project_name: "[Project Name]"
repository: "[Git repository URL]"
sprint: "Sprint XX"
period: "YYYY-MM-DD to YYYY-MM-DD"
team_size: 5

team_members:
  - id: "john-smith"
    name: "John Smith"
    role: "Senior Developer"
    autonomy_level: "L2_assisted"
    
  - id: "mary-santos"
    name: "Mary Santos"
    role: "Tech Lead"
    autonomy_level: "L3_monitored"
    
  - id: "peter-costa"
    name: "Peter Costa"
    role: "Junior Developer"
    autonomy_level: "L1_supervised"
    
  - id: "anna-oliveira"
    name: "Anna Oliveira"
    role: "Architect"
    autonomy_level: "L3_monitored"

# ============================================================================
# MICRO-TASKS
# ============================================================================

microtasks:
  # ===== EXAMPLE: Task Completed by a Human =====
  - id: MT-001
    title: "Create database schema for users"
    feature_origin: feature-001
    executor: human
    assigned_to: "john-smith"
    status: done
    type: architecture
    priority: high
    
    # Timestamps
    created_at: "2025-11-10T09:00:00Z"
    started_at: "2025-11-10T09:00:00Z"
    completed_at: "2025-11-10T11:30:00Z"
    
    # Validation
    validation_type: peer-review
    validated_by: "mary-santos"
    validation_status: approved
    validation_notes: "Well-structured schema, approved"
    
    # Generated artifacts
    artifacts:
      - "db/migrations/001_create_users_table.sql"
      - "docs/adr/ADR-005-user-schema.md"
    
    # Metrics
    effort_estimated: "2h"
    effort_actual: "2.5h"
    quality_score: 0.90
    
    # Notes
    notes: "Added an email_verified field that wasn't originally planned, after discussion with the PO"
  
  # ===== EXAMPLE: Task Completed by AI =====
  - id: MT-002
    title: "Implement GET /users endpoint"
    feature_origin: feature-001
    executor: ai
    ai_tool: "gpt-4"
    ai_session_id: "session-abc123"
    status: done
    type: code
    priority: medium
    
    # Timestamps
    created_at: "2025-11-10T11:30:00Z"
    started_at: "2025-11-10T12:00:00Z"
    completed_at: "2025-11-10T13:00:00Z"
    
    # Validation
    validation_type: auto
    validation_status: approved
    auto_checks_passed:
      - linting
      - unit_tests
      - coverage_80
      - security_scan
    
    # Artifacts
    artifacts:
      - "src/controllers/UserController.cs"
      - "tests/UserController.test.cs"
    
    # Metrics
    effort_estimated: "1h"
    effort_actual: "1h"
    quality_score: 0.95
    code_lines_generated: 120
    test_coverage: 0.85
    
    # Notes
    notes: "The AI generated high-quality code on the first attempt, with no corrections needed"
  
  # ===== EXAMPLE: Task In Progress (Hybrid) =====
  - id: MT-003
    title: "Create OpenAPI documentation for /users"
    feature_origin: feature-001
    executor: hybrid
    human_contributor: "peter-costa"
    ai_tool: "copilot"
    status: in_progress
    type: documental
    priority: medium
    
    # Timestamps
    created_at: "2025-11-10T13:00:00Z"
    started_at: "2025-11-10T14:00:00Z"
    
    # Dependencies
    dependencies: ["MT-001", "MT-002"]
    
    # Planned validation
    validation_type: peer-review
    
    # Planned artifacts
    artifacts:
      - "docs/api/users-api.yml"
    
    # Metrics
    effort_estimated: "1.5h"
    progress_percentage: 60
    
    # Notes
    notes: "Peter is using Copilot to generate the spec, reviewing it manually"
  
  # ===== EXAMPLE: Blocked Task =====
  - id: MT-004
    title: "Review authentication architecture"
    feature_origin: feature-002
    executor: human
    assigned_to: "anna-oliveira"
    status: blocked
    type: architecture
    priority: critical
    
    # Timestamps
    created_at: "2025-11-10T09:00:00Z"
    started_at: "2025-11-10T10:00:00Z"
    blocked_since: "2025-11-10T11:00:00Z"
    
    # Blocker
    blocked_reason: "Waiting on the PO's decision between OAuth and JWT"
    blocker_type: decision-required
    escalated_to: "product-owner"
    escalated_at: "2025-11-10T12:00:00Z"
    
    # Metrics
    effort_estimated: "3h"
    blocker_duration: "3h"  # calculated automatically
  
  # ===== EXAMPLE: Pending Task with Dependencies =====
  - id: MT-005
    title: "Generate E2E tests for the login flow"
    feature_origin: feature-002
    executor: ai
    ai_tool: "playwright-codegen"
    status: pending
    type: test
    priority: low
    
    # Timestamps
    created_at: "2025-11-10T09:00:00Z"
    
    # Dependencies
    dependencies: ["MT-004"]
    dependencies_status:
      MT-004: blocked
    
    # Planned validation
    validation_type: auto
    
    # Metrics
    effort_estimated: "2h"
    
    # Notes
    notes: "Waiting on MT-004 to be resolved before starting"
  
  # ===== EXAMPLE: Rejected Task (Rework) =====
  - id: MT-006
    title: "Implement RBAC authorization middleware"
    feature_origin: feature-002
    executor: ai
    ai_tool: "gpt-4"
    status: in_progress
    type: code
    priority: high
    
    # Timestamps
    created_at: "2025-11-09T14:00:00Z"
    started_at: "2025-11-09T15:00:00Z"
    first_completion_at: "2025-11-09T16:00:00Z"
    restarted_at: "2025-11-10T09:00:00Z"
    
    # Validation
    validation_type: peer-review
    validation_attempts: 1
    validation_status: rejected
    validated_by: "mary-santos"
    validation_notes: "Insecure role logic, redo using whitelisting instead of blacklisting"
    
    # Artifacts
    artifacts:
      - "src/middleware/AuthorizationMiddleware.cs"
    
    # Metrics
    effort_estimated: "2h"
    effort_actual: "3h"  # including rework
    rework_count: 1
    
    # Notes
    notes: "First version rejected due to a security flaw. AI is regenerating with a new approach."

# ============================================================================
# AGGREGATED METRICS
# ============================================================================

