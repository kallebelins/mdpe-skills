# ====================================================================
# MDPE Framework - Validation Report - Template
# ====================================================================
# Version: 2.0.0
# Skill: mdpe-coding (Execution - Produce / Proof)
# Decision of record: docs/adr/adr-003-loop-engineering.md
#
# Save to:
#   docs/transformation/{feature-id}/execution/{microtask-id}-validation.yml
#
# ONE report per micro-task, accumulating every loop iteration.
# NOT one report per attempt - that is what makes iterations_to_green
# a derivable metric.
#
# --------------------------------------------------------------------
# OBLIGATION LEGEND (per field, in comments)
#   [E] essential    - the report is invalid without it
#   [C] conditional  - required only in the stated situation
#   [O] optional     - fill only if it carries real content
# Blocks marked [C] / [O] are created LAZILY: no content -> no block.
# Delete every block that does not apply. A deleted block is correct;
# a block filled by deduction is fabricated content.
#
# --------------------------------------------------------------------
# HARD RULES (the template exists to enforce these)
#   1. status: pass requires >=1 evidence entry with exit_code: 0.
#      No evidence -> the only legal value is pending.
#   2. Evidence ages. run_at must be LATER than
#      metadata.last_in_scope_commit. Old green does not close anything.
#   3. NO NUMERIC DEFAULTS. A metric with no measurement is an ABSENT
#      LINE, never 0. A 0 presented as a measurement is fabricated
#      evidence - the worst failure mode of this artifact.
#   4. NO INVENTED COMMANDS. Resolve through the Phase 0 chain
#      (micro-task how_to_verify -> setup.yml -> repo manifest ->
#      ad-NNN verification -> brownfield inventory -> ask the user),
#      or mark not_verifiable with a reason.
#   5. No TBD, no placeholder left behind, no nonexistent path.
#   6. Self-review (Phase 1 sub-phase 5) marks NOTHING.
#   7. pending anywhere blocks any verdict.
#      not_verifiable never means approved.
#   8. Dimensions 1 (tests) and 3 (acceptance criteria) may NOT close
#      as not_verifiable. Exception: a micro-task with no code output
#      may mark dimension 1 not_applicable with a reason.
#
# STATUS VOCABULARY (one value, no blanks, no sixth value)
#   pass            verified successfully        -> needs exit_code: 0
#   fail            verified and failed          -> needs failure evidence
#   not_applicable  does not apply here          -> needs reason derivable
#                                                   from the contract
#   not_verifiable  applies, no way to check     -> needs reason + follow_up
#   pending         has not run yet              -> blocks any verdict
# ====================================================================

validation_report:

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # METADATA  [E]
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  metadata:
    microtask_id: "mt-XXX-YYY"                  # [E]
    feature_id: "feat-XXX"                      # [E]
    title: "{micro-task title, as in the contract}"   # [E]
    branch: "feature/feat-XXX/mt-XXX-YYY"       # [E]
    validated_at: "{YYYY-MM-DD HH:MM}"          # [E]
    executor: "{who ran it - agent or person}"  # [E]

    # [E] The freshness anchor. Every run_at below must be LATER than
    # this. Without it there is no way to tell current evidence from
    # evidence collected before the last change.
    last_in_scope_commit: "{short sha}  {subject line}"

    architecture_decisions_in_scope: []         # [C] ["ad-003", "ad-007"] - when decisions.yml exists

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # VERIFICATION PLAN  [E]
  # Written and FROZEN before the first line of implementation.
  # Its job: decide what proves what BEFORE the result is known, so
  # "loop until green" cannot degenerate into "move the target".
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  verification_plan:
    frozen_at: "{YYYY-MM-DD HH:MM, before implementation}"   # [E]

    entries:                                    # [E] >=1
      - target: "crit-001"                      # [E] criterion id, or "dimension:static_analysis"
        command: "{the command that proves it}" # [E]
        command_source: "microtask_how_to_verify"  # [E] microtask_how_to_verify | setup_yml |
                                                   #     repo_manifest | ad-NNN | inventory | user
        source_ref: "quality_criteria.functional[0].how_to_verify"  # [E] the field it came from
        proves: "{what a zero exit code demonstrates}"              # [E]

    unresolved:                                 # [C] only when a target has no command
      - target: "crit-004"
        reason: "{why no command exists - no tool, no authorization, no harness}"
        follow_up: "{what would make it verifiable, and who does it}"

    amendments:                                 # [C] only when the frozen plan changed
      - iteration: "i2"                         # [E] which iteration changed it
        change: "{what changed - command, target, filter}"
        reason: "{why - a discovery, not a convenience}"

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # DIMENSION 1: AUTOMATED TESTS  [E]
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  automated_tests:
    status: "pending"                           # [E] see status vocabulary

    evidence:                                   # [E] when status is pass or fail
      - command: "{the command AS EXECUTED}"    # [E]
        exit_code: "{the real exit code - an integer, from the actual run}"
        result: "{success | failure - DERIVED from exit_code, not from impression}"
        output_summary: "{the excerpt that sustains the conclusion: test counts, the error}"  # [E]
        run_at: "{YYYY-MM-DD HH:MM or commit sha}"   # [E] must postdate last_in_scope_commit
        artifact: "{path of a report/log actually generated}"   # [C] only if it really exists

    # [O] ONLY lines actually measured. Delete every line you did not
    # measure. Do NOT write 0 to mean "not measured" - see hard rule 3.
    metrics:
      # total_tests:
      # passing_tests:
      # failing_tests:
      # line_coverage:        # % - record when the project measures it; not a gate
      # branch_coverage:      # %
      # execution_time_seconds:

    red_evidence:                               # [O] TDD RED - the strongest fidelity proof, never required
      command: "{the test command run BEFORE the implementation}"
      exit_code: "{the real exit code of the failing run}"
      output_summary: "{the failure that the implementation then fixed}"
      run_at: "{must PREDATE the implementation commit}"

    missing_tests:                              # [O] a real gap you chose not to close now
      - test: "{what is not covered}"
        type: "unit"                            # unit | integration | e2e
        reason: "{why it is missing}"

    flaky_tests:                                # [C] mandatory when a test was unstable
      - test: "{test name}"
        observed: "{failed on i2, passed on i3 with no code change}"
        cause: "{known cause, or unknown}"
        action: "{what was done or deferred}"

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # DIMENSION 2: STATIC ANALYSIS  [E]
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  static_analysis:
    status: "pending"                           # [E]

    evidence:                                   # [E] when pass or fail
      - command: "{lint / format / type-check / build as executed}"
        exit_code: "{the real exit code - an integer, from the actual run}"
        result: "{success | failure - DERIVED from exit_code, not from impression}"
        output_summary: "{errors and warnings as reported}"
        run_at: "{YYYY-MM-DD HH:MM or commit sha}"

    # [O] Only what a tool present in THIS project actually reported.
    # No tool -> delete the block. Never a number by estimation.
    reported:
      # errors:
      # warnings:
      # cyclomatic_complexity_max:
      # duplication_percentage:
      # tool: "{the tool actually configured in this repo}"

    findings:                                   # [C] only real findings
      - finding: "{what the tool reported}"
        location: "{path/to/file.ext:line}"     # [E] real path, real line
        type: "code_smell"                      # code_smell | vulnerability | bug | duplication
        severity: "high"                        # low | medium | high | critical
        resolved: false
        resolution: "{what was done, when resolved}"   # [C]

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # DIMENSION 3: ACCEPTANCE CRITERIA  [E]
  # The fidelity dimension. Every criterion of the contract appears
  # here - a criterion declared in the micro-task and absent from this
  # list is a fidelity failure EVEN WITH EVERYTHING ELSE GREEN.
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  acceptance_criteria:
    status: "pending"                           # [E]

    criteria:                                   # [E] one entry per criterion in the contract
      - id: "crit-001"                          # [E]
        criterion: "{the criterion, quoted from the micro-task}"   # [E]
        source: "quality_criteria.functional[0]"                   # [E] where it comes from
        status: "pending"                       # [E] pass | fail | not_applicable | not_verifiable | pending

        evidence:                               # [E] when pass or fail
          - command: "{the command from the frozen plan}"
            exit_code: "{the real exit code - an integer, from the actual run}"
            result: "{success | failure - DERIVED from exit_code, not from impression}"
            output_summary: "{what proves this criterion specifically}"
            run_at: "{YYYY-MM-DD HH:MM or commit sha}"

        manual_verification:                    # [C] only when there is no automated command
          procedure: "{the steps performed}"    # [E] within this block
          observed_result: "{what was observed}"                    # [E]
          artifact: "{path/to/log-or-capture - must really exist}"  # [E]

        reason: "{required for not_applicable / not_verifiable}"    # [C]
        follow_up: "{required for not_verifiable}"                  # [C]

    # [E] The fidelity count. Counted, never estimated - the numbers
    # come from the micro-task contract and the list above, and the
    # first two MUST be equal. A leftover 0 would satisfy that check
    # falsely, which is why none of them ships pre-filled.
    coverage:
      declared_in_contract: "{count of quality_criteria items in the micro-task}"   # [E]
      reported_here: "{count of entries above - MUST equal declared_in_contract}"  # [E]
      passing: "{count}"                        # [E]
      failing: "{count}"                        # [E]
      not_applicable: "{count}"                 # [E]
      not_verifiable: "{count}"                 # [E]

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # DIMENSION 4: PERFORMANCE  [C]
  # Applies ONLY when the micro-task declares a performance budget
  # (output.expected_metrics or a non_functional criterion with a
  # number). Otherwise: status not_applicable + reason, and DELETE
  # everything below it. Do not invent a budget to have one.
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  performance:
    status: "not_applicable"                    # [E]
    reason: "{derivable from the contract - e.g. no declared budget}"   # [C] for not_applicable

    budget: "{the number the contract declares, quoted}"   # [C] only when there is one
    measured: "{the number actually observed}"             # [C] only when measured
    meets_budget: false                                    # [C] only when both above exist

    evidence:                                   # [C] when measured
      - command: "{the benchmark/measurement command as executed}"
        exit_code: "{the real exit code - an integer, from the actual run}"
        result: "{success | failure - DERIVED from exit_code, not from impression}"
        output_summary: "{the numbers, as reported by the tool}"
        run_at: "{YYYY-MM-DD HH:MM or commit sha}"
        artifact: "{path of the generated report}"

    bottlenecks:                                # [O] only when observed with evidence
      - description: "{what is slow}"
        location: "{path/to/file.ext:line}"
        measured_impact: "{the number that shows it}"

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # DIMENSION 5: SECURITY  [E]
  # Applies to WHAT THE OUTPUT ACTUALLY EXPOSES. A micro-task with no
  # endpoint, no input surface and no secret handling is
  # not_applicable with a reason - one line, not a filled matrix.
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  security:
    status: "pending"                           # [E]
    reason: "{required for not_applicable / not_verifiable}"   # [C]

    surface: "{what this output exposes: HTTP endpoint, file upload, DB query, none}"   # [E]

    checks:                                     # [C] ONLY the checks the surface justifies
      - check: "{e.g. input validation on the new endpoint}"
        status: "pass"                          # pass | fail | not_applicable | not_verifiable
        evidence:
          - command: "{the test or scan as executed}"
            exit_code: "{the real exit code - an integer, from the actual run}"
            result: "{success | failure - DERIVED from exit_code, not from impression}"
            output_summary: "{what it reported}"
            run_at: "{YYYY-MM-DD HH:MM or commit sha}"

    vulnerabilities:                            # [C] only real findings
      - type: "{e.g. sql_injection}"
        severity: "critical"                    # low | medium | high | critical
        location: "{path/to/file.ext:line}"
        description: "{what is exploitable and how}"
        resolved: false
        resolution: "{the fix applied}"         # [C]

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # DIMENSION 6: INTEGRATION  [E]
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  integration:
    status: "pending"                           # [E]
    reason: "{required for not_applicable / not_verifiable}"   # [C]

    evidence:                                   # [E] when pass or fail
      - command: "{integration test command as executed}"
        exit_code: "{the real exit code - an integer, from the actual run}"
        result: "{success | failure - DERIVED from exit_code, not from impression}"
        output_summary: "{tests run, components exercised}"
        run_at: "{YYYY-MM-DD HH:MM or commit sha}"

    contract_compatibility:                     # [C] only when the output has a public contract
      contract: "{path to the schema/spec - must exist}"
      breaking_changes: []                      # [E] within this block - list, or empty
      evidence: "{command or inspection that establishes it}"

    findings:                                   # [C] only real findings
      - finding: "{what broke or misbehaved}"
        component: "{the dependent component}"
        location: "{path/to/file.ext:line}"
        severity: "high"
        resolved: false

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # LOOP  [E]
  # plan -> act -> verify -> repair, with a counter and a limit.
  # i1 is the FIRST verification, not a repair. Each repair ->
  # re-verify cycle is i2, i3, i4. A failing i4 is an OVERRUN.
  # The counter resets ONLY when the micro-task contract changes
  # (re-decomposition, or a revise in mdpe-architecture). Rewriting
  # the implementation resets nothing.
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  loop:
    limit: 4                                    # [E] 1 verification + up to 3 repairs (the contract's constant)
    iterations_to_green: "{i1..i4 - the iteration that closed green; null when blocked}"   # [E]
    overrun: false                              # [E] true -> root_cause_diagnosis is mandatory

    iterations:                                 # [E] i1 always; i2+ [C] only if it took more
      - id: "i1"                                # [E]
        kind: "verification"                    # [E] verification | repair
        failed:                                 # [C] empty on a green i1
          - dimension: "automated_tests"
            criterion: "crit-002"               # [C] when the failure maps to a criterion
            symptom: "{what failed, from the command output}"
        action: "{what was done in this iteration}"        # [C] repairs only
        outcome: "green"                        # [E] green | failed | environment
        evidence_ref: "automated_tests.evidence[0]"        # [E] where the proof for this iteration lives

      # - id: "i2"
      #   kind: "repair"
      #   failed:
      #     - dimension: "automated_tests"
      #       criterion: "crit-002"
      #       symptom: "{the same symptom as i1 -> root_cause_diagnosis becomes MANDATORY
      #                  before a 3rd repair; a repeated symptom means the hypothesis is
      #                  wrong, not that the patch was too small}"
      #   action: "{the fix attempted}"
      #   outcome: "green"
      #   evidence_ref: "automated_tests.evidence[1]"

      # An environment/setup failure aborts the loop and routes to
      # mdpe-execution-context. Record it with outcome: environment -
      # it does NOT consume the repair budget, but only ONCE. A second
      # occurrence is an overrun.
      #
      # A flaky test cannot be turned green by repetition: re-running
      # the same command without changing code is a normal iteration,
      # and the instability goes in automated_tests.flaky_tests.

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # ROOT CAUSE DIAGNOSIS  [C]
  # Created ONLY when: the same symptom failed twice (mandatory before
  # a 3rd repair, replacing the next incremental attempt), or the limit
  # was overrun. Closed inside the limit -> DELETE this whole block.
  # On overrun: STOP EDITING CODE.
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # root_cause_diagnosis:
  #   symptom: "{what fails, with the command + output of the last iteration}"
  #   attempts:
  #     - iteration: "i2"
  #       tried: "{what was done}"
  #       why_it_did_not_resolve: "{the reason - not 'it still failed'}"
  #   hypothesis: "{ONE likely cause, pointing at path/to/file.ext:line, a contract, or a dependency}"
  #   evidence_gap: "{what could not be determined - unknown is a valid answer}"
  #   options:                                  # [C] when more than one path exists
  #     - option: "{a path forward}"
  #       cost: "{effort / risk}"
  #   route: "needs_redesign"                   # [E] needs_redesign -> mdpe-transformation
  #                                             #     needs_architecture -> mdpe-architecture (revise)
  #                                             #     needs_environment -> mdpe-execution-context
  #                                             #     needs_human -> human, with options

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # FIDELITY  [E]
  # Does the delivered output match the CONTRACT - not the impression
  # that it does. All three checks are conferrable.
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  fidelity:
    criteria_coverage_complete: false           # [E] acceptance_criteria.coverage.reported_here
                                                #     == declared_in_contract

    declared_outputs:                           # [E] one entry per output.generated_artifacts path
      - declared: "{path/to/artifact.ext, as declared in the micro-task}"
        exists: false                           # [E] a promised, nonexistent path FAILS
        note: "{only if the path changed - state where it actually landed and why}"   # [C]

    scope_adherence:
      within_declared_scope: true               # [E]
      out_of_scope_changes:                     # [C] delivering more than the contract is a
        - path: "{path/to/file.ext}"            #     deviation, not a bonus
          what: "{what was changed there}"
          why: "{why it was unavoidable}"

    trace_chain: |                              # [O] one line per criterion, when useful
      feat-XXX -> mt-XXX-YYY -> crit-001 -> {command} -> exit 0 -> {path/to/file.ext:line}

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # SUMMARY  [E]
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  summary:
    # [E] pending is the ONLY legal value while any dimension is pending.
    # blocked is a LEGITIMATE verdict: a blocked micro-task with a
    # documented root cause is a correct outcome of the process.
    # approved without green is not.
    overall_status: "pending"                   # approved | approved_with_reservations | blocked | pending

    dimension_status:                           # [E] mirrors the six dimensions above
      automated_tests: "pending"
      static_analysis: "pending"
      acceptance_criteria: "pending"
      performance: "pending"
      security: "pending"
      integration: "pending"

    # [E] Verdict rules, checked before writing overall_status:
    #   - any dimension pending          -> pending
    #   - automated_tests or acceptance_criteria fail -> blocked (never approved)
    #   - either of those two not_verifiable         -> blocked (they may not close that way)
    #   - overrun: true                  -> blocked + root_cause_diagnosis + route
    #   - all applicable pass, only Minor/Nitpick open -> approved_with_reservations
    #   - all applicable pass, nothing open           -> approved
    justification: |                            # [E]
      {Why this verdict, referencing the evidence. If blocked, name the
      blocker and the route. If approved with reservations, name each
      reservation and why it can wait.}

    blockers:                                   # [C] only when blocked
      - blocker: "{what prevents closing}"
        evidence_ref: "{where the proof is - dimension.evidence[n]}"
        route: "needs_redesign"

    reservations:                               # [C] only for approved_with_reservations
      - reservation: "{what is left open}"
        impact: "medium"                        # low | medium | high
        deferred_to: "{micro-task, backlog item, or follow-up}"

    not_verifiable_count: "{count across all dimensions and criteria}"   # [E] Phase 5 reads this as
                                                # verification COVERAGE, not quality. A high count is
                                                # visible on purpose - not_verifiable is not an escape hatch.

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # NEXT STEPS  [E]
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  next_steps:
    # [E] Name the SKILL and PHASE, never a legacy command file.
    next: "mdpe-coding Phase 3 - code review"
    # green + review clean          -> mdpe-learnings
    # fail inside the limit         -> mdpe-coding Phase 1 (repair, i+1)
    # overrun / blocked             -> the route in root_cause_diagnosis

    pull_request:                               # [C] when reaching review
      target_branch: "{non-main branch}"
      created: false

    follow_ups:                                 # [C] carries every not_verifiable forward
      - item: "{what stayed open}"
        origin: "{dimension or criterion id}"
        owner: "{agent or person}"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# HOW TO USE
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

usage:
  when: |
    Opened at Phase 0 of mdpe-coding (verification_plan, BEFORE any
    code), filled during Phase 2, and closed when the loop ends -
    green or blocked. Not a post-hoc write-up.

  order:
    - "Phase 0: metadata + verification_plan. Freeze the plan. Nothing else exists yet."
    - "Phase 1: implement. Record last_in_scope_commit at the end."
    - "Phase 2: run the applicable dimensions. Record evidence as each command returns."
    - "Failure inside the limit: append an iteration, repair, re-verify. Same symptom twice -> diagnose."
    - "Close: fidelity, then loop.iterations_to_green, then summary. In that order - the verdict comes last."
    - "Delete every [C] / [O] block with no real content."

  size_expectation: |
    A small micro-task produces a SHORTER report than fully filling the
    previous version of this template - and it is the first one that
    carries verifiable information. If your report is long because
    blocks were filled by deduction, delete them.

  self_check:
    - "Does every pass have an evidence entry with exit_code: 0?"
    - "Is every run_at later than metadata.last_in_scope_commit?"
    - "Does acceptance_criteria.coverage.reported_here equal declared_in_contract?"
    - "Does every path cited actually exist in the repository?"
    - "Is there any 0 that was not measured? Delete the line."
    - "Is there any TBD, any leftover {placeholder}, any pending?"
    - "Is loop.iterations_to_green recorded and <= limit?"
    - "Did any command come from outside the Phase 0 resolution chain?"

  related:
    skill: "skills/mdpe-coding/SKILL.md"
    decision_of_record: "docs/adr/adr-003-loop-engineering.md"
    review_template: "skills/mdpe-coding/assets/templates/code-review-template.yml"
    # Historical origin of this artifact (command CD-03) is documented in
    # docs/mapping-commands-to-skills.md. Those .txt command files do not
    # exist in this repository - do not reference them as next steps.

