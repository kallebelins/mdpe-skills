# ====================================================================
# MDPE Framework - Validation Report Template
# ====================================================================
# Version: 1.0.0
# Purpose: Template for the validation and testing report
# Phase: Coding (Operational - Proof)
# ====================================================================

validation_report:
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # METADATA
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  metadata:
    microtask_id: "mt-XXX-YYY"
    title: "Micro-task title"
    validation_date: "YYYY-MM-DD"
    executor: "Developer/reviewer name"
    feature_id: "feat-XXX"
    branch: "feature/feat-XXX/mt-XXX-YYY"
    
    validation_duration: "X hours"
    
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # DIMENSION 1: AUTOMATED TESTS
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  automated_tests:
    validated: false
    status: "pending"  # pass | fail | pending
    
    metrics:
      total_tests: 0
      passing_tests: 0
      failing_tests: 0
      success_percentage: 0
      
      line_coverage: 0  # % (target: > 80%)
      branch_coverage: 0  # % (target: > 70%)
      function_coverage: 0  # % (target: > 90%)
      statement_coverage: 0  # %
      
      mutation_score: 0  # % (target: > 70%)
      execution_time_seconds: 0
    
    missing_tests:
      - test: "Description of the missing test"
        type: "unit"  # unit | integration | e2e
        priority: "high"  # high | medium | low
        reason: "Why this test is needed"
    
    flaky_tests:
      - test: "Name of the unstable test"
        failure_frequency: "20%"
        cause: "Description of the cause"
        corrective_action: "Action to stabilize"
    
    commands_executed:
      - command: "dotnet test"
        result: "success"  # success | failure
        summarized_output: "Output summary"
      
      - command: "dotnet test --collect:\"XPlat Code Coverage\""
        result: "success"
        summarized_output: "Coverage: XX%"
    
    issues_found:
      - issue: "Description of the issue"
        severity: "high"  # low | medium | high | critical
        applied_solution: "Description of the solution"
        resolved: false
    
    evidence:
      - type: "screenshot"
        description: "Description of the evidence"
        location: "path/to/evidence.png"
      
      - type: "log"
        description: "Test log"
        location: "test-results/test-log.txt"
  
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # DIMENSION 2: STATIC ANALYSIS
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  static_analysis:
    validated: false
    status: "pending"  # pass | fail | pending
    
    linter:
      errors: 0  # target: 0
      warnings: 0  # target: 0
      command: "dotnet format --verify-no-changes"
      result: "success"  # success | failure
      details: []
    
    code_quality:
      critical_code_smells: 0  # target: 0
      major_code_smells: 0
      minor_code_smells: 0
      
      average_cyclomatic_complexity: 0  # target: < 10
      duplication_percentage: 0  # target: < 3%
      lines_of_code: 0
      debt_ratio_percentage: 0  # target: < 5%
      
      tool: "SonarQube"  # SonarQube | CodeClimate | ReSharper
      quality_gate: "passed"  # passed | failed | pending
    
    security:
      critical_vulnerabilities: 0  # target: 0
      high_vulnerabilities: 0  # target: 0
      medium_vulnerabilities: 0
      low_vulnerabilities: 0
      
      outdated_dependencies: 0
      dependencies_with_vulnerabilities: []
      
      tool: "Snyk"  # Snyk | OWASP Dependency Check | WhiteSource
      scan_executed: false
    
    critical_issues:
      - issue: "Description of the critical issue"
        file: "path/to/file"
        line: 0
        type: "code_smell"  # code_smell | vulnerability | bug | duplication
        required_action: "Description of the action"
        resolved: false
  
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # DIMENSION 3: ACCEPTANCE CRITERIA
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  acceptance_criteria:
    validated: false
    status: "pending"  # pass | fail | pending
    
    criteria:
      - id: "crit-001"
        description: "Description of the acceptance criterion"
        
        automated_test:
          implemented: false
          test_name: "Name of the test that validates this criterion"
          result: "pending"  # pass | fail | pending
        
        manual_test:
          executed: false
          result: "pending"
          procedure: "Description of the manual test procedure"
          evidence: "Description or path to evidence"
        
        status: "pending"  # met | not_met | partial | pending
        notes: "Observations about the criterion"
    
    total_criteria: 0
    criteria_met: 0
    criteria_not_met: 0
    partial_criteria: 0
    completion_percentage: 0
    
    issues:
      - criterion_id: "crit-001"
        issue: "Description of the issue"
        impact: "high"  # low | medium | high
        corrective_action: "Description of the action"
        resolved: false
  
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # DIMENSION 4: PERFORMANCE
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  performance:
    validated: false
    status: "pending"  # pass | fail | pending
    
    response_time:
      average_ms: 0  # target: < 200ms for APIs
      p95_ms: 0
      p99_ms: 0
      minimum_ms: 0
      maximum_ms: 0
      
      target_ms: 200
      meets_target: false
    
    throughput:
      requests_per_second: 0
      target: 0
      meets_target: false
    
    resources:
      memory_mb: 0
      peak_memory_mb: 0
      cpu_percentage: 0
      peak_cpu_percentage: 0
      disk_io_mb_s: 0
      
      thresholds:
        max_memory_mb: 512
        max_cpu_percentage: 80
    
    memory_leaks:
      detected: false
      description: "Description of memory leaks if detected"
      location: []
      tool: "dotMemory"  # dotMemory | ANTS | Visual Studio Profiler
    
    bottlenecks:
      - description: "Description of the identified bottleneck"
        location: "file.cs:line"
        impact: "high"  # low | medium | high
        time_spent_ms: 0
        percentage_of_total: 0
    
    suggested_optimizations:
      - optimization: "Description of the optimization"
        estimated_gain: "XX ms or YY%"
        complexity: "medium"  # low | medium | high
        priority: "medium"  # low | medium | high
    
    commands_executed:
      - command: "dotnet run --project Benchmarks"
        tool: "BenchmarkDotNet"
        result: "success"
        report: "path/to/report"
  
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # DIMENSION 5: SECURITY
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  security:
    validated: false
    status: "pending"  # pass | fail | pending
    
    checklist:
      inputs_validated: false
      outputs_sanitized: false
      authentication_verified: false
      authorization_verified: false
      secrets_not_exposed: false
      https_enforced: false
      rate_limiting: false  # if applicable
      cors_csp_configured: false  # if applicable
    
    security_tests:
      sql_injection:
        executed: false
        result: "pending"  # pass | fail | pending
        tool: "Manual"
        details: ""
      
      xss:
        executed: false
        result: "pending"
        tool: "Manual"
        details: ""
      
      csrf:
        executed: false
        result: "pending"
        tool: "Manual"
        details: ""
      
      authentication_bypass:
        executed: false
        result: "pending"
        tool: "Manual"
        details: ""
      
      authorization_bypass:
        executed: false
        result: "pending"
        tool: "Manual"
        details: ""
    
    vulnerabilities_found:
      - type: "sql_injection"  # sql_injection | xss | csrf | auth_bypass | etc
        severity: "critical"  # low | medium | high | critical
        description: "Description of the vulnerability"
        location: "file.cs:line"
        corrective_action: "Description of the applied fix"
        resolved: false
  
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # DIMENSION 6: INTEGRATION AND COMPATIBILITY
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  integration_compatibility:
    validated: false
    status: "pending"  # pass | fail | pending
    
    integration_tests:
      total: 0
      passing: 0
      failing: 0
      success_percentage: 0
      
      commands_executed:
        - command: "dotnet test --filter Category=Integration"
          result: "success"
          output: ""
    
    api_contracts:
      validated_against_schema: false
      schema_location: "openapi.yaml"
      backward_compatible: false
      breaking_changes: []
    
    compatibility:
      tested_dev: false
      tested_staging: false
      tested_browsers: []  # if web: ["Chrome", "Firefox", "Safari", "Edge"]
      tested_os: []  # if applicable: ["Windows", "Linux", "macOS"]
    
    logs_monitoring:
      logs_configured: false
      log_level: "Information"  # Trace | Debug | Information | Warning | Error | Critical
      metrics_collected: false
      available_metrics: []
      alerts_configured: false
    
    integration_issues:
      - issue: "Description of the integration issue"
        component: "Name of the affected component"
        severity: "high"  # low | medium | high
        corrective_action: "Description of the fix"
        resolved: false
  
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # VALIDATION SUMMARY
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  summary:
    overall_status: "pending"  # approved | approved_with_reservations | rejected | pending
    
    dimensions_validated: 0  # Total dimensions validated (out of 6)
    dimensions_failed: 0
    
    critical_issues: 0
    non_critical_issues: 0
    suggested_improvements: 0
    
    decision: "pending"  # ready_for_review | needs_fixes | needs_redesign | pending
    
    justification: |
      Justification for the decision made.
      If rejected, list the blockers.
      If approved with reservations, list the reservations.
    
    blockers:
      - blocker: "Description of the blocker"
        severity: "critical"
        required_action: "Action to unblock"
    
    reservations:
      - reservation: "Description of the reservation"
        impact: "medium"  # low | medium | high
        can_be_resolved_later: true
  
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # OBSERVATIONS AND LEARNINGS
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  observations:
    issues_found:
      - issue: "Description of the issue"
        impact: "Description of the impact"
        resolution: "How it was resolved"
    
    lessons_learned:
      - lesson: "Description of the lesson learned"
        category: "technical"  # technical | process | communication
        applicability: "Where it can be applied in the future"
    
    process_improvements:
      - improvement: "Description of a process improvement"
        benefit: "Expected benefit"
        effort: "low"  # low | medium | high
    
    additional_documentation:
      - document: "Description of the generated document"
        location: "path/to/document"
        type: "technical"  # technical | user | operational
  
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # NEXT STEPS
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  next_steps:
    next_command: ""  # 14-cd-04-code-review.txt | 12-cd-02-implementation.txt
    
    pending_actions:
      - action: "Description of the pending action"
        responsible: "Responsible name"
        deadline: "YYYY-MM-DD"
        priority: "high"  # low | medium | high
        blocking: false
    
    code_review_preparation:
      pull_request_created: false
      full_description: false
      reviewers_assigned: false
      labels_applied: false

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# USAGE INSTRUCTIONS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

usage_instructions:
  description: |
    This template should be filled in AFTER implementation and after
    running all validation tests. It is the proof that the micro-task
    was completed with quality.
  
  when_to_use: |
    - After completing the implementation of a micro-task
    - Before opening a Pull Request
    - Before requesting code review
    - To document validation results
  
  validation_flow:
    dimension_1:
      name: "Automated Tests"
      commands:
        - "dotnet test"
        - "dotnet test --collect:\"XPlat Code Coverage\""
      target_metrics:
        line_coverage: ">= 80%"
        branch_coverage: ">= 70%"
        failing_tests: "0"
    
    dimension_2:
      name: "Static Analysis"
      commands:
        - "dotnet format --verify-no-changes"
        - "dotnet build /warnaserror"
      tools: ["SonarQube", "ReSharper", "Roslyn Analyzers"]
      target_metrics:
        errors: "0"
        warnings: "0"
        critical_code_smells: "0"
        cyclomatic_complexity: "< 10"
    
    dimension_3:
      name: "Acceptance Criteria"
      actions:
        - "Map each criterion to a test"
        - "Run automated tests"
        - "Run manual validations if needed"
      goal: "100% of criteria met"
    
    dimension_4:
      name: "Performance"
      tools: ["BenchmarkDotNet", "dotMemory", "Visual Studio Profiler"]
      target_metrics:
        response_time: "< 200ms for APIs"
        memory: "< 512MB"
        cpu: "< 80%"
    
    dimension_5:
      name: "Security"
      tests:
        - "SQL Injection"
        - "XSS"
        - "CSRF"
        - "Authentication Bypass"
        - "Authorization Bypass"
      tools: ["OWASP ZAP", "Snyk", "dotnet-security-analyzer"]
    
    dimension_6:
      name: "Integration and Compatibility"
      commands:
        - "dotnet test --filter Category=Integration"
      validations:
        - "API contracts"
        - "Backward compatibility"
        - "Logs and monitoring"
  
  possible_decisions:
    approved:
      criteria:
        - "All 6 dimensions validated"
        - "No critical issues"
        - "All acceptance criteria met"
      next_step: "14-cd-04-code-review.txt"
    
    approved_with_reservations:
      criteria:
        - "Most dimensions validated"
        - "Non-critical issues identified"
        - "Reservations can be resolved later"
      next_step: "14-cd-04-code-review.txt (with documented reservations)"
    
    rejected:
      criteria:
        - "Critical issues found"
        - "Acceptance criteria not met"
        - "Important dimensions failing"
      next_step: "12-cd-02-implementation.txt (fixes)"
  
  related_command: "13-cd-03-validation-tests.txt"
  
  validation:
    - "All 6 dimensions assessed"
    - "Evidence collected (screenshots, logs)"
    - "Decision justified"
    - "Next steps defined"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# DIRECTORY STRUCTURE
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

directory_structure:
  description: |
    The validation report is saved together with the other artifacts:
    
    docs/transformation/{feature-id}/execution/
    ├── contexts-index.yml
    ├── mt-XXX-YYY-context.yml         # Micro-task context
    ├── mt-XXX-YYY-setup.yml           # Environment setup
    ├── mt-XXX-YYY-validation.yml      # ← This file
    └── README.md
